# トップの画面（島の一覧）の、管理人の書く欄。ここを直すと、次の反映から画面が変わります。
# ゲームの計算には関わりません。AI の入り口では、/api/world の updates・message・links で読めます。
#
# 更新履歴は、管理画面の「更新履歴」で足す・直す・隠すができます（世界ごと）。
# コミットの文に次の形の行を入れると、そのコミットが反映されたとき（migrate のとき）、コミットの
# 日付で管理画面の更新履歴に写されます（server/web/top.py の sync_updates）。
#   更新履歴: 地図のマスの情報を、押したマスの横に出すようにしました。
# 遊ぶ人に見える変更のときだけ書きます（中の直しや試験だけの変更には書かない）。
#
# updates: 仕組みができる前の更新履歴（同じく管理画面へ一度だけ写します。ここに足さなくてよい）
# update_fixes: 写した後で隠す行（hide: true）と、今の動きとずれて直す行（to: 直した文）。
#   元の文のままの行にだけ効き、管理画面で直した行には効きません。コミットの文は後から直せないので、
#   試験・設計書・台帳だけの変更に誤って書いた行や、後の変更でずれた行はここに足します。
# message: 管理人より（改行はそのまま出ます）
# links:   リンク集（url が / で始まるものはこのサイトの中）

updates:
  - date: 2026-10-18
    text: ターンの間隔を 4 時間にしました。
  - date: 2026-10-17
    text: サービスの仕事と人口の増え方を見直しました（バランス調整）。
  - date: 2026-10-16
    text: AI の国が遊べるようになりました（国名に「AI」の印が付きます）。
  - date: 2026-10-16
    text: 日付を「箱庭暦○年○月」で書くようにしました。
  - date: 2026-10-15
    text: 政治と体制（政情・選挙と議会・憲法改正・計画経済）と、国どうしの外交を足しました。
  - date: 2026-10-15
    text: 産業の経験と称号、国際金融を足しました。

update_fixes:
  # 試験・設計書・台帳・中の直しだけの変更に書かれた行（遊ぶ人には関係がない）
  - text: なし（試験だけ）
    hide: true
  - text: 台帳の行を両方残した。
    hide: true
  - text: ホームから命令のページへのリンクの試験を合わせました。
    hide: true
  - text: 建設の命令の文の試験を「農場（穀物）」の形に直しました。
    hide: true
  - text: 統計の画面へのリンクの試験を、入口を 7 つにした形に合わせました。
    hide: true
  - text: 計画・政治・産業の鎖・日誌・得意産業の試験を、入口のタブとホームから見るように直しました。
    hide: true
  - text: 画面の構成の作り直しの決まり（UI-81）の試験の欄に、画面と API・MCP の一致の試験と、前の URL を品目のページへ飛ばす試験を書きました。
    hide: true
  - text: 決めたことの台帳の行を、とき順に並べ直しました。
    hide: true
  - text: 設計書の決まりの番号が、ほかの変更と重ならないように直しました。
    hide: true
  - text: 施設の窓を開くとき、生産調整中のわけが要らない施設では余計な読み込みをしないようにしました。
    hide: true
  # 外貨を使う順（FX-76）は、既定では取り置かない（trade.plan_fx_reserved = 0）ことになったので、
  # 今の動き（輸出の計画 PL-62 の蓄えの使い方）に合わせる
  - text: 計画経済の国営の商社は、少ない外貨を燃料と主食、設備、原料、消費財の順に使うようにしました。
    to: 計画経済の国は、外貨の蓄えが目標より少ない間、蓄えを燃料と主食・設備の輸入に回し、原料と部品・消費財の輸入には使わないようにしました。

