# 既定のテーマ。登録したPNGの絵で地形・施設・住宅を描きます。
name: default
tile_width: 64        # マスの幅（ピクセル）
tile_height: 32       # マスの高さ（ピクセル）
step_height: 8        # 地面の高さ1段あたりのピクセル
terrain:              # 地形ごとの色（上面、左の側面、右の側面）
  sea:      {top: "#2f6db5", left: "#24558d", right: "#1d4774"}
  shallows: {top: "#5b9bd5", left: "#4a80b0", right: "#3d6b94"}
  plain:    {top: "#8cc163", left: "#6f9a4e", right: "#5c8040"}
  forest:   {top: "#3f8a3a", left: "#326e2e", right: "#295a26"}
  mountain: {top: "#648247", left: "#4f6939", right: "#3f5530"}
fallback: {top: "#cccccc", left: "#aaaaaa", right: "#999999"}
# 施設の色と高さ（段）。絵の代わりに色付きの箱で描きます。色は上面の色で、側面は少し暗くします。
facility_unit: 10       # 施設の高さ1段あたりのピクセル
facilities:
  farm:                     {color: "#e3c565", height: 0.3}
  lumber_camp:              {color: "#7a5a35", height: 1}
  quarry:                   {color: "#b9b2a6", height: 1}
  mine:                     {color: "#5e5248", height: 1.5}
  fishing_port:             {color: "#4fa3c7", height: 1}
  steel_mill:               {color: "#8a4b3c", height: 3}
  building_materials_plant: {color: "#c49a6c", height: 2}
  machinery_plant:          {color: "#6c7a89", height: 2.5}
  food_factory:             {color: "#e08e5a", height: 2}
  consumer_goods_factory:   {color: "#b57fb3", height: 2}
  thermal_power_plant:      {color: "#555b63", height: 3.5}
  hydro_power_plant:        {color: "#3d7ea6", height: 2.5}
  government_office:        {color: "#f2efe6", height: 3}
  bank:                     {color: "#d8c27a", height: 2.5}
  housing:                  {color: "#d9826b", height: 1}   # 高さは住宅地の段階（settlements の height）
facility_fallback: {color: "#bbbbbb", height: 1.5}
capital_roof: "#c9a227"   # 首都の建物の屋根の色
construction: "#ffffff"   # 工事中の枠の色
power_line: "#333333"     # 送電線
no_development: "rgba(255, 255, 255, 0.45)"  # 開発を止めたマスの斜線
office: "rgba(90, 120, 200, 0.35)"           # オフィス街のマス
industrial: "rgba(230, 140, 40, 0.45)"       # 工業団地のマス
# 絵（スプライト）。名前 → このフォルダからのファイル名。ここにないものは上の色で描きます。
# 名前は terrain/<地形>、facility/<施設の sprite>、housing/<住宅地の段階>、capital/<施設の sprite>（首都の建物）、
# construction（工事中）。大きさ・基準点などの決まりは docs/map-art.md を見てください。
# 例: terrain/plain: sprites/terrain/plain.svg
#     facility/steel_mill: {file: sprites/facility/steel_mill.svg, anchor: [32, 80]}
#     facility/bank: {file: sprites/facility/bank.png, scale: 0.5}   # 2倍の大きさで描いた PNG
sprite_scale: 1         # 画像の 1 ピクセルを何ピクセルとして描くか（項目の scale がなければこれ）
sprites:
  terrain/sea: {file: sprites/terrain/sea.png, scale: 0.5}
  terrain/shallows: {file: sprites/terrain/shallows.png, scale: 0.5}
  terrain/plain: {file: sprites/terrain/plain.png, scale: 0.5}
  terrain/forest: {file: sprites/terrain/forest.png, scale: 0.5}
  terrain/mountain: {file: sprites/terrain/mountain.png, scale: 0.5}
  housing/village: {file: sprites/housing/village.png, scale: 0.5}
  housing/town: {file: sprites/housing/town.png, scale: 0.5}
  housing/city: {file: sprites/housing/city.png, scale: 0.5}
  housing/metropolis: {file: sprites/housing/metropolis.png, scale: 0.5}
  facility/farm: {file: sprites/facility/farm.png, scale: 0.5}
  facility/lumber_camp: {file: sprites/facility/lumber_camp.png, scale: 0.5}
  facility/quarry: {file: sprites/facility/quarry.png, scale: 0.5}
  facility/mine: {file: sprites/facility/mine.png, scale: 0.5}
  facility/fishing_port: {file: sprites/facility/fishing_port.png, scale: 0.5}
  facility/steel_mill: {file: sprites/facility/steel_mill.png, scale: 0.5}
  facility/building_materials_plant: {file: sprites/facility/building_materials_plant.png, scale: 0.5}
  facility/machinery_plant: {file: sprites/facility/machinery_plant.png, scale: 0.5}
  facility/food_factory: {file: sprites/facility/food_factory.png, scale: 0.5}
  facility/consumer_goods_factory: {file: sprites/facility/consumer_goods_factory.png, scale: 0.5}
  facility/thermal_power_plant: {file: sprites/facility/thermal_power_plant.png, scale: 0.5}
  facility/hydro_power_plant: {file: sprites/facility/hydro_power_plant.png, scale: 0.5}
  facility/government_office: {file: sprites/facility/government_office.png, scale: 0.5}
  facility/bank: {file: sprites/facility/bank.png, scale: 0.5}
  capital/government_office: {file: sprites/capital/government_office.png, scale: 0.5}
  construction: {file: sprites/construction.png, scale: 0.5}
