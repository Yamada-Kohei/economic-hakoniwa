# 既定のテーマ。下の sprites に絵があるものは絵で、ないものは色付きのひし形と立方体で描きます。
name: default
tile_width: 64        # マスの幅（ピクセル）
tile_height: 32       # マスの高さ（ピクセル）
step_height: 8        # 地面の高さ1段あたりのピクセル
terrain:              # 地形ごとの色（上面、左の側面、右の側面）
  sea:      {top: "#2f6db5", left: "#24558d", right: "#1d4774"}
  shallows: {top: "#5b9bd5", left: "#4a80b0", right: "#3d6b94"}
  plain:    {top: "#8cc163", left: "#6f9a4e", right: "#5c8040"}
  forest:   {top: "#3f8a3a", left: "#326e2e", right: "#295a26"}
  mountain: {top: "#9a8b77", left: "#7b6f5f", right: "#665c4f"}
fallback: {top: "#cccccc", left: "#aaaaaa", right: "#999999"}
# 施設の色と高さ（段）。絵の代わりに色付きの箱で描きます。色は上面の色で、側面は少し暗くします。
facility_unit: 10       # 施設の高さ1段あたりのピクセル
facilities:
  farm:                     {color: "#e3c565", height: 0.3}
  lumber_camp:              {color: "#7a5a35", height: 1}
  quarry:                   {color: "#b9b2a6", height: 1}
  mine:                     {color: "#5e5248", height: 1.5}
  fishing_port:             {color: "#4fa3c7", height: 1}
  steel_mill:               {color: "#8a4b3c", height: 3}
  building_materials_plant: {color: "#c49a6c", height: 2}
  machinery_plant:          {color: "#6c7a89", height: 2.5}
  food_factory:             {color: "#e08e5a", height: 2}
  consumer_goods_factory:   {color: "#b57fb3", height: 2}
  thermal_power_plant:      {color: "#555b63", height: 3.5}
  hydro_power_plant:        {color: "#3d7ea6", height: 2.5}
  government_office:        {color: "#f2efe6", height: 3}
  police:                   {color: "#3b5ba5", height: 2}     # フェーズ3-4
  school:                   {color: "#e4b94f", height: 2}     # フェーズ2-3（色の表に抜けていた）
  university:               {color: "#8e5aa6", height: 3}      # 同上
  bank:                     {color: "#d8c27a", height: 2.5}
  port:                     {color: "#c8473a", height: 2.5}   # フェーズ3-1
  shipyard:                 {color: "#d9a62a", height: 3}
  trading:                  {color: "#9db6c7", height: 3}
  oil_well:                 {color: "#2f2f2f", height: 2}     # フェーズ3-2
  refinery:                 {color: "#8c8f6a", height: 3}
  aluminium_smelter:        {color: "#a9b4bd", height: 3}
  textile_mill:             {color: "#c98fa0", height: 2}
  ranch:                    {color: "#a8c46a", height: 0.5}
  automobile_plant:         {color: "#4a6fa5", height: 2.5}
  auto_parts_plant:         {color: "#5b7fb0", height: 2}       # 回7 後半
  # 記念碑（フェーズ4-1）
  monument_monolith:        {color: "#2f3236", height: 3}
  monument_custom:          {color: "#e8e4da", height: 2.5}
  monument_founding:        {color: "#efeae0", height: 3.5}
  monument_peace:           {color: "#e6e2d8", height: 3.5}
  monument_battle:          {color: "#d9c08a", height: 3}
  monument_cenotaph:        {color: "#4a4e53", height: 1}
  monument_leader:          {color: "#7a6640", height: 3.5}
  monument_worker:          {color: "#b8bec4", height: 3.5}
  monument_tower:           {color: "#c8473a", height: 5}
  monument_ledger:          {color: "#d9a62a", height: 3}
  monument_verification:    {color: "#3d4044", height: 3.5}
  department_store:         {color: "#c8473a", height: 3}     # 回7
  housing:                  {color: "#d9826b", height: 1}   # 高さは住宅地の段階（settlements の height）
facility_fallback: {color: "#bbbbbb", height: 1.5}
capital_roof: "#c9a227"   # 首都の建物の屋根の色
construction: "#ffffff"   # 工事中の枠の色
power_line: "#333333"     # 送電線
no_development: "rgba(255, 255, 255, 0.45)"  # 開発を止めたマスの斜線
office: "rgba(90, 120, 200, 0.35)"           # オフィス街のマス
industrial: "rgba(230, 140, 40, 0.45)"       # 工業団地のマス
commercial: "rgba(220, 70, 150, 0.35)"       # 商業地のマス
# 絵（スプライト）。名前 → このフォルダからのファイル名。ここにないものは上の色で描きます。
# 名前は terrain/<地形>、facility/<施設の sprite>、housing/<住宅地の段階>、capital/<施設の sprite>（首都の建物）、
# construction（工事中）。大きさ・基準点などの決まりは docs/map-art.md を見てください。
# 例: terrain/plain: sprites/terrain/plain.svg
#     facility/steel_mill: {file: sprites/facility/steel_mill.svg, anchor: [32, 80]}
#     facility/bank: {file: sprites/facility/bank.png, scale: 0.5}   # 2倍の大きさで描いた PNG
sprite_scale: 1         # 画像の 1 ピクセルを何ピクセルとして描くか（項目の scale がなければこれ）
sprites:
  # 海沿いの施設（coastal）は、海のある向きごとに描き分ける。名前のままの絵は海が右下（x + 1）、
  # @sw は左下（y + 1）、@ne は右上（y - 1）、@nw は左上（x - 1）。水面を海の高さまで下げて描くので、
  # 海が手前の絵は下の頂点より下に伸び、anchor で基準点を合わせる
  terrain/sea: sprites/terrain/sea.svg
  terrain/shallows: sprites/terrain/shallows.svg
  terrain/plain: sprites/terrain/plain.svg
  terrain/forest: sprites/terrain/forest.svg
  terrain/mountain: sprites/terrain/mountain.svg
  facility/aluminium_smelter: sprites/facility/aluminium_smelter.svg
  facility/auto_parts_plant: sprites/facility/auto_parts_plant.svg
  facility/automobile_plant: sprites/facility/automobile_plant.svg
  facility/bank: sprites/facility/bank.svg
  facility/building_materials_plant: sprites/facility/building_materials_plant.svg
  facility/consumer_goods_factory: sprites/facility/consumer_goods_factory.svg
  facility/farm: sprites/facility/farm.svg
  facility/department_store: sprites/facility/department_store.svg
  facility/fishing_port: {file: sprites/facility/fishing_port.svg, anchor: [32, 48]}
  facility/fishing_port@sw: {file: sprites/facility/fishing_port@sw.svg, anchor: [32, 48]}
  facility/fishing_port@ne: sprites/facility/fishing_port@ne.svg
  facility/fishing_port@nw: sprites/facility/fishing_port@nw.svg
  facility/food_factory: sprites/facility/food_factory.svg
  facility/government_office: sprites/facility/government_office.svg
  facility/hydro_power_plant: sprites/facility/hydro_power_plant.svg
  facility/lumber_camp: sprites/facility/lumber_camp.svg
  facility/machinery_plant: sprites/facility/machinery_plant.svg
  facility/mine: sprites/facility/mine.svg
  facility/oil_well: sprites/facility/oil_well.svg
  facility/police: sprites/facility/police.svg
  facility/monument_monolith: sprites/facility/monument_monolith.svg
  facility/monument_custom: sprites/facility/monument_custom.svg
  facility/monument_founding: sprites/facility/monument_founding.svg
  facility/monument_peace: sprites/facility/monument_peace.svg
  facility/monument_battle: sprites/facility/monument_battle.svg
  facility/monument_cenotaph: sprites/facility/monument_cenotaph.svg
  facility/monument_leader: sprites/facility/monument_leader.svg
  facility/monument_worker: sprites/facility/monument_worker.svg
  facility/monument_tower: sprites/facility/monument_tower.svg
  facility/monument_ledger: sprites/facility/monument_ledger.svg
  facility/monument_verification: sprites/facility/monument_verification.svg
  facility/port: {file: sprites/facility/port.svg, anchor: [32, 60]}
  facility/port@sw: {file: sprites/facility/port@sw.svg, anchor: [32, 60]}
  facility/port@ne: sprites/facility/port@ne.svg
  facility/port@nw: sprites/facility/port@nw.svg
  facility/quarry: sprites/facility/quarry.svg
  facility/ranch: sprites/facility/ranch.svg
  facility/refinery: sprites/facility/refinery.svg
  facility/school: sprites/facility/school.svg
  facility/shipyard: {file: sprites/facility/shipyard.svg, anchor: [32, 65]}
  facility/shipyard@sw: {file: sprites/facility/shipyard@sw.svg, anchor: [32, 65]}
  facility/shipyard@ne: sprites/facility/shipyard@ne.svg
  facility/shipyard@nw: sprites/facility/shipyard@nw.svg
  facility/steel_mill: sprites/facility/steel_mill.svg
  facility/textile_mill: sprites/facility/textile_mill.svg
  facility/thermal_power_plant: sprites/facility/thermal_power_plant.svg
  facility/trading: sprites/facility/trading.svg
  facility/university: sprites/facility/university.svg
  housing/city: sprites/housing/city.svg
  housing/metropolis: sprites/housing/metropolis.svg
  housing/town: sprites/housing/town.svg
  housing/village: sprites/housing/village.svg
  # 首都の官庁は、体制で決まる建物（政治の仕組み-元首の形）の組み合わせの絵で描く
  capital/parliament-palace: sprites/capital/parliament-palace.svg
  capital/parliament-presidential_office: sprites/capital/parliament-presidential_office.svg
  capital/official_residence-palace: sprites/capital/official_residence-palace.svg
  capital/official_residence-presidential_office: sprites/capital/official_residence-presidential_office.svg
  capital/party_headquarters-palace: sprites/capital/party_headquarters-palace.svg
  capital/party_headquarters-presidential_office: sprites/capital/party_headquarters-presidential_office.svg
  # 軍事（フェーズ4-2）。部隊の印と陣地は島の俯瞰図、fleet/ は世界マップの船（横から見た絵）
  facility/barracks: sprites/facility/barracks.svg
  facility/naval_base: {file: sprites/facility/naval_base.svg, anchor: [32, 49]}
  facility/naval_base@sw: {file: sprites/facility/naval_base@sw.svg, anchor: [32, 49]}
  facility/naval_base@ne: sprites/facility/naval_base@ne.svg
  facility/naval_base@nw: sprites/facility/naval_base@nw.svg
  facility/radar: sprites/facility/radar.svg
  overlay/trench_back: sprites/overlay/trench_back.svg
  overlay/trench_front: sprites/overlay/trench_front.svg
  overlay/occupied: sprites/overlay/occupied.svg      # 建物のあと
  overlay/contaminated: sprites/overlay/contaminated.svg  # 地形のあと・建物より先
  unit/infantry: {file: sprites/unit/infantry.svg, anchor: [14, 28]}
  fleet/frigate: {file: sprites/fleet/frigate.svg, anchor: [12, 10]}
  facility/arms_plant: sprites/facility/arms_plant.svg
  facility/copper_smelter: sprites/facility/copper_smelter.svg
  facility/electronics_plant: sprites/facility/electronics_plant.svg
  facility/fortress: sprites/facility/fortress.svg
  facility/missile_plant: sprites/facility/missile_plant.svg
  facility/nuclear_facility: sprites/facility/nuclear_facility.svg
  facility/missile_base: sprites/facility/missile_base.svg
  facility/air_defense: sprites/facility/air_defense.svg
  unit/armor: {file: sprites/unit/armor.svg, anchor: [14, 28]}
  fleet/corvette: {file: sprites/fleet/corvette.svg, anchor: [10, 9]}
  fleet/submarine: {file: sprites/fleet/submarine.svg, anchor: [11, 7]}
  fleet/transport: {file: sprites/fleet/transport.svg, anchor: [12, 10]}

# 絵のファイルは置いたが、使う施設や描く仕組みがまだ入っていないもの（軍事の絵。docs/map-art.md）。
# ゲームの描画は読まない。入ったら、その行を上の sprites へ移す（海沿いの anchor はここに書いてある値のまま）
pending_sprites:
  unit/rebels: {file: sprites/unit/rebels.svg, anchor: [14, 28]}
  overlay/battlefield: sprites/overlay/battlefield.svg  # 地形のあと・建物より先
  overlay/ruined: sprites/overlay/ruined.svg          # 建物の代わり（重ねない）
