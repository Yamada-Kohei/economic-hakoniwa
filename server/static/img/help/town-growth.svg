<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 622" width="480" height="622" font-family='"Noto Sans JP","Hiragino Kaku Gothic ProN","Meiryo","WenQuanYi Zen Hei",sans-serif' role="img" aria-labelledby="t d">
<title id="t">町が育つしくみ</title><desc id="d">通勤圏の中に人手の足りない施設があり、住まいが足りず、資材がそろったときに町の床が増え、段階が上がることを示す図。</desc>
<rect width="480" height="622" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="10" y="10" width="460" height="180" rx="8" fill="#eef7ec" stroke="#6f8fd0" stroke-width="1.5"/>
<ellipse cx="150" cy="100" rx="135" ry="78" fill="#ffffff" fill-opacity="0.55" stroke="#1f4fa8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="150" y="38" font-size="13" text-anchor="middle" fill="#1f4fa8" font-weight="bold">通勤圏</text>
<polygon points="130,92 152,92 141,80" fill="#c0504d"/>
<rect x="132" y="92" width="18" height="14" fill="#ffffff" stroke="#102a6b" stroke-width="1"/>
<polygon points="156,98 178,98 167,86" fill="#c0504d"/>
<rect x="158" y="98" width="18" height="14" fill="#ffffff" stroke="#102a6b" stroke-width="1"/>
<polygon points="104,100 126,100 115,88" fill="#c0504d"/>
<rect x="106" y="100" width="18" height="14" fill="#ffffff" stroke="#102a6b" stroke-width="1"/>
<polygon points="140,122 162,122 151,110" fill="#c0504d"/>
<rect x="142" y="122" width="18" height="14" fill="#ffffff" stroke="#102a6b" stroke-width="1"/>
<polygon points="116,126 138,126 127,114" fill="#c0504d"/>
<rect x="118" y="126" width="18" height="14" fill="#ffffff" stroke="#102a6b" stroke-width="1"/>
<text x="130" y="160" font-size="13" text-anchor="middle" fill="#102a6b" font-weight="bold">町（住む人）</text>
<rect x="212" y="70" width="46" height="26" fill="#f4c06a" stroke="#102a6b" stroke-width="1.2"/>
<rect x="218" y="56" width="8" height="14" fill="#f4c06a" stroke="#102a6b" stroke-width="1.2"/>
<rect x="240" y="62" width="8" height="8" fill="#f4c06a" stroke="#102a6b" stroke-width="1.2"/>
<text x="236" y="118" font-size="13" text-anchor="middle" fill="#102a6b" font-weight="bold">人手不足の工場</text>
<line x1="165" y1="104" x2="214" y2="90" stroke="#1b6b2f" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="182" y="78" font-size="13" text-anchor="middle" fill="#1b6b2f">通勤</text>
<rect x="390" y="112" width="46" height="26" fill="#d6d6d6" stroke="#102a6b" stroke-width="1.2"/>
<rect x="396" y="98" width="8" height="14" fill="#d6d6d6" stroke="#102a6b" stroke-width="1.2"/>
<rect x="418" y="104" width="8" height="8" fill="#d6d6d6" stroke="#102a6b" stroke-width="1.2"/>
<text x="413" y="160" font-size="13" text-anchor="middle" fill="#5a6a90">遠すぎて通えない</text>
<text x="240" y="222" font-size="15" text-anchor="middle" fill="#102a6b" font-weight="bold">次が全部そろったときだけ、床が増えます</text>
<rect x="20" y="240" width="440" height="38" rx="6" fill="#f4f8ff" stroke="#6f8fd0" stroke-width="1.5"/>
<text x="240.0" y="264.3" font-size="14" text-anchor="middle" fill="#102a6b" font-weight="bold">通勤圏に、人手が足りない施設がある</text>
<circle cx="40" cy="259" r="11" fill="#1f4fa8"/>
<text x="40" y="264" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
<rect x="20" y="286" width="440" height="38" rx="6" fill="#f4f8ff" stroke="#6f8fd0" stroke-width="1.5"/>
<text x="240.0" y="310.3" font-size="14" text-anchor="middle" fill="#102a6b" font-weight="bold">近くの町の空きと、仕事のない人では足りない</text>
<circle cx="40" cy="305" r="11" fill="#1f4fa8"/>
<text x="40" y="310" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<rect x="20" y="332" width="440" height="38" rx="6" fill="#f4f8ff" stroke="#6f8fd0" stroke-width="1.5"/>
<text x="240.0" y="356.3" font-size="14" text-anchor="middle" fill="#102a6b" font-weight="bold">住む人が望む広さで使う床が、今の床にほぼ届く</text>
<circle cx="40" cy="351" r="11" fill="#1f4fa8"/>
<text x="40" y="356" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<rect x="20" y="378" width="440" height="38" rx="6" fill="#f4f8ff" stroke="#6f8fd0" stroke-width="1.5"/>
<text x="240.0" y="402.3" font-size="14" text-anchor="middle" fill="#102a6b" font-weight="bold">床を足す資材がそろっている</text>
<circle cx="40" cy="397" r="11" fill="#1f4fa8"/>
<text x="40" y="402" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
<rect x="20" y="424" width="440" height="38" rx="6" fill="#f4f8ff" stroke="#6f8fd0" stroke-width="1.5"/>
<text x="240.0" y="448.3" font-size="14" text-anchor="middle" fill="#102a6b" font-weight="bold">上の段階へは、上下水道の整備度も足りている</text>
<circle cx="40" cy="443" r="11" fill="#1f4fa8"/>
<text x="40" y="448" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
<line x1="240" y1="462" x2="240" y2="482" stroke="#1f4fa8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="482" width="440" height="50" rx="6" fill="#e2f4e5" stroke="#1b6b2f" stroke-width="1.5"/>
<text x="240.0" y="502.9" font-size="14" text-anchor="middle" fill="#102a6b" font-weight="bold">町のマスの床が増える</text>
<text x="240.0" y="521.8" font-size="13" text-anchor="middle" fill="#102a6b">段階の上限を超えると、次の段階（村・町・都市…）に上がる</text>
<text x="240" y="556" font-size="13" text-anchor="middle" fill="#5a6a90">資材は家計が市場で買う（計画経済では国が買う）。</text>
<rect x="20" y="570" width="440" height="40" rx="6" fill="#fff1d0" stroke="#8a4b00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="240.0" y="594.9" font-size="13" text-anchor="middle" fill="#102a6b" font-weight="bold">近道: 国は命令で、国の住宅の床を足せる</text>
</svg>
