{% extends "base.html" %}{% load i18n %}
{% block content %}
<h1>{% translate "登録" %}</h1>
{% if blocked %}
  <p class="error">{% translate "この接続元からは、すでに登録されています。1人1つのアカウントでお願いします。" %}</p>
{% else %}
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">{% translate "登録する" %}</button></form>
  <p class="muted">{% translate "登録すると、続けて島を作る（建国する）画面に進みます。" %}</p>
{% endif %}
{% endblock %}
