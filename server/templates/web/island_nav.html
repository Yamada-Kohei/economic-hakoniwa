{% load i18n %}{# 島の画面の入口（UI-71）。中身は server/web/island_nav.py。display_tags の island_nav で入れる #}<nav class="island-nav" aria-label="{% translate '島の画面' %}">
  {% for g in groups %}<a href="{{ g.url }}"{% if g.current %} aria-current="page"{% endif %}>{{ g.name }}</a>
  {% endfor %}
</nav>
{% if tabs %}<nav class="island-subnav" aria-label="{% translate '入口の中のタブ' %}">
  {% for t in tabs %}<a href="{{ t.url }}"{% if t.current %} aria-current="page"{% endif %}>{{ t.name }}</a>
  {% endfor %}
</nav>{% endif %}
