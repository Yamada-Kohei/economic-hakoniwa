{% load i18n %}
{# JavaScript が作る欄の文言もテンプレートの翻訳に通す。 #}
<div id="military-text" hidden
  data-id="{% translate '番号' %}" data-kind="{% translate '種類' %}"
  data-location="{% translate '場所' %}" data-soldiers="{% translate '兵（現在 / 定員）' %}"
  data-equipment="{% translate '装備（現在 / 必要数）' %}" data-status="{% translate '状態' %}"
  data-order="{% translate '今の命令' %}" data-aboard="{% translate '乗船先' %}"
  data-ships="{% translate '艦の数' %}" data-docked="{% translate '母港につないでいる' %}"
  data-crew="{% translate '乗員（現在 / 定員）' %}" data-steps="{% translate '残りの区画' %}"
  data-cargo="{% translate '荷（部隊の番号）' %}" data-capacity="{% translate '運べる重さ（トン）' %}"
  data-forming="{% translate '編成中' %}" data-ready="{% translate 'そろった' %}"
  data-none="{% translate 'なし' %}" data-yes="{% translate 'はい' %}" data-no="{% translate 'いいえ' %}"
  data-empty="{% translate '該当するものはありません。' %}" data-loading="{% translate '読み込み中…' %}"
  data-error="{% translate '軍の情報を読み込めませんでした。画面を開き直してください。' %}"
  data-save-error="{% translate '命令を追加できませんでした。通信を確かめてください。' %}"
  data-empty-input="{% translate '変更する項目を入力してください。' %}"
  data-added="{% translate '命令の列の後ろに追加しました。ターン更新で実行されます。' %}"
  data-move="{% translate '移動' %}" data-dig="{% translate '陣地を掘る' %}"
  data-stop="{% translate '止める' %}" data-sail="{% translate '航海' %}"
  data-disband="{% translate '解散' %}"
  data-confirm="{% translate '部隊を解散する命令を追加します。兵は未配属に、装備は国の倉庫に戻ります。よろしいですか。' %}"
  data-destination="{% translate '行き先を選ぶ' %}" data-sail-destination="{% translate '航海先を選ぶ' %}"
  data-picking="{% translate '地図で行き先を選んでください。Esc または取り消しで終了します。' %}"
  data-cancel="{% translate '取り消し' %}" data-add="{% translate '命令に追加' %}"
  data-form-unit="{% translate '部隊の編成' %}" data-unit="{% translate '部隊' %}"
  data-fleet="{% translate '艦隊' %}" data-transport="{% translate '輸送船団' %}" data-load="{% translate '載せる' %}"
  data-unload="{% translate '降ろす' %}" data-port="{% translate '降ろす軍港のマス' %}"
  data-map="{% translate '島の地図で開く' %}" data-current="{% translate '今見えている' %}"
  data-previous="{% translate '前に見た場所' %}" data-turn="{% translate '最後に見たターン' %}"
  data-barracks="{% translate '置ける兵の数' %}" data-naval-base="{% translate '艦隊の母港' %}"
  data-radar="{% translate '見える範囲（区画）' %}" data-fortress="{% translate '守りの兵の数' %}"
  data-details="{% translate '中身' %}" data-facility="{% translate '施設の番号' %}"
  data-remaining="{% translate '残りのターン' %}"
  data-owner="{% translate '国の番号' %}"></div>
