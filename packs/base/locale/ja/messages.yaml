# ターンログや画面の文面。{ } の中は文の引数。
# 引数 facility・good・terrain・order・level・reason は、その種類の表示名に置き換わります。
# good のある文では {unit} がその資源の単位に、goods（資源の並び）は表示名を「・」でつないだものになります。

