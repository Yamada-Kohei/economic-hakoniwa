# ターンログや画面の文面。{ } の中は文の引数。
# 引数 facility・good・terrain・order・level・reason は、その種類の表示名に置き換わります。
# good のある文では {unit} がその資源の単位に、goods（資源の並び）は表示名を「・」でつないだものになります。
# マスを持たない施設（運送業・海運業）の文では、「({x}, {y}) の」が off_map_place に置き換わります。
# {turn:date} のように書いた引数（ターンの数）は、その時点の暦の日付（calendar_turn）になります。
off_map_place: "島の"

# 暦（hakoniwa_core/dates.py）。ある時点のターンの書き方
calendar_date: "{calendar}{year}年{month}月"
calendar_before: "{calendar}の始まる前"
calendar_turn: "{date}（ターン {turn}）"
turn_point: "ターン {turn}"

