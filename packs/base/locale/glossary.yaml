# 用語辞書（多言語対応の「言葉の決め」）
#
# ゲームの言葉の骨格になる用語について、言語ごとの訳語をここで固定する。
# 文そのものの翻訳（locale/<言語>/ の各ファイル）を作るときは、
# ここにある用語はこの辞書の訳語を使うこと。
#
# 元の語:
# - 名前類は packs/base/locale/ja/ の各ファイルの表示名そのまま。
#   分類の名前は元のファイル名とそろえてある。
# - core は messages.yaml の文面に繰り返し出てくる、核になる言葉を拾ったもの。
#
# 訳の扱い:
# - en・zh・ko・ru・de の訳はすべて「下訳」（未検証の仮置き）。
#   HAL や DeepSeek の下訳と同じ扱いで、そのまま表示に使わず、
#   必ず分かる人の確認を通してから使うこと。
# - 確信の持てない言語は空欄にし、uncertain にその言語を挙げてある。
#   空欄は「まだ決まっていない」という印。
# - note は訳すときの注意（ゲーム固有の概念など）。
#
# このファイルはゲームの読み込み対象ではない
# （読み込みは locale/<言語>/<種類>.yaml だけ）。置き場所は locale/<言語>/ の隣。
# 2026-11-26 作成（多言語対応ステップ3、掲示板 #6109）。

