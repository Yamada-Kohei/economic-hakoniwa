# 命令。admin_cost: 要る行政力（ふつうは 1。名前の変更は 0 で、ほかの命令の数に数えない）、
# payload: 命令の中身の形（JSON Schema）。
# 処理する関数は hakoniwa_core/modules/ の各モジュールで登録します。
rename_island:
  admin_cost: 0
  payload:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name: {type: string, minLength: 1, maxLength: 32}

rename_facility:
  admin_cost: 0
  payload:
    type: object
    required: [x, y, name]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      name: {type: string, maxLength: 32}   # 空にすると自動の名前に戻る

rename_place:
  admin_cost: 0
  payload:
    type: object
    required: [x, y, name]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}         # このマスを含む地名の区画の名前を変える
      y: {type: integer, minimum: 0}
      name: {type: string, minLength: 1, maxLength: 16}

build:
  admin_cost: 1
  payload:
    type: object
    required: [facility, x, y]
    additionalProperties: false
    properties:
      facility: {type: string}
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      recipe: {type: string}                # 作り方が複数ある施設では必ず選ぶ
      name: {type: string, maxLength: 32}

demolish:
  admin_cost: 1
  payload:
    type: object
    required: [x, y]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}

build_power_line:
  admin_cost: 1
  payload:
    type: object
    required: [tiles]
    additionalProperties: false
    properties:
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

build_infrastructure:                     # 道路・鉄道・上下水道・送電網の工事を列に並べる（フェーズ2-3）
  admin_cost: 1
  payload:
    type: object
    required: [kind, tiles]
    additionalProperties: false
    properties:
      kind: {type: string}                  # infrastructure.yaml の種類
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

set_no_development:
  admin_cost: 1
  payload:
    type: object
    required: [tiles, value]
    additionalProperties: false
    properties:
      value: {type: boolean}                # true で指定、false で解除
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

set_priority:
  admin_cost: 1
  payload:
    type: object
    required: [x, y, priority]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      priority: {type: integer, minimum: 0, maximum: 9}

change_recipe:                            # 国営施設の作り方の変更（フェーズ3-2）
  admin_cost: 1
  payload:
    type: object
    required: [x, y, recipe]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      recipe: {type: string, pattern: "^[a-z][a-z0-9_]*$"}

# --- お金の経済（フェーズ2） ---

set_taxes:
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:                           # 税率（%）。書いた税だけ変わる
      income_tax: {type: number, minimum: 0, maximum: 100}
      corporate_tax: {type: number, minimum: 0, maximum: 100}
      consumption_tax: {type: number, minimum: 0, maximum: 100}

set_budget:
  admin_cost: 1
  payload:
    type: object                          # 項目（game.yaml の fiscal.budget_items）ごとの年の予算
    minProperties: 1
    propertyNames: {pattern: "^[a-z_]+$"}
    additionalProperties: {type: integer, minimum: 0}

set_labor_policy:
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      minimum_wage: {type: integer, minimum: 0}                     # 0 で決めない
      unemployment_benefit: {type: number, minimum: 0, maximum: 100} # 平均賃金に対する %

set_price_cap:
  admin_cost: 1
  payload:
    type: object
    required: [good, price]
    additionalProperties: false
    properties:
      good: {type: string}
      price: {type: integer, minimum: 0}  # 0 で上限をなくす

warehouse_trade:
  admin_cost: 1
  payload:
    type: object
    required: [good, side, quantity]
    additionalProperties: false
    properties:
      good: {type: string}
      side: {enum: [buy, sell]}
      quantity: {type: number, exclusiveMinimum: 0}
      limit: {type: integer, minimum: 0}  # 指値（買いは必ず。売りは 0 か書かなければ指値なし）

set_accounting:
  admin_cost: 1
  payload:
    type: object
    required: [x, y, accounting]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      accounting: {enum: [self_supporting, treasury]}

# --- 銀行・国債・企業（フェーズ2-2） ---

set_zone:
  admin_cost: 1
  payload:
    type: object
    required: [zone, tiles]
    additionalProperties: false
    properties:
      zone: {enum: [industrial, office, none]}   # 工業団地・オフィス街・解除
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

set_subsidy:
  admin_cost: 1
  payload:
    type: object
    required: [kind, rate, turns]
    additionalProperties: false
    properties:
      kind: {enum: [production, capital, bailout]}  # 生産補助・設備投資補助・救済補助
      good: {type: string}                          # 対象の財（生産補助と設備投資補助）
      x: {type: integer, minimum: 0}                # 対象の施設のマス（生産補助と救済補助）
      y: {type: integer, minimum: 0}
      rate: {type: number, minimum: 0, maximum: 100}  # 割合（%）。0 でやめる
      turns: {type: integer, minimum: 1, maximum: 1200}

nationalize:
  admin_cost: 2
  payload:
    type: object
    required: [x, y]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}

privatize:
  admin_cost: 2
  payload:
    type: object
    required: [x, y]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}

set_monetary_policy:
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      policy_rate: {type: number, minimum: 0, maximum: 20}  # 政策金利（%）
      bond_trade: {type: integer}                           # 中央銀行が毎ターン国債を買う額（マイナスは売る）

set_central_bank_independence:
  admin_cost: 2
  payload:
    type: object
    required: [independent]
    additionalProperties: false
    properties:
      independent: {type: boolean}

set_bond_policy:
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      terms:                                # 自動の発行の期間の割合（finance.yaml の国債の期間ごと）
        type: object
        minProperties: 1
        propertyNames: {pattern: "^[a-z0-9_]+$"}
        additionalProperties: {type: number, minimum: 0}
      unsold: {enum: [underwrite, cut]}     # 入札の売れ残り: 中央銀行が引き受ける・支出を減らす
      issue: {type: integer, minimum: 0}    # 追加で入札に出す額（このターン）
      issue_term: {type: string}
      underwrite: {type: integer, minimum: 0}  # 中央銀行に直接引き受けさせる額（このターン）
      underwrite_term: {type: string}

set_bond_payment:
  admin_cost: 1
  payload:
    type: object
    required: [stop]
    additionalProperties: false
    properties:
      stop: {type: boolean}                 # true で利払いと償還を止める（不履行）

set_bank_policy:
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      entry: {enum: [free, license, closed]}           # 民間銀行の参入
      deposit_insurance: {type: integer, minimum: -1}  # 預金保護の上限額（1人あたり。-1 は無制限）

grant_bank_license:
  admin_cost: 1
  payload:
    type: object
    additionalProperties: false
    properties: {}

emergency_loan:
  admin_cost: 1
  payload:
    type: object
    required: [x, y, amount]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      amount: {type: integer, minimum: 0}   # 毎ターン担保なしで貸す上限。0 で取り消す

resolve_bank:
  admin_cost: 0
  payload:
    type: object
    required: [x, y, method]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      method: {enum: [bailout, transfer, liquidation]}  # 救済・引き継ぎ・清算

# 貿易（フェーズ3-1）。中身は命令の段で申し送りとして積み、貿易の段（世界の段）で島の番号の順に決める。
# 決められなかったときは、そのわけをターンログに書く。
create_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name: {type: string, minLength: 1, maxLength: 32}
      open: {type: boolean}                 # true（既定）は誰でも入れる、false は代表の承認が要る

join_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}

leave_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}

bloc_settings:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    minProperties: 2
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}
      open: {type: boolean}                 # 加盟の承認（true は誰でも入れる）
      currency: {type: integer, minimum: 1} # 決済通貨（加盟国の島の番号）
      approve: {type: integer, minimum: 1}  # 加盟を承認する島の番号

transfer_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc, to]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}
      to: {type: integer, minimum: 1}       # 代表を譲る加盟国の島の番号

take_over_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}     # 代表の島が休止中のときだけ

propose_contract:
  admin_cost: 1
  payload:
    type: object
    required: [partner, side, good, quantity, price, turns]
    additionalProperties: false
    properties:
      partner: {type: integer, minimum: 1}  # 相手の島の番号
      side: {enum: [sell, buy]}             # こちらが売るか買うか
      good: {type: string}
      quantity: {type: number, exclusiveMinimum: 0}  # 1ターンの量
      price: {type: integer, minimum: 0}    # 1 単位の値段（契約の通貨）
      currency: {type: integer, minimum: 1} # 契約の通貨（どちらかの島の番号。省くとこちらの通貨）
      turns: {type: integer, minimum: 1, maximum: 600}

accept_contract:
  admin_cost: 1
  payload:
    type: object
    required: [contract]
    additionalProperties: false
    properties:
      contract: {type: integer, minimum: 1}

cancel_contract:
  admin_cost: 1
  payload:
    type: object
    required: [contract]
    additionalProperties: false
    properties:
      contract: {type: integer, minimum: 1}
