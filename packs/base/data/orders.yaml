# 命令。admin_cost: 要る行政力（ふつうは 1。名前の変更は 0 で、ほかの命令の数に数えない）、
# payload: 命令の中身の形（JSON Schema）、parliament: 議会のある体制（民主主義）で、実行するときに
# 議会の採決が要る命令（majority: 過半数・two_thirds: 3 分の 2。フェーズ3-4。税率は、どれかの税を
# game.yaml の politics.parliament.tax_points ポイントより大きく変えるときだけ採決する）、
# secret: 実行するまで持ち主だけに見せる命令（現実の国が前もって公表しないもの。為替介入・資本規制・
# 利下げ・不履行・銀行の救済・解散・交渉中の契約など。実行した後は、ほかの命令と同じく誰にでも見える。
# 書かない命令は、予算・税・関税のように前もって公表するもので、待っている間も誰にでも見える。
# {項目: 値} と書くと、payload のその項目がその値の命令だけを伏せる。例: 国の倉庫の買い入れ）。
# 処理する関数は hakoniwa_core/modules/ の各モジュールで登録します。
rename_island:
  admin_cost: 0
  payload:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name: {type: string, minLength: 1, maxLength: 32}

rename_facility:
  admin_cost: 0
  payload:
    type: object
    required: [x, y, name]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      name: {type: string, maxLength: 32}   # 空にすると自動の名前に戻る

rename_place:
  admin_cost: 0
  payload:
    type: object
    required: [x, y, name]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}         # このマスを含む地名の区画の名前を変える
      y: {type: integer, minimum: 0}
      name: {type: string, minLength: 1, maxLength: 16}

build:
  admin_cost: 1
  payload:
    type: object
    required: [facility, x, y]
    additionalProperties: false
    properties:
      facility: {type: string}
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      recipe: {type: string}                # 作り方が複数ある施設では必ず選ぶ
      name: {type: string, maxLength: 32}

demolish:
  admin_cost: 1
  payload:
    type: object
    required: [x, y]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}

build_power_line:
  admin_cost: 1
  payload:
    type: object
    required: [tiles]
    additionalProperties: false
    properties:
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

build_infrastructure:                     # 道路・鉄道・上下水道・送電網の工事を列に並べる（フェーズ2-3）
  admin_cost: 1
  payload:
    type: object
    required: [kind, tiles]
    additionalProperties: false
    properties:
      kind: {type: string}                  # infrastructure.yaml の種類
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

set_no_development:
  admin_cost: 1
  payload:
    type: object
    required: [tiles, value]
    additionalProperties: false
    properties:
      value: {type: boolean}                # true で指定、false で解除
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

set_priority:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [x, y, priority]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      priority: {type: integer, minimum: 0, maximum: 9}

change_recipe:                            # 国営施設の作り方の変更（フェーズ3-2）
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [x, y, recipe]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      recipe: {type: string, pattern: "^[a-z][a-z0-9_]*$"}

# --- お金の経済（フェーズ2） ---

set_taxes:
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:                           # 税率（%）。書いた税だけ変わる
      income_tax: {type: number, minimum: 0, maximum: 100}
      corporate_tax: {type: number, minimum: 0, maximum: 100}
      consumption_tax: {type: number, minimum: 0, maximum: 100}

set_budget:
  admin_cost: 1
  payload:
    type: object                          # 項目（game.yaml の fiscal.budget_items）ごとの年の予算
    minProperties: 1
    propertyNames: {pattern: "^[a-z_]+$"}
    additionalProperties: {type: integer, minimum: 0}

set_labor_policy:
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      minimum_wage: {type: integer, minimum: 0}                     # 0 で決めない
      unemployment_benefit: {type: number, minimum: 0, maximum: 100} # 平均賃金に対する %

set_price_cap:
  admin_cost: 1
  payload:
    type: object
    required: [good, price]
    additionalProperties: false
    properties:
      good: {type: string}
      price: {type: integer, minimum: 0}  # 0 で上限をなくす

warehouse_trade:
  admin_cost: 1
  # 備蓄の放出（売り）は前もって発表し、買い入れは実行まで伏せる（現実の備蓄米・石油備蓄と同じ）
  secret: {side: buy}
  payload:
    type: object
    required: [good, side, quantity]
    additionalProperties: false
    properties:
      good: {type: string}
      side: {enum: [buy, sell]}
      quantity: {type: number, exclusiveMinimum: 0}
      limit: {type: integer, minimum: 0}  # 指値（買いは必ず。売りは 0 か書かなければ指値なし）

set_accounting:
  admin_cost: 1
  payload:
    type: object
    required: [x, y, accounting]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      accounting: {enum: [self_supporting, treasury]}

# --- 銀行・国債・企業（フェーズ2-2） ---

set_zone:
  admin_cost: 1
  payload:
    type: object
    required: [zone, tiles]
    additionalProperties: false
    properties:
      zone: {enum: [industrial, office, none]}   # 工業団地・オフィス街・解除
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

set_subsidy:
  admin_cost: 1
  payload:
    type: object
    required: [kind, rate, turns]
    additionalProperties: false
    properties:
      kind: {enum: [production, capital, bailout]}  # 生産補助・設備投資補助・救済補助
      good: {type: string}                          # 対象の財（生産補助と設備投資補助）
      x: {type: integer, minimum: 0}                # 対象の施設のマス（生産補助と救済補助）
      y: {type: integer, minimum: 0}
      rate: {type: number, minimum: 0, maximum: 100}  # 割合（%）。0 でやめる
      turns: {type: integer, minimum: 1, maximum: 1200}

nationalize:
  admin_cost: 2
  secret: true
  parliament: majority
  payload:
    type: object
    required: [x, y]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}

privatize:
  admin_cost: 2
  parliament: majority
  payload:
    type: object
    required: [x, y]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}

nationalize_firm:         # 民営の企業を丸ごと国有化（回7）
  admin_cost: 3
  secret: true
  parliament: majority
  payload:
    type: object
    required: [firm]
    additionalProperties: false
    properties:
      firm: {type: integer, minimum: 1}   # 企業の番号（施設の画面の企業の表）

privatize_firm:           # 国営企業を丸ごと民営化（回7）
  admin_cost: 3
  parliament: majority
  payload:
    type: object
    required: [firm]
    additionalProperties: false
    properties:
      firm: {type: integer, minimum: 1}

set_monetary_policy:
  admin_cost: 1
  secret: true
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      policy_rate: {type: number, minimum: 0, maximum: 20}  # 政策金利（%）
      bond_trade: {type: integer}                           # 中央銀行が毎ターン国債を買う額（マイナスは売る）

set_central_bank_independence:
  admin_cost: 2
  parliament: majority
  payload:
    type: object
    required: [independent]
    additionalProperties: false
    properties:
      independent: {type: boolean}

set_bond_policy:
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      terms:                                # 自動の発行の期間の割合（finance.yaml の国債の期間ごと）
        type: object
        minProperties: 1
        propertyNames: {pattern: "^[a-z0-9_]+$"}
        additionalProperties: {type: number, minimum: 0}
      unsold: {enum: [underwrite, cut]}     # 入札の売れ残り: 中央銀行が引き受ける・支出を減らす
      issue: {type: integer, minimum: 0}    # 追加で入札に出す額（このターン）
      issue_term: {type: string}
      underwrite: {type: integer, minimum: 0}  # 中央銀行に直接引き受けさせる額（このターン）
      underwrite_term: {type: string}

set_bond_payment:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [stop]
    additionalProperties: false
    properties:
      stop: {type: boolean}                 # true で利払いと償還を止める（不履行）

set_bank_policy:
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      entry: {enum: [free, license, closed]}           # 民間銀行の参入
      deposit_insurance: {type: integer, minimum: -1}  # 預金保護の上限額（1人あたり。-1 は無制限）

grant_bank_license:
  admin_cost: 1
  payload:
    type: object
    additionalProperties: false
    properties: {}

emergency_loan:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [x, y, amount]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      amount: {type: integer, minimum: 0}   # 毎ターン担保なしで貸す上限。0 で取り消す

resolve_bank:
  admin_cost: 0
  secret: true
  payload:
    type: object
    required: [x, y, method]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      method: {enum: [bailout, transfer, liquidation]}  # 救済・引き継ぎ・清算

# 貿易（フェーズ3-1）。中身は命令の段で申し送りとして積み、貿易の段（世界の段）で島の番号の順に決める。
# 決められなかったときは、そのわけをターンログに書く。
create_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name: {type: string, minLength: 1, maxLength: 32}
      open: {type: boolean}                 # true（既定）は誰でも入れる、false は代表の承認が要る

join_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}

leave_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}

bloc_settings:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    minProperties: 2
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}
      open: {type: boolean}                 # 加盟の承認（true は誰でも入れる）
      currency: {type: integer, minimum: 1} # 決済通貨（加盟国の島の番号）
      approve: {type: integer, minimum: 1}  # 加盟を承認する島の番号
      # フェーズ3-3: 圏内の関税をなくす決まり（true でなくす）と、圏内の固定価格（決済通貨。0 でやめる）
      no_tariff: {type: boolean}
      fixed_good: {type: string}
      fixed_price: {type: integer, minimum: 0}

transfer_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc, to]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}
      to: {type: integer, minimum: 1}       # 代表を譲る加盟国の島の番号

take_over_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}     # 代表の島が休止中のときだけ

propose_contract:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [partner, side, good, quantity, price, turns]
    additionalProperties: false
    properties:
      partner: {type: integer, minimum: 1}  # 相手の島の番号
      side: {enum: [sell, buy]}             # こちらが売るか買うか
      good: {type: string}
      quantity: {type: number, exclusiveMinimum: 0}  # 1ターンの量
      price: {type: integer, minimum: 0}    # 1 単位の値段（契約の通貨）
      currency: {type: integer, minimum: 1} # 契約の通貨（どちらかの島の番号。省くとこちらの通貨）
      turns: {type: integer, minimum: 1, maximum: 600}
      # 届いた物の行き先（こちらが買うときだけ。省くと market）: market は売り切れるまで島の市場の
      # 値段で売りに出す、warehouse は国の倉庫に置いておく。傷みやすい物はどちらでもすぐ市場に出す
      delivery: {enum: [market, warehouse]}

accept_contract:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [contract]
    additionalProperties: false
    properties:
      contract: {type: integer, minimum: 1}
      delivery: {enum: [market, warehouse]}  # 買い手として受けるとき、届いた物の行き先（省くと market）

cancel_contract:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [contract]
    additionalProperties: false
    properties:
      contract: {type: integer, minimum: 1}

# --- 産業政策と国際金融（フェーズ3-3） ---------------------------------------------------
set_tariff:
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    required: [good, rate]
    additionalProperties: false
    properties:
      good: {type: string}
      rate: {type: number, minimum: 0, maximum: 100}  # 関税率（%。0 でやめる）

set_export_subsidy:
  admin_cost: 1
  payload:
    type: object
    required: [good, amount]
    additionalProperties: false
    properties:
      good: {type: string}
      amount: {type: integer, minimum: 0}  # 1 単位あたりの輸出補助（0 でやめる）

set_import_quota:
  admin_cost: 1
  payload:
    type: object
    required: [good]
    additionalProperties: false
    properties:
      good: {type: string}
      quantity: {type: number, minimum: 0}  # 1ターンの輸入の上限（省くとやめる）

set_embargo:
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    required: [partner]
    additionalProperties: false
    properties:
      partner: {type: integer, minimum: 1}  # 相手の島の番号
      good: {type: string}                  # 省くとすべての財
      lift: {type: boolean}                 # true でやめる（省くと始める）

send_aid:
  admin_cost: 1
  payload:
    type: object
    required: [partner]
    additionalProperties: false
    properties:
      partner: {type: integer, minimum: 1}
      # お金の援助: amount と通貨（どちらかの国の通貨。省くとこちらの通貨）
      amount: {type: integer, minimum: 1}
      currency: {type: integer, minimum: 1}
      # 物の援助: 財・1ターンの量・期間（値段 0 の片道の契約）
      good: {type: string}
      quantity: {type: number, exclusiveMinimum: 0}
      turns: {type: integer, minimum: 1, maximum: 600}

set_capital_controls:
  admin_cost: 1
  secret: true
  parliament: majority
  payload:
    type: object
    required: [mode]
    additionalProperties: false
    properties:
      mode: {enum: [free, official, closed]}  # 自由・政府と中央銀行だけ・禁止

set_fx_intervention:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [currency, amount]
    additionalProperties: false
    properties:
      currency: {type: integer, minimum: 1}  # 相手の通貨（島の番号）
      amount: {type: integer}                # 毎ターン買う額（その通貨。マイナスは売る。0 でやめる）

set_fx_peg:
  admin_cost: 2
  secret: true
  payload:
    type: object
    required: [currency, rate]
    additionalProperties: false
    properties:
      currency: {type: integer, minimum: 1}
      rate: {type: number, minimum: 0}  # 相手の通貨 1 が自国通貨でいくらか（0 でやめる）

set_foreign_bonds:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [issuer, holder, amount]
    additionalProperties: false
    properties:
      issuer: {type: integer, minimum: 1}  # 国債を出した国（島の番号）
      holder: {enum: [gov, cb]}            # 政府か中央銀行
      amount: {type: integer}              # 毎ターン買う額面（その国の通貨。マイナスは売る。0 でやめる）

# --- 政治（フェーズ3-4。hakoniwa_core/modules/politics） ---------------------------------

set_press:                                # 報道と集会の扱い（民主主義は自由だけ）
  admin_cost: 1
  payload:
    type: object
    required: [mode]
    additionalProperties: false
    properties:
      mode: {enum: [free, limited, controlled]}

set_immigration:                          # 移民の受け入れ（バランス調整の回3）
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    required: [mode]
    additionalProperties: false
    properties:
      # だれでも・人手の足りない分まで・技術者だけ・飢えている人だけ（難民）・受け入れない
      mode: {enum: [open, jobs, engineers, refugees, closed]}
      cap: {type: integer, minimum: 0, maximum: 10000}  # 1年の上限（住民の1万分の1。0 は既定）

set_emigration:                           # 出国の扱い（民主主義は自由だけ、権威主義は許可制まで）
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    required: [mode]
    additionalProperties: false
    properties:
      mode: {enum: [free, permit, ban]}   # 自由・許可制・禁止
      quota: {type: integer, minimum: 0, maximum: 10000}  # 許可制の1年の枠（住民の1万分の1）

dissolve_parliament:                      # 議会の解散（今の支持率で議席を選び直す。民主主義だけ）
  admin_cost: 2
  secret: true
  payload: {type: object, additionalProperties: false}

amend_constitution:                       # 憲法改正（政治の仕組みと国家元首の形）
  admin_cost: 3
  parliament: two_thirds
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      politics: {type: string}
      head_of_state: {type: string}

change_economy:                           # 経済体制の変更（計画経済に移ると民営の施設と民間銀行を国有化する）
  admin_cost: 3
  parliament: two_thirds
  payload:
    type: object
    required: [economy]
    additionalProperties: false
    properties:
      economy: {type: string}

mobilize_labor:                           # 労働の動員（全体主義だけ）
  admin_cost: 0
  payload:
    type: object
    required: ["on"]
    additionalProperties: false
    properties:
      "on": {type: boolean}

rename_leader:                            # 共和制の元首の名前（RP）
  admin_cost: 0
  payload:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name: {type: string, minLength: 1, maxLength: 32}

# --- 計画経済と値段の規制（フェーズ3-4。hakoniwa_core/modules/plan） -----------------------

set_official_price:                       # 公定価格の上書き（計画経済だけ）
  admin_cost: 1
  payload:
    type: object
    required: [good, price]
    additionalProperties: false
    properties:
      good: {type: string}
      price: {type: integer, minimum: 0}  # 0 で上書きをやめる（決まりどおりの見直しに戻す）

review_official_prices:                   # 公定価格の改定（計画経済だけ。政治の決断）
  admin_cost: 2
  parliament: majority
  payload:
    type: object
    additionalProperties: false
    properties:
      goods:                              # 改める財。空か省くと、命令で上書きしていない財すべて
        type: array
        uniqueItems: true
        items: {type: string}

set_official_price_rules:                 # 公定価格の決まり（計画経済だけ）
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      band: {type: integer, minimum: 0, maximum: 100}  # 原価との差がこの % を超えたら見直す
      held:                               # 原価を下回っても据え置き、差を補助金で埋める財
        type: array
        uniqueItems: true
        items: {type: string}

set_priority_industries:                  # 重点産業（計画経済だけ。planning.max_priority まで）
  admin_cost: 1
  payload:
    type: object
