# 命令。admin_cost: 要る行政力（ふつうは 1。名前の変更は 0 で、ほかの命令の数に数えない）、
# payload: 命令の中身の形（JSON Schema）、parliament: 議会のある体制（民主主義）で、実行するときに
# 議会の採決が要る命令（majority: 過半数・two_thirds: 3 分の 2。フェーズ3-4。税率は、どれかの税を
# game.yaml の politics.parliament.tax_points ポイントより大きく変えるときだけ採決する）、
# secret: 実行するまで持ち主だけに見せる命令（現実の国が前もって公表しないもの。為替介入・資本規制・
# 利下げ・不履行・銀行の救済・解散・交渉中の契約など。実行した後は、ほかの命令と同じく誰にでも見える。
# 書かない命令は、予算・税・関税のように前もって公表するもので、待っている間も誰にでも見える。
# {項目: 値} と書くと、payload のその項目がその値の命令だけを伏せる。例: 国の倉庫の買い入れ）。
# always: 実行した後も、持ち主以外には見せない（部隊と艦隊への命令。現実の軍が動きを公にしないため。
# 失敗も含めて、他の国の画面・API・MCP の命令の欄に出さない。フェーズ4-2 の③'、設計書 MI-27）。
# 処理する関数は hakoniwa_core/modules/ の各モジュールで登録します。
rename_island:
  admin_cost: 0
  payload:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name: {type: string, minLength: 1, maxLength: 32}

rename_facility:
  admin_cost: 0
  payload:
    type: object
    required: [x, y, name]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      name: {type: string, maxLength: 32}   # 空にすると自動の名前に戻る

rename_place:
  admin_cost: 0
  payload:
    type: object
    required: [x, y, name]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}         # このマスを含む地名の区画の名前を変える
      y: {type: integer, minimum: 0}
      name: {type: string, minLength: 1, maxLength: 16}

build:
  admin_cost: 1
  payload:
    type: object
    required: [facility, x, y]
    additionalProperties: false
    properties:
      facility: {type: string}
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      recipe: {type: string}                # 作り方が複数ある施設では必ず選ぶ
      name: {type: string, maxLength: 32}
      note: {type: string, maxLength: 81}   # 記念碑の碑文に足す文（2 行まで。1 行 40 字まで）

demolish:
  admin_cost: 1
  payload:
    type: object
    required: [x, y]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}

build_power_line:
  admin_cost: 1
  payload:
    type: object
    required: [tiles]
    additionalProperties: false
    properties:
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

build_infrastructure:                     # 道路・鉄道・上下水道・送電網の工事を列に並べる（フェーズ2-3）
  admin_cost: 1
  payload:
    type: object
    required: [kind, tiles]
    additionalProperties: false
    properties:
      kind: {type: string}                  # infrastructure.yaml の種類
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

set_no_development:
  admin_cost: 1
  payload:
    type: object
    required: [tiles, value]
    additionalProperties: false
    properties:
      value: {type: boolean}                # true で指定、false で解除
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

set_priority:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [x, y, priority]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      priority: {type: integer, minimum: 0, maximum: 9}

change_recipe:                            # 国営施設の作り方の変更（フェーズ3-2）
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [x, y, recipe]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      recipe: {type: string, pattern: "^[a-z][a-z0-9_]*$"}

# --- お金の経済（フェーズ2） ---

set_taxes:
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:                           # 税率（%）。書いた税だけ変わる
      income_tax: {type: number, minimum: 0, maximum: 100, description: "%"}
      corporate_tax: {type: number, minimum: 0, maximum: 100, description: "%"}
      consumption_tax: {type: number, minimum: 0, maximum: 100, description: "%"}

set_budget:
  admin_cost: 1
  payload:
    type: object                          # 項目（game.yaml の fiscal.budget_items）ごとの年の予算
    minProperties: 1
    propertyNames: {enum: [construction, education, security, subsidies, warehouse, defense_personnel, defense_procurement]}
    additionalProperties: {type: integer, minimum: 0, description: "年の予算の額（毎ターンその12分の1まで使う）"}

set_labor_policy:
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      minimum_wage: {type: integer, minimum: 0}                     # 0 で決めない
      unemployment_benefit: {type: number, minimum: 0, maximum: 100, description: "平均賃金に対する %"}

set_retail_policy:        # 小売りの政策（回7）: 大きな店（百貨店）の出店の規制と、許可制の申請を許す
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      large_store: {enum: [none, permit, ban]}   # 規制なし・許可制・禁止
      approve: {const: true}                     # 許可制の国で、出ている申請を許す

set_price_cap:
  admin_cost: 1
  payload:
    type: object
    required: [good, price]
    additionalProperties: false
    properties:
      good: {type: string}
      price: {type: integer, minimum: 0}  # 0 で上限をなくす

warehouse_trade:
  admin_cost: 1
  # 備蓄の放出（売り）は前もって発表し、買い入れは実行まで伏せる（現実の備蓄米・石油備蓄と同じ）
  secret: {side: buy}
  payload:
    type: object
    required: [good, side, quantity]
    additionalProperties: false
    properties:
      good: {type: string}
      side: {enum: [buy, sell]}
      quantity: {type: number, exclusiveMinimum: 0}
      limit: {type: integer, minimum: 0}  # 指値（買いは必ず。売りは 0 か書かなければ指値なし）

set_accounting:
  admin_cost: 1
  payload:
    type: object
    required: [x, y, accounting]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      accounting: {enum: [self_supporting, treasury]}

# --- 銀行・国債・企業（フェーズ2-2） ---

set_zone:
  admin_cost: 1
  payload:
    type: object
    required: [zone, tiles]
    additionalProperties: false
    properties:
      zone: {enum: [industrial, office, commercial, none]}   # 工業団地・オフィス街・商業地（回7）・解除
      tiles:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: array
          prefixItems: [{type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 2
          maxItems: 2

set_subsidy:
  admin_cost: 1
  payload:
    type: object
    required: [kind, rate, turns]
    additionalProperties: false
    properties:
      kind: {enum: [production, capital, bailout]}  # 生産補助・設備投資補助・救済補助
      good: {type: string}                          # 対象の財（生産補助と設備投資補助）
      x: {type: integer, minimum: 0}                # 対象の施設のマス（生産補助と救済補助）
      y: {type: integer, minimum: 0}
      rate: {type: number, minimum: 0, maximum: 100, description: "%。0 でやめる"}
      turns: {type: integer, minimum: 1, maximum: 1200}

nationalize:
  admin_cost: 2
  secret: true
  parliament: majority
  payload:
    type: object
    required: [x, y]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}

privatize:
  admin_cost: 2
  parliament: majority
  payload:
    type: object
    required: [x, y]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}

nationalize_firm:         # 民営の企業を丸ごと国有化（回7）
  admin_cost: 3
  secret: true
  parliament: majority
  payload:
    type: object
    required: [firm]
    additionalProperties: false
    properties:
      firm: {type: integer, minimum: 1}   # 企業の番号（施設の画面の企業の表）

privatize_firm:           # 国営企業を丸ごと民営化（回7）
  admin_cost: 3
  parliament: majority
  payload:
    type: object
    required: [firm]
    additionalProperties: false
    properties:
      firm: {type: integer, minimum: 1}

set_monetary_policy:
  admin_cost: 1
  secret: true
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      policy_rate: {type: number, minimum: 0, maximum: 20, description: "%"}  # 政策金利
      bond_trade: {type: integer}                           # 中央銀行が毎ターン国債を買う額（マイナスは売る）

set_central_bank_independence:
  admin_cost: 2
  parliament: majority
  payload:
    type: object
    required: [independent]
    additionalProperties: false
    properties:
      independent: {type: boolean}

set_bond_policy:
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      terms:                                # 自動の発行の期間の割合（finance.yaml の国債の期間ごと）
        type: object
        minProperties: 1
        propertyNames: {pattern: "^[a-z0-9_]+$"}
        additionalProperties: {type: number, minimum: 0}
      unsold: {enum: [underwrite, cut]}     # 入札の売れ残り: 中央銀行が引き受ける・支出を減らす
      issue: {type: integer, minimum: 0}    # 追加で入札に出す額（このターン）
      issue_term: {type: string}
      underwrite: {type: integer, minimum: 0}  # 中央銀行に直接引き受けさせる額（このターン）
      underwrite_term: {type: string}

set_bond_payment:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [stop]
    additionalProperties: false
    properties:
      stop: {type: boolean}                 # true で利払いと償還を止める（不履行）

set_bank_policy:
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      entry: {enum: [free, license, closed]}           # 民間銀行の参入
      deposit_insurance: {type: integer, minimum: -1}  # 預金保護の上限額（1人あたり。-1 は無制限）

grant_bank_license:
  admin_cost: 1
  payload:
    type: object
    additionalProperties: false
    properties: {}

emergency_loan:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [x, y, amount]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      amount: {type: integer, minimum: 0}   # 毎ターン担保なしで貸す上限。0 で取り消す

resolve_bank:
  admin_cost: 0
  secret: true
  payload:
    type: object
    required: [x, y, method]
    additionalProperties: false
    properties:
      x: {type: integer, minimum: 0}
      y: {type: integer, minimum: 0}
      method: {enum: [bailout, transfer, liquidation]}  # 救済・引き継ぎ・清算

# 貿易（フェーズ3-1）。中身は命令の段で申し送りとして積み、貿易の段（世界の段）で島の番号の順に決める。
# 決められなかったときは、そのわけをターンログに書く。
create_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name: {type: string, minLength: 1, maxLength: 32}
      open: {type: boolean}                 # true（既定）は誰でも入れる、false は代表の承認が要る

join_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}

leave_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}

bloc_settings:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    minProperties: 2
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}
      open: {type: boolean}                 # 加盟の承認（true は誰でも入れる）
      currency: {type: integer, minimum: 1} # 決済通貨（加盟国の島の番号）
      approve: {type: integer, minimum: 1}  # 加盟を承認する島の番号
      # フェーズ3-3: 圏内の関税をなくす決まり（true でなくす）と、圏内の固定価格（決済通貨。0 でやめる）
      no_tariff: {type: boolean}
      fixed_good: {type: string}
      fixed_price: {type: integer, minimum: 0}

transfer_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc, to]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}
      to: {type: integer, minimum: 1}       # 代表を譲る加盟国の島の番号

take_over_bloc:
  admin_cost: 1
  payload:
    type: object
    required: [bloc]
    additionalProperties: false
    properties:
      bloc: {type: integer, minimum: 1}     # 代表の島が休止中のときだけ

propose_contract:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [partner, side, good, quantity, price, turns]
    additionalProperties: false
    properties:
      partner: {type: integer, minimum: 1}  # 相手の島の番号
      side: {enum: [sell, buy]}             # こちらが売るか買うか
      good: {type: string}
      quantity: {type: number, exclusiveMinimum: 0}  # 1ターンの量
      price: {type: integer, minimum: 0}    # 1 単位の値段（契約の通貨）
      currency: {type: integer, minimum: 1} # 契約の通貨（どちらかの島の番号。省くとこちらの通貨）
      turns: {type: integer, minimum: 1, maximum: 600}
      # 届いた物の行き先（こちらが買うときだけ。省くと market）: market は売り切れるまで島の市場の
      # 値段で売りに出す、warehouse は国の倉庫に置いておく。傷みやすい物はどちらでもすぐ市場に出す
      delivery: {enum: [market, warehouse]}

accept_contract:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [contract]
    additionalProperties: false
    properties:
      contract: {type: integer, minimum: 1}
      delivery: {enum: [market, warehouse]}  # 買い手として受けるとき、届いた物の行き先（省くと market）

cancel_contract:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [contract]
    additionalProperties: false
    properties:
      contract: {type: integer, minimum: 1}

# --- 産業政策と国際金融（フェーズ3-3） ---------------------------------------------------
set_tariff:
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    required: [good, rate]
    additionalProperties: false
    properties:
      good: {type: string}
      rate: {type: number, minimum: 0, maximum: 100, description: "%。0 でやめる"}  # 関税率

set_export_subsidy:
  admin_cost: 1
  payload:
    type: object
    required: [good, amount]
    additionalProperties: false
    properties:
      good: {type: string}
      amount: {type: integer, minimum: 0}  # 1 単位あたりの輸出補助（0 でやめる）

set_import_quota:
  admin_cost: 1
  payload:
    type: object
    required: [good]
    additionalProperties: false
    properties:
      good: {type: string}
      quantity: {type: number, minimum: 0}  # 1ターンの輸入の上限（省くとやめる）

set_embargo:
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    required: [partner]
    additionalProperties: false
    properties:
      partner: {type: integer, minimum: 1}  # 相手の島の番号
      good: {type: string}                  # 省くとすべての財
      lift: {type: boolean}                 # true でやめる（省くと始める）

send_aid:
  admin_cost: 1
  payload:
    type: object
    required: [partner]
    additionalProperties: false
    properties:
      partner: {type: integer, minimum: 1}
      # お金の援助: amount と通貨（どちらかの国の通貨。省くとこちらの通貨）
      amount: {type: integer, minimum: 1}
      currency: {type: integer, minimum: 1}
      # 物の援助: 財・1ターンの量・期間（値段 0 の片道の契約）
      good: {type: string}
      quantity: {type: number, exclusiveMinimum: 0}
      turns: {type: integer, minimum: 1, maximum: 600}

set_capital_controls:
  admin_cost: 1
  secret: true
  parliament: majority
  payload:
    type: object
    required: [mode]
    additionalProperties: false
    properties:
      mode: {enum: [free, official, closed]}  # 自由・政府と中央銀行だけ・禁止

set_fx_intervention:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [currency, amount]
    additionalProperties: false
    properties:
      currency: {type: integer, minimum: 1}  # 相手の通貨（島の番号）
      amount: {type: integer}                # 毎ターン買う額（その通貨。マイナスは売る。0 でやめる）

set_fx_peg:
  admin_cost: 2
  secret: true
  payload:
    type: object
    required: [currency, rate]
    additionalProperties: false
    properties:
      currency: {type: integer, minimum: 1}
      rate: {type: number, minimum: 0}  # 相手の通貨 1 が自国通貨でいくらか（0 でやめる）

set_foreign_bonds:
  admin_cost: 1
  secret: true
  payload:
    type: object
    required: [issuer, holder, amount]
    additionalProperties: false
    properties:
      issuer: {type: integer, minimum: 1}  # 国債を出した国（島の番号）
      holder: {enum: [gov, cb]}            # 政府か中央銀行
      amount: {type: integer}              # 毎ターン買う額面（その国の通貨。マイナスは売る。0 でやめる）

# --- 政治（フェーズ3-4。hakoniwa_core/modules/politics） ---------------------------------

set_press:                                # 報道と集会の扱い（民主主義は自由だけ）
  admin_cost: 1
  payload:
    type: object
    required: [mode]
    additionalProperties: false
    properties:
      mode: {enum: [free, limited, controlled]}

set_immigration:                          # 移民の受け入れ（バランス調整の回3）
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    required: [mode]
    additionalProperties: false
    properties:
      # だれでも・人手の足りない分まで・技術者だけ・飢えている人だけ（難民）・受け入れない
      mode: {enum: [open, jobs, engineers, refugees, closed]}
      cap: {type: integer, minimum: 0, maximum: 10000}  # 1年の上限（住民の1万分の1。0 は既定）

set_emigration:                           # 出国の扱い（民主主義は自由だけ、権威主義は許可制まで）
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    required: [mode]
    additionalProperties: false
    properties:
      mode: {enum: [free, permit, ban]}   # 自由・許可制・禁止
      quota: {type: integer, minimum: 0, maximum: 10000}  # 許可制の1年の枠（住民の1万分の1）

dissolve_parliament:                      # 議会の解散（今の支持率で議席を選び直す。民主主義だけ）
  admin_cost: 2
  secret: true
  payload: {type: object, additionalProperties: false}

amend_constitution:                       # 憲法改正（政治の仕組みと国家元首の形）
  admin_cost: 3
  parliament: two_thirds
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      politics: {type: string}
      head_of_state: {type: string}

change_economy:                           # 経済体制の変更（計画経済に移ると民営の施設と民間銀行を国有化する）
  admin_cost: 3
  parliament: two_thirds
  payload:
    type: object
    required: [economy]
    additionalProperties: false
    properties:
      economy: {type: string}

mobilize_labor:                           # 労働の動員（全体主義だけ）
  admin_cost: 0
  payload:
    type: object
    required: ["on"]
    additionalProperties: false
    properties:
      "on": {type: boolean}

rename_leader:                            # 共和制の元首の名前（RP）
  admin_cost: 0
  payload:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name: {type: string, minLength: 1, maxLength: 32}

# --- 計画経済と値段の規制（フェーズ3-4。hakoniwa_core/modules/plan） -----------------------

set_official_price:                       # 公定価格の上書き（計画経済だけ）
  admin_cost: 1
  payload:
    type: object
    required: [good, price]
    additionalProperties: false
    properties:
      good: {type: string}
      price: {type: integer, minimum: 0}  # 0 で上書きをやめる（決まりどおりの見直しに戻す）

review_official_prices:                   # 公定価格の改定（計画経済だけ。政治の決断）
  admin_cost: 2
  parliament: majority
  payload:
    type: object
    additionalProperties: false
    properties:
      goods:                              # 改める財。空か省くと、命令で上書きしていない財すべて
        type: array
        uniqueItems: true
        items: {type: string}

set_official_price_rules:                 # 公定価格の決まり（計画経済だけ）
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      band: {type: integer, minimum: 0, maximum: 100, description: "%"}  # 原価との差がこの % を超えたら見直す
      held:                               # 原価を下回っても据え置き、差を補助金で埋める財
        type: array
        uniqueItems: true
        items: {type: string}

set_priority_industries:                  # 重点産業（計画経済だけ。planning.max_priority まで）
  admin_cost: 1
  payload:
    type: object
    required: [industries]
    additionalProperties: false
    properties:
      industries:
        type: array
        uniqueItems: true
        items: {type: string}

set_price_floor:                          # 値段の下限（混合経済だけ。農産物の支えなど）
  admin_cost: 1
  payload:
    type: object
    required: [good, price]
    additionalProperties: false
    properties:
      good: {type: string}
      price: {type: integer, minimum: 0}  # 0 で下限をなくす

# --- 外交（フェーズ4-1。hakoniwa_core/modules/diplomacy） ----------------------------------------
# 宣戦布告・条約の命令は、実行のとき外交の段に回し、島の番号の順に決める。宣戦布告・停戦・講和は、
# 現実の国が前もって公表しない命令ではないので、伏せない（MI-27）。民主主義は、宣戦と署名と破棄に
# 議会の採決が要る（タブ 10 PL-14 の議会の要る命令に足す）。
declare_war:                              # 宣戦布告（戦争は次のターンから）
  admin_cost: 2
  parliament: majority
  payload:
    type: object
    required: [target]
    additionalProperties: false
    properties:
      target: {type: integer, minimum: 1}  # 相手の島の番号
      reason: {type: string, maxLength: 200}  # 布告の理由（国際会議場に載る）

propose_treaty:                           # 条約の提案（相手が署名すると効く。提案する国はその時に署名したことになるので、民主主義は採決する）
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    required: [partner, clauses]
    additionalProperties: false
    properties:
      partner: {type: integer, minimum: 1}   # 相手の島の番号
      title: {type: string, maxLength: 40}   # 省くと条項の名前
      text: {type: string, maxLength: 400}   # 前文
      clauses:
        type: array
        minItems: 1
        maxItems: 6
        items:
          type: object
          required: [type]
          additionalProperties: false
          properties:
            type:
              enum:
                - ceasefire
                - peace
                - non_aggression
                - alliance
                - bloc            # 貿易圏: 圏をつくって相手を入れる（name）か、自分が代表の圏（bloc）に相手を入れる
                - contract        # 二国間契約: 効くと契約が始まる（seller・good・quantity・price・turns）
                - peg             # 固定相場: pegger の中央銀行が相手の通貨に固定する（rate）
                - swap            # 中央銀行の融通: 相手の中央銀行も外貨の貸し手になる
                - aid             # お金の援助の約束: payer が period ごとに amount を count 回送る
                - free_movement   # 人の行き来の自由: 両国が移民の受け入れを open に保つ
                - refugees        # 難民の受け入れ: host が難民を受け入れる政策を保つ
            notice_turns: {type: integer, minimum: 1, maximum: 24}  # 破棄の予告のターン数
            withdraw_turns: {type: integer, minimum: 0, maximum: 12}  # 講和: 部隊の引き揚げの期限
            prisoners: {type: boolean}          # 講和: 捕虜を返す（既定 true）
            reparations:                        # 講和: 賠償（ゲームは払わせず、期日までに届かなければ違反）
              type: object
              required: [payer, amount, due_turns]
              additionalProperties: false
              properties:
                payer: {type: integer, minimum: 1}     # 払う国の島の番号
                amount: {type: integer, minimum: 1}
                currency: {type: integer, minimum: 1}  # どちらかの島の番号（省くと払う国の通貨）
                due_turns: {type: integer, minimum: 1, maximum: 60}  # 効いてから何ターンのうちに
            name: {type: string, maxLength: 20}    # 貿易圏: つくる圏の名前（bloc を省くとき）
            bloc: {type: integer, minimum: 1}      # 貿易圏: 提案する国が代表の圏の番号（相手を入れる）
            open: {type: boolean}                  # 貿易圏: だれでも入れる圏にする（既定 true）
            seller: {type: integer, minimum: 1}    # 契約: 売る国の島の番号
            good: {type: string}                   # 契約: 財
            quantity: {type: number, exclusiveMinimum: 0}  # 契約: 1 ターンの量
            price: {type: integer, minimum: 0}     # 契約: 1 単位の値段（契約の通貨）
            currency: {type: integer, minimum: 1}  # 契約・援助: 通貨（どちらかの島の番号。省くと売る国・払う国の通貨）
            turns: {type: integer, minimum: 1, maximum: 600}  # 契約: 期間
            delivery: {enum: [market, warehouse]}  # 契約: 届いた物の行き先（買う国の分。省くと market）
            pegger: {type: integer, minimum: 1}    # 固定相場: 相手の通貨に固定する国の島の番号
            rate: {type: number, exclusiveMinimum: 0}  # 固定相場: 相手の通貨 1 が pegger の通貨でいくらか
            payer: {type: integer, minimum: 1}     # 援助: 送る国の島の番号
            amount: {type: integer, minimum: 1}    # 援助: 1 回の額
            period: {type: integer, minimum: 1, maximum: 12}   # 援助: 送る間隔（ターン。既定 1）
            count: {type: integer, minimum: 1, maximum: 24}    # 援助: 送る回数（既定 1）
            host: {type: integer, minimum: 1}      # 難民: 受け入れる国の島の番号

sign_treaty:                              # 相手の出した条約に署名する
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    required: [treaty]
    additionalProperties: false
    properties:
      treaty: {type: integer, minimum: 1}

refuse_treaty:                            # 相手の出した条約を断る
  admin_cost: 0
  payload:
    type: object
    required: [treaty]
    additionalProperties: false
    properties:
      treaty: {type: integer, minimum: 1}

withdraw_treaty:                          # 自分の出した条約の提案を取り下げる
  admin_cost: 0
  payload:
    type: object
    required: [treaty]
    additionalProperties: false
    properties:
      treaty: {type: integer, minimum: 1}

denounce_treaty:                          # 効いている条約を予告つきで破棄する（予告のターンがたつと終わる）
  admin_cost: 1
  parliament: majority
  payload:
    type: object
    required: [treaty]
    additionalProperties: false
    properties:
      treaty: {type: integer, minimum: 1}

# --- 軍（フェーズ4-2。設計書 15-military MI-07〜MI-14）。兵の命令は行政力を使う国の命令 -------------
set_defense:                              # 国防費の年の額と分け方、志願の賃金（建国の島は 0 から）
  admin_cost: 1
  payload:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      annual: {type: integer, minimum: 0, description: "国防費の年の額（毎ターンその12分の1まで使う）"}
      personnel_share: {type: integer, minimum: 0, maximum: 100, description: "国防費のうち、兵の賃金と食べ物（defense_personnel）に回す %。残りは装備の買い入れと編成（defense_procurement）"}
      volunteer_wage: {type: number, minimum: 0, maximum: 500, description: "志願の兵の賃金（島の平均賃金に対する %）"}

recruit:                                  # 志願の兵を集める（失業者から先に。軍の賃金が島の平均賃金より低いと失業者しか集まらない）
  admin_cost: 1
  payload:
    type: object
    required: [count]
    additionalProperties: false
    properties:
      count: {type: integer, minimum: 1, description: "集めたい人数"}

conscript:                                # 徴兵（人口に比例してくじで集める。賃金は低く、政情の目標が下がる。民主主義は議会の過半数）
  admin_cost: 2
  parliament: majority
  payload:
    type: object
    required: [count]
    additionalProperties: false
    properties:
      count: {type: integer, minimum: 1, description: "集めたい人数"}

discharge:                                # 除隊（兵は家計に戻り失業者になる。徴兵した兵から先に帰す）
  admin_cost: 1
  payload:
    type: object
    required: [count]
    additionalProperties: false
    properties:
      count: {type: integer, minimum: 1, description: "除隊させる人数"}

# 部隊の命令（フェーズ4-2 の③。MI-18〜21・MI-52）。編成と解散は行政力を使い、動き・陣地・止めるは
# 部隊が持ち続ける命令なので行政力を使わない。実行は全島の段 operations が決める。
form_unit:                                # 部隊の編成（兵舎のマスに置く。兵と装備がそろうまで編成中）
  admin_cost: 1
  secret: always
  payload:
    type: object
    required: [army, x, y]
    additionalProperties: false
    properties:
      army: {type: string, description: "部隊の種類（army.yaml の名前。歩兵 infantry・機甲 armor）"}
      x: {type: integer, minimum: 0, description: "兵舎のマスの x"}
      y: {type: integer, minimum: 0, description: "兵舎のマスの y"}

disband_unit:                             # 部隊の解散（兵は島の余りの兵に戻り、装備は国の倉庫に戻る）
  admin_cost: 1
  secret: always
  payload:
    type: object
    required: [unit]
    additionalProperties: false
    properties:
      unit: {type: integer, minimum: 1, description: "部隊の番号"}

move_unit:                                # 部隊の移動（そろった部隊だけ。着くまで毎ターン進む）
  admin_cost: 0
  secret: always
  payload:
    type: object
    required: [unit, x, y]
    additionalProperties: false
    properties:
      unit: {type: integer, minimum: 1, description: "部隊の番号"}
      x: {type: integer, minimum: 0, description: "行き先のマスの x"}
      y: {type: integer, minimum: 0, description: "行き先のマスの y"}

dig_trench:                               # 陣地（塹壕）を掘る（部隊のいるマス。兵と建材で何ターンかかける）
  admin_cost: 0
  secret: always
  payload:
    type: object
    required: [unit]
    additionalProperties: false
    properties:
      unit: {type: integer, minimum: 1, description: "部隊の番号"}

stop_unit:                                # 部隊の続く命令を止める
  admin_cost: 0
  secret: always
  payload:
    type: object
    required: [unit]
    additionalProperties: false
    properties:
      unit: {type: integer, minimum: 1, description: "部隊の番号"}

form_fleet:                               # 艦隊の編成（母港の軍港のある島の区画に置く。乗員と艦がそろうまで編成中）
  admin_cost: 1
  secret: always
  payload:
    type: object
    required: [army, ships]
    additionalProperties: false
    properties:
      army: {type: string, description: "艦隊の種類（army.yaml の名前。小さな軍艦 corvette・フリゲート frigate・潜水艦 submarine・輸送船団 transport）"}
      ships: {type: integer, minimum: 1, description: "艦の数（1 艦隊に束ねる数。同じ種類だけ）"}

sail_fleet:                               # 艦隊の航海（そろった艦隊だけ。行き先の区画まで船の道を毎ターン進む。母港の区画に戻ると港につなぐ）
  admin_cost: 0
  secret: always
  payload:
    type: object
    required: [fleet, x, y]
    additionalProperties: false
    properties:
      fleet: {type: integer, minimum: 1, description: "艦隊の番号"}
      x: {type: integer, minimum: 0, description: "行き先の区画の x（世界マップ）"}
      y: {type: integer, minimum: 0, description: "行き先の区画の y（世界マップ）"}

load_unit:                                # 陸の部隊を輸送船団に載せる（母港の区画につないだ船団と、軍港のマスにいる部隊だけ）
  admin_cost: 0
  secret: always
  payload:
    type: object
    required: [unit, fleet]
    additionalProperties: false
    properties:
      unit: {type: integer, minimum: 1, description: "部隊の番号"}
      fleet: {type: integer, minimum: 1, description: "輸送船団の番号"}

unload_unit:                              # 載せた部隊を、母港の軍港のマスに降ろす（外国の島への揚陸は 4-3）
  admin_cost: 0
  secret: always
  payload:
    type: object
    required: [unit, fleet, x, y]
    additionalProperties: false
    properties:
      unit: {type: integer, minimum: 1, description: "部隊の番号"}
      fleet: {type: integer, minimum: 1, description: "輸送船団の番号"}
      x: {type: integer, minimum: 0, description: "降ろす軍港のマスの x"}
      y: {type: integer, minimum: 0, description: "降ろす軍港のマスの y"}
