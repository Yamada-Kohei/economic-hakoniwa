# 部隊の種類（フェーズ4-2 の③。設計書 15-military「部隊と基地」。初めの値の案は
# /mnt/project-files/phase4/military-values-draft.md）。
# soldiers: 部隊 1 つの兵の数（中隊）、equipment: 部隊が持つ装備（財 → 数）、weight: 船で運ぶ重さ（トン）、
# speed: 平地のマスで 1 ターンに進めるマス数（道路が満ちたマスは 1.5 倍、山と森は 2 マス分）、
# vehicles: 動くと燃料を使うか、strength: 強さ（歩兵 = 1。戦闘は 4-3）
# 海の艦隊（arm: sea。フェーズ4-2 の③'。同じ種類の艦を束ねた艦隊）は、soldiers と equipment が艦 1 隻の
# 乗員と艦、speed が 1 ターンに進む世界マップの区画の数、fuel が航海中の 1 隻 1 ターンの燃料（トン）、
# vision が見える範囲（区画。0 は同じ区画だけ）、capacity が輸送船 1 隻の運べる重さ（トン）、
# hunt が 1 隻あたり、見張りの区画を通る商船を 1 ターンに見つける見込み（通商破壊。MI-33）
infantry:
  arm: land
  soldiers: 100
  equipment: {weapons: 100}
  weight: 8
  speed: 8
  strength: 1

armor:
  arm: land
  soldiers: 60
  equipment: {weapons: 60, military_vehicle: 10}
  weight: 21
  speed: 12
  vehicles: true
  strength: 3

corvette:
  arm: sea
  soldiers: 60
  equipment: {warship: 1}
  speed: 6
  vision: 1
  fuel: 0.1
  detect: 0.5
  hunt: 0.25
  strength: 1

frigate:
  arm: sea
  soldiers: 200
  equipment: {frigate: 1}
  speed: 6
  vision: 2
  fuel: 0.35
  detect: 0.7
  hunt: 0.25
  strength: 3.5

submarine:
  arm: sea
  soldiers: 50
  equipment: {submarine: 1}
  speed: 4
  vision: 0
  fuel: 0.06
  stealth: true
  hunt: 0.15
  strength: 0.8

transport:
  arm: sea
  soldiers: 10
  equipment: {transport_ship: 1}
  speed: 4
  vision: 0
  fuel: 0.025
  capacity: 40
  strength: 0
