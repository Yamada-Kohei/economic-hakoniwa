# 施設。数値はフェーズ1の試し遊びで調整する仮の値です。
# 量は全力で動いたときの1ターンあたり。小数も書けます。
# workers・labor は人数。workers は {general: 1350, engineer: 150} のように種類ごとにも書けます（数だけなら
# 一般の労働者。技術者 engineer はフェーズ2-3 から）。priority は雇用と市場の割当の優先順位（0〜9、大きいほど先）。プレイヤーが命令で施設ごとに変えられます。
# public_service: 公務員の施設（賃金を国庫が払う）。zone: 指定したマス（オフィス街など）にだけ建つ。
# tileless: マスを持たない施設（運送業）。
# factors: 生産性の係数の重み（フェーズ2-3）。infra は施設の周りの交通、education は島の教育水準、
#   pollution は施設のマスの汚染1あたりに産出を下げる割合。作り方（recipes）ごとにも書けます。
#   フェーズ3-2 から climate（島の気候帯の産出の倍率。climate.yaml）と fertility（施設のマスの肥沃度）。
#   気候の倍率が 0 の作り方は、その気候の島では使えません。
# industry: 産業の分類（フェーズ3-2。表示名は locale の industries.yaml）。経験・集積・称号（3-3）と
#   計画経済の重点産業（3-4）で使います。

farm:
  category: primary
  industry: agriculture
  terrain: [plain]
  construction: {turns: 2, labor: 200, materials: {wood: 5}}
  workers: 500
  priority: 7
  factors: {infra: 0.3, education: 0.2, pollution: 0.02, climate: 1, fertility: 1}
  # 作る物を穀物・綿・嗜好品から選ぶ（フェーズ3-2）。化学品を肥料に入れると産出が 3 割増える。
  # grow_turns は蒔いてから収穫までのターン数（回3）。作物を替えると、1ターンに畑の 1/grow_turns
  # ずつ蒔き直し、蒔いた畑はその作物の grow_turns のあいだ何も出さない。穀物（麦・米）は4〜6か月、
  # 綿は半年ほど。嗜好品は、たばこなら4か月ほど、コーヒーや茶は実るまで数年かかるので、間をとって1年
  recipes:
    default:
      outputs: {grain: 20}
      grow_turns: 5
    fertilized:
      inputs: {chemicals: 1}
      outputs: {grain: 26}
      grow_turns: 5
    cotton:
      outputs: {cotton: 12}
      grow_turns: 6
    cotton_fertilized:
      inputs: {chemicals: 1}
      outputs: {cotton: 15.6}
      grow_turns: 6
    luxury_crop:
      outputs: {luxury_crop: 8}
      grow_turns: 12
    luxury_crop_fertilized:
      inputs: {chemicals: 1}
      outputs: {luxury_crop: 10.4}
      grow_turns: 12
  sprite: farm

lumber_camp:
  category: primary
  industry: agriculture
  terrain: [forest]
  construction: {turns: 2, labor: 200, materials: {wood: 2}}
  workers: 400
  priority: 5
  factors: {infra: 0.5, education: 0.1, climate: 1}
  recipes:
    default:
      outputs: {wood: 10}
  sprite: lumber_camp

quarry:
  category: primary
  industry: mining
  terrain: [mountain]
  construction: {turns: 3, labor: 300, materials: {wood: 5}}
  workers: 600
  priority: 5
  pollution: {amount: 1, radius: 1}
  factors: {infra: 0.8, education: 0.2}
  recipes:
    default:
      requires_resource: stone
      outputs: {stone: 12}
  sprite: quarry

mine:
  category: primary
  industry: mining
  terrain: [mountain]
  max_per_island: 2       # 1つの国が持てる数（工事中も数える）
  construction: {turns: 4, labor: 400, materials: {wood: 10, building_materials: 5}}
  workers: 800
  priority: 5
  pollution: {amount: 2, radius: 1}
  factors: {infra: 0.8, education: 0.2}
  recipes:
    iron_ore:
      requires_resource: iron_ore
      inputs: {electricity: 2}
      outputs: {iron_ore: 12}
    coal:
      requires_resource: coal
      inputs: {electricity: 2}
      outputs: {coal: 12}
    bauxite:              # フェーズ3-2
      requires_resource: bauxite
      inputs: {electricity: 2}
      outputs: {bauxite: 12}
  sprite: mine

# 油井（フェーズ3-2）。原油を選んだ島の平地か山に建ちます。鉱山と同じく1つの国が2つまで。
oil_well:
  category: primary
  industry: mining
  terrain: [plain, mountain]
  max_per_island: 2
  construction: {turns: 4, labor: 400, materials: {wood: 10, building_materials: 5}}
  workers: 300
  priority: 5
  pollution: {amount: 2, radius: 1}
  factors: {infra: 0.6, education: 0.2}
  recipes:
    default:
      requires_resource: crude_oil
      inputs: {electricity: 2}
      outputs: {crude_oil: 12}
  sprite: oil_well

fishing_port:
  category: primary
  industry: agriculture
  terrain: [plain]
  coastal: true
  construction: {turns: 3, labor: 300, materials: {wood: 15}}
  workers: 600
  priority: 7
  factors: {infra: 0.3, education: 0.1, pollution: 0.02, climate: 1}
  recipes:
    default:
      outputs: {fish: 24}
  sprite: fishing_port

steel_mill:
  category: industry
  industry: steel
  terrain: [plain]
  construction: {turns: 6, labor: 800, materials: {building_materials: 30, machinery: 5}}
  workers: {general: 1900, engineer: 100}
  pollution: {amount: 8, radius: 2}
  factors: {infra: 0.8, education: 0.4}
  recipes:
    default:
      inputs: {iron_ore: 10, coal: 5, electricity: 5}
      outputs: {steel: 5}
  sprite: steel_mill

building_materials_plant:
  category: industry
  industry: mining
  terrain: [plain]
  construction: {turns: 4, labor: 500, materials: {wood: 25}}
  workers: 1000
  pollution: {amount: 3, radius: 1}
  factors: {infra: 0.6, education: 0.3}
  recipes:
    stone:
      inputs: {stone: 10, wood: 2, electricity: 2}
      outputs: {building_materials: 8}
    wood:
      inputs: {wood: 12, electricity: 2}
      outputs: {building_materials: 5}
  sprite: building_materials_plant

machinery_plant:
  category: industry
  industry: machinery
  terrain: [plain]
  construction: {turns: 6, labor: 800, materials: {building_materials: 30, steel: 10}}
  workers: {general: 1350, engineer: 150}
  pollution: {amount: 3, radius: 1}
  factors: {infra: 0.5, education: 0.8}
  recipes:
    default:
      inputs: {steel: 4, electricity: 4}
      outputs: {machinery: 2}
  sprite: machinery_plant

food_factory:
  category: industry
  industry: food
  terrain: [plain]
  construction: {turns: 3, labor: 400, materials: {building_materials: 10}}
  workers: 800
  priority: 6
  factors: {infra: 0.5, education: 0.3}
  recipes:
    default:
      inputs: {grain: 12, electricity: 1}
      outputs: {food: 10}
  sprite: food_factory

thermal_power_plant:
  category: power
  industry: energy
  terrain: [plain]
  construction: {turns: 5, labor: 600, materials: {building_materials: 25, steel: 10, machinery: 5}}
  workers: {general: 550, engineer: 50}
  priority: 8
  pollution: {amount: 6, radius: 2}
  factors: {infra: 0.4, education: 0.3}
  recipes:
    default:
      inputs: {coal: 4}
      outputs: {electricity: 30}
    fuel:                 # 石炭の代わりに燃料で動く（フェーズ3-2）
      inputs: {fuel: 3}
      outputs: {electricity: 30}
  sprite: thermal_power_plant

hydro_power_plant:
  category: power
  industry: energy
  terrain: [mountain]
  construction: {turns: 8, labor: 1000, materials: {building_materials: 60, steel: 10, machinery: 5}}
  workers: {general: 270, engineer: 30}
  priority: 8
  factors: {infra: 0.2, education: 0.3}
  recipes:
    default:
      outputs: {electricity: 20}
  sprite: hydro_power_plant

consumer_goods_factory:
  category: industry
  industry: consumer_goods
  terrain: [plain]
  construction: {turns: 4, labor: 500, materials: {building_materials: 20, machinery: 5}}
  workers: {general: 950, engineer: 50}
  pollution: {amount: 2, radius: 1}
  factors: {infra: 0.5, education: 0.5}
  recipes:
    default:
      inputs: {wood: 4, steel: 1, electricity: 2}
      outputs: {consumer_goods: 6}
    wood:                 # 鋼鉄を作れない島でも作れるが、手間がかかる
      inputs: {wood: 8, electricity: 2}
      outputs: {consumer_goods: 4}
    chemicals:            # 化学品（樹脂など）から作る（フェーズ3-2）。原料の費用が初めの値段で
      # 鋼鉄の作り方とそろうように 4（設計の 2 では、どの民営工場もこの作り方に替えて化学品の値段が
      # 初めの十数倍まで上がった）
      inputs: {chemicals: 4, electricity: 2}
      outputs: {consumer_goods: 6}
  sprite: consumer_goods_factory

# 製油所（フェーズ3-2）。原油から燃料と化学品を作ります。
refinery:
  category: industry
  industry: petroleum
  terrain: [plain]
  construction: {turns: 6, labor: 700, materials: {building_materials: 30, steel: 10, machinery: 3}}
  workers: {general: 700, engineer: 100}
  pollution: {amount: 6, radius: 2}
  factors: {infra: 0.6, education: 0.5}
  recipes:
    default:
      inputs: {crude_oil: 10, electricity: 3}
      outputs: {fuel: 6, chemicals: 2}
  sprite: refinery

# アルミ精錬所（フェーズ3-2）。電力を多く使うので、水力発電の多い島が強い。
aluminium_smelter:
  category: industry
  industry: nonferrous
  terrain: [plain]
  construction: {turns: 6, labor: 600, materials: {building_materials: 30, steel: 10, machinery: 3}}
  workers: {general: 450, engineer: 50}
  pollution: {amount: 4, radius: 1}
  factors: {infra: 0.6, education: 0.5}
  recipes:
    default:
      inputs: {bauxite: 8, electricity: 20}
      outputs: {aluminium: 3}
  sprite: aluminium_smelter

# 繊維工場（フェーズ3-2）。綿から衣料を作ります。人手は多く、技術者は要りません。
textile_mill:
  category: industry
  industry: textile
  terrain: [plain]
  construction: {turns: 3, labor: 400, materials: {building_materials: 15, machinery: 1}}
  workers: 1500
  pollution: {amount: 1, radius: 1}
  factors: {infra: 0.5, education: 0.2}
  recipes:
    default:
      inputs: {cotton: 8, electricity: 1}
      outputs: {clothing: 6}
  sprite: textile_mill

# 牧場（フェーズ3-2）。穀物を飼料にして肉を作ります（放牧なので気候と肥沃度が効く）。
ranch:
  category: primary
  industry: agriculture
  terrain: [plain]
  construction: {turns: 2, labor: 200, materials: {wood: 8}}
  workers: 250
  priority: 7
  factors: {infra: 0.3, education: 0.1, pollution: 0.02, climate: 1, fertility: 1}
  recipes:
    default:
      inputs: {grain: 4}
      outputs: {meat: 5}
  sprite: ranch

# 自動車工場（フェーズ3-2）。人手も技術者も多く要ります。量は台（1 ターン全力で 200 台）。
automobile_plant:
  category: industry
  industry: automobile
  terrain: [plain]
  construction: {turns: 8, labor: 1000, materials: {building_materials: 40, steel: 20, machinery: 10}}
  workers: {general: 1800, engineer: 200}
  pollution: {amount: 3, radius: 1}
  factors: {infra: 0.8, education: 0.8}
  recipes:
    default:
      inputs: {steel: 4, chemicals: 1, electricity: 3}
      outputs: {automobile: 200}
    aluminium:            # 鋼鉄の半分をアルミに替える
      inputs: {steel: 2, aluminium: 1, chemicals: 1, electricity: 3}
      outputs: {automobile: 200}
  sprite: automobile_plant

government_office:
  category: admin
  terrain: [plain]
  near_capital: 3
  public_service: true
  construction: {turns: 3, labor: 300, materials: {building_materials: 10, wood: 5}}
  workers: 1000
  priority: 9
  admin_power: 0.001     # 働く人1人あたりの行政力（1,000 人で 1）
  recipes:
    default: {}
  sprite: government_office

# 警察（フェーズ3-4）。中央省庁と同じ作りの公務の施設で、警察官の賃金は予算の項目「治安費」
# （security。建国のときは 0）から払います。police: 暴動で止まる施設と壊れる施設を、警察官の足りて
# いる割合（住民 × game.yaml の politics.riot.police_per_person に対して）だけ減らす。政情そのものは
# 上げません。
police:
  category: security
  terrain: [plain]
  public_service: true
  budget: security
  police: true
  construction: {turns: 2, labor: 200, materials: {building_materials: 6, wood: 2}}
  workers: 200
  priority: 9
  recipes:
    default: {}

# 学校と大学（フェーズ2-3）。国庫直轄の公務の施設で、教員の賃金と教材（投入の消費財）は教育費から
# 払います。education の capacity は学校の子どもの定員、engineers は大学が1ターンに育てる技術者の数で、
# どちらも稼働率（教員と教材の足りている割合の小さい方）の分だけ効きます。
school:
  category: education
  terrain: [plain]
  public_service: true
  budget: education       # 賃金と教材を払う予算の項目（書かなければ civil_servants）
  construction: {turns: 3, labor: 300, materials: {building_materials: 15, wood: 5}}
  workers: 200
  priority: 8
  education: {capacity: 3000}
  recipes:
    default:
      inputs: {consumer_goods: 0.1}   # 教材（教員の賃金の2割ほど）
  sprite: school

university:
  category: education
  terrain: [plain]
  public_service: true
  budget: education
  construction: {turns: 6, labor: 800, materials: {building_materials: 40, wood: 10}}  # 鋼鉄と機械の連鎖がない島にも建てられるように
  workers: 500
  priority: 8
  education: {engineers: 10}       # 引退（1ターン 0.5%）と釣り合うのは 2,000 人
  recipes:
    default:
      inputs: {consumer_goods: 0.3}
  sprite: university

# 市中銀行。オフィス街のマスに入ります。フェーズ2-1 は建国のときに島に1つ置き、建設の命令はフェーズ2-2 から。
bank:
  category: finance
  terrain: [plain]
  zone: office
  max_per_island: 5   # banking.max_banks と同じ（民間銀行を含む）
  construction: {turns: 3, labor: 300, materials: {building_materials: 15, machinery: 1}}
  workers: 50   # 融資のないフェーズ2-1 は利子の差だけが収入なので、職員を少なくして赤字にしない
  recipes:
    default: {}
  sprite: bank

# 運送業。島に1つ、マスを持たずに置きます。運賃を受け取り、運んだ量に合わせて運転手を雇います。
transport:
  category: transport
  terrain: [plain]
  tileless: true
  buildable: false
  construction: {turns: 1}
  workers: 0
  recipes:
    default: {}

# 港（フェーズ3-1）。島の外との物の出入りはすべて港を通ります。国が建て（民営では建たない）、島に1つ。
# 荷の積み下ろしは 1 ターンに game.yaml の trade.port_capacity トンまで。働く人は扱った荷の量に合わせて
# 雇い（trade.port_labor）、荷 1 トンごとに使用料を受け取ります。
port:
  category: transport
  terrain: [plain]
  coastal: true
  max_per_island: 1
  construction: {turns: 6, labor: 500, materials: {building_materials: 30, steel: 10, machinery: 1}}
  workers: 300
  priority: 7
  recipes:
    default: {}
  sprite: port

# 海運業（フェーズ3-1）。運送業と同じく島に1つ、マスを持たずに置きます。輸送船を設備として持ち、
# 航海に出ている船の数に合わせて船員を雇い（trade.ship_crew）、輸入の荷を運んで運賃を受け取ります。
shipping:
  category: transport
  terrain: [plain]
  tileless: true
  buildable: false
  construction: {turns: 1}
  workers: 0
  recipes:
    default: {}

# 造船所（フェーズ3-1）。鋼鉄と機械から輸送船を作ります（4 ターンで 1 隻。1 ターンに 1/4 隻ずつ進む）。
shipyard:
  category: industry
  industry: shipbuilding
  terrain: [plain]
  coastal: true
  construction: {turns: 5, labor: 600, materials: {building_materials: 25, steel: 10, machinery: 3}}
  workers: {general: 380, engineer: 20}
  pollution: {amount: 2, radius: 1}
  factors: {infra: 0.5, education: 0.5}
  recipes:
    default:
      inputs: {steel: 1.5, machinery: 0.25, electricity: 1.25}
      outputs: {transport_ship: 0.25}
    aluminium:            # 鋼鉄の 3 割をアルミに替える（フェーズ3-2）
      inputs: {steel: 1.05, aluminium: 0.225, machinery: 0.25, electricity: 1.25}
      outputs: {transport_ship: 0.25}
  sprite: shipyard

# 商社（フェーズ3-1）。銀行と同じくオフィス街のマスに入り、島にいくつも置けます。島の市場で輸出する物を
# 買って貿易圏の市場で売り、圏で買った物を輸入して島の市場で売ります（hakoniwa_core/trade/traders.py）。
trading:
  category: trade
  terrain: [plain]
  zone: office
  max_per_island: 10
  construction: {turns: 3, labor: 300, materials: {building_materials: 15, machinery: 1}}
  workers: 50
  recipes:
    default: {}
  sprite: trading

# 町（住宅地）は自動で建ちます（命令では建てられません）。住める人数・見た目・育つのに要る資源は
# settlements.yaml で決まります。
housing:
  category: housing
  terrain: [plain]
  buildable: false
  construction: {turns: 1}
  workers: 0
  recipes:
    default: {}
  sprite: housing
