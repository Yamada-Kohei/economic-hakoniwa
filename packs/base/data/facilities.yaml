      inputs: {steel: 0.6, machinery: 0.15, chemicals: 0.15, electricity: 1}
      outputs: {weapons: 300}
    ammunition:           # 弾薬 6 トン
      inputs: {chemicals: 3, steel: 1.8, electricity: 1}
      outputs: {ammunition: 6}
  sprite: arms_plant

# 繊維工場（フェーズ3-2）。綿から衣料を作ります。人手は多く、技術者は要りません。
