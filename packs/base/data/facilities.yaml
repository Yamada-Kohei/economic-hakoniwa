  category: industry
  industry: textile
  terrain: [plain]
  construction: {turns: 3, labor: 400, materials: {building_materials: 15, machinery: 1}}
  workers: 1500
  pollution: {amount: 1, radius: 1}
  factors: {infra: 0.5, education: 0.2}
  recipes:
    default:
      inputs: {cotton: 8, electricity: 1}
      outputs: {clothing: 6}
  sprite: textile_mill

# 牧場（フェーズ3-2）。穀物を飼料にして肉を作ります（放牧なので気候と肥沃度が効く）。
ranch:
  category: primary
  industry: agriculture
  terrain: [plain]
  construction: {turns: 2, labor: 200, materials: {wood: 8}}
  workers: 250
  priority: 7
  factors: {infra: 0.3, education: 0.1, pollution: 0.02, climate: 1, fertility: 1}
  recipes:
    default:
      inputs: {grain: 4}
      outputs: {meat: 5}
  sprite: ranch

# 自動車部品工場（回7 後半。W-76）。エンジン・足回り・座席・電装などの部品を作り、自動車工場へ売ります。
# 現実の自動車の製造は、組み立てより部品の会社（下請け）のほうが人が多い（日本では数倍）ので、人も技術者も
# 組み立て工場より多く要ります。部品 1 組が自動車 1 台分です。組み立て工場の近くほど運賃が安く、出資は
# 同じ産業の企業（自動車の会社）が先に出します（系列。economy/companies.py の choose_investor）。
auto_parts_plant:
  category: industry
  industry: automobile
  experience_share: 0.5   # 組み立て工場と合わせて自動車 1 台分の経験
  terrain: [plain]
  construction: {turns: 5, labor: 600, materials: {building_materials: 25, steel: 10, machinery: 6}}
  workers: {general: 1250, engineer: 130}
  pollution: {amount: 2, radius: 1}
  factors: {infra: 0.7, education: 0.7}
  recipes:
    default:              # アルミのない島: エンジンと足回りの分も鋼鉄で
      inputs: {steel: 3.2, chemicals: 0.8, clothing: 0.12, machinery: 0.2, electricity: 1.5}
      outputs: {auto_parts: 200}
    aluminium:
      inputs: {steel: 1.8, aluminium: 0.7, chemicals: 0.8, clothing: 0.12, machinery: 0.2, electricity: 1.5}
      outputs: {auto_parts: 200}

# 自動車工場（フェーズ3-2）。部品を組み立て、車体を作って塗ります。量は台（1 ターン全力で 200 台）。
# 材料は実物の1台の割合に合わせる（回6。台帳 2026-10-19 W-75）: 鋼鉄を 1 として、アルミ 0.17、樹脂・ゴム・
# 塗料（化学品）0.28、座席の布（衣料）0.03 ほど。回7 後半（W-76）から、車体の鋼鉄と塗料のほかは部品工場の
# 部品（1 台に 1 組）で、部品工場と合わせた材料は回6 の自動車工場と同じです
automobile_plant:
  category: industry
  industry: automobile
  experience_share: 0.5
  terrain: [plain]
  construction: {turns: 8, labor: 1000, materials: {building_materials: 40, steel: 20, machinery: 10}}
  workers: {general: 550, engineer: 70}
  pollution: {amount: 3, radius: 1}
  factors: {infra: 0.8, education: 0.8}
  recipes:
    default:
      inputs: {auto_parts: 200, steel: 2.2, chemicals: 0.3, electricity: 1.5}
      outputs: {automobile: 200}
    military_vehicle:     # フェーズ4-2: 戦車などの軍用車両。平時の自動車と工場を取り合う
      inputs: {auto_parts: 20, steel: 2.4, machinery: 0.2, electronics: 0.1, electricity: 1.5}
      outputs: {military_vehicle: 2}
  sprite: automobile_plant

government_office:
  category: admin
  terrain: [plain]
  near_capital: 3
  public_service: true
  construction: {turns: 3, labor: 300, materials: {building_materials: 10, wood: 5}}
  workers: 1000
  priority: 9
  admin_power: 0.001     # 働く人1人あたりの行政力（1,000 人で 1）
  recipes:
    default: {}
  sprite: government_office

# 警察（フェーズ3-4）。中央省庁と同じ作りの公務の施設で、警察官の賃金は予算の項目「治安費」
# （security。建国のときは 0）から払います。police: 暴動で止まる施設と壊れる施設を、警察官の足りて
# いる割合（住民 × game.yaml の politics.riot.police_per_person に対して）だけ減らす。政情そのものは
# 上げません。
police:
  category: security
  terrain: [plain]
  public_service: true
  budget: security
  police: true
  construction: {turns: 2, labor: 200, materials: {building_materials: 6, wood: 2}}
  workers: 200
  priority: 9
  recipes:
    default: {}

# 学校と大学（フェーズ2-3）。国庫直轄の公務の施設で、教員の賃金と教材（投入の消費財）は教育費から
# 払います。education の capacity は学校の子どもの定員、engineers は大学が1ターンに育てる技術者の数で、
# どちらも稼働率（教員と教材の足りている割合の小さい方）の分だけ効きます。
school:
  category: education
  terrain: [plain]
  public_service: true
  budget: education       # 賃金と教材を払う予算の項目（書かなければ civil_servants）
  construction: {turns: 3, labor: 300, materials: {building_materials: 15, wood: 5}}
  workers: 200
  priority: 8
  education: {capacity: 3000}
  recipes:
    default:
      inputs: {consumer_goods: 0.1}   # 教材（教員の賃金の2割ほど）
  sprite: school

university:
  category: education
  terrain: [plain]
  public_service: true
  budget: education
  construction: {turns: 6, labor: 800, materials: {building_materials: 40, wood: 10}}  # 鋼鉄と機械の連鎖がない島にも建てられるように
  workers: 500
  priority: 8
  education: {engineers: 10}       # 引退（1ターン 0.5%）と釣り合うのは 2,000 人
  recipes:
    default:
      inputs: {consumer_goods: 0.3}
  sprite: university

# 市中銀行。オフィス街のマスに入ります。フェーズ2-1 は建国のときに島に1つ置き、建設の命令はフェーズ2-2 から。
bank:
  category: finance
  terrain: [plain]
  zone: office
  max_per_island: 5   # banking.max_banks と同じ（民間銀行を含む）
  construction: {turns: 3, labor: 300, materials: {building_materials: 15, machinery: 1}}
  workers: 50   # 融資のないフェーズ2-1 は利子の差だけが収入なので、職員を少なくして赤字にしない
  recipes:
    default: {}
  sprite: bank

# 運送業。島に1つ、マスを持たずに置きます。運賃を受け取り、運んだ量に合わせて運転手を雇います。
transport:
  category: transport
  terrain: [plain]
  tileless: true
  buildable: false
  construction: {turns: 1}
  workers: 0
  recipes:
    default: {}

# 港（フェーズ3-1）。島の外との物の出入りはすべて港を通ります。国が建て（民営では建たない）、島に1つ。
# 荷の積み下ろしは 1 ターンに game.yaml の trade.port_capacity トンまで。働く人は扱った荷の量に合わせて
# 雇い（trade.port_labor）、荷 1 トンごとに使用料を受け取ります。
port:
  category: transport
  terrain: [plain]
  coastal: true
  max_per_island: 1
  construction: {turns: 6, labor: 500, materials: {building_materials: 30, steel: 10, machinery: 1}}
  workers: 300
  priority: 7
  recipes:
    default: {}
  sprite: port

# 海運業（フェーズ3-1）。運送業と同じく島に1つ、マスを持たずに置きます。輸送船を設備として持ち、
# 航海に出ている船の数に合わせて船員を雇い（trade.ship_crew）、輸入の荷を運んで運賃を受け取ります。
shipping:
  category: transport
  terrain: [plain]
  tileless: true
  buildable: false
  construction: {turns: 1}
  workers: 0
  recipes:
    default: {}

# 造船所（フェーズ3-1）。鋼鉄と機械から輸送船を作ります（4 ターンで 1 隻。1 ターンに 1/4 隻ずつ進む）。
shipyard:
  category: industry
  industry: shipbuilding
  terrain: [plain]
  coastal: true
  construction: {turns: 5, labor: 600, materials: {building_materials: 25, steel: 10, machinery: 3}}
  workers: {general: 380, engineer: 20}
  pollution: {amount: 2, radius: 1}
  factors: {infra: 0.5, education: 0.5}
  recipes:
    default:
      inputs: {steel: 1.5, machinery: 0.25, electricity: 1.25}
      outputs: {transport_ship: 0.25}
    aluminium:            # 鋼鉄の 3 割をアルミに替える（フェーズ3-2）
      inputs: {steel: 1.05, aluminium: 0.225, machinery: 0.25, electricity: 1.25}
      outputs: {transport_ship: 0.25}
    warship:              # フェーズ4-2: 小さな軍艦。10 ターンで 1 隻
      inputs: {steel: 1.6, machinery: 0.3, electronics: 0.2, electricity: 1.25}
      outputs: {warship: 0.1}
    frigate:              # 大きな軍艦。24 ターンで 1 隻（量は 1000 分の 1 単位の整数なので 0.042 隻 = 24 ターンで 1.008 隻）
      inputs: {steel: 2.0, machinery: 0.375, electronics: 0.33, electricity: 1.25}
      outputs: {frigate: 0.042}
    submarine:            # 潜水艦。12 ターンで 1 隻（同じく 0.084 隻 = 12 ターンで 1.008 隻）
      inputs: {steel: 1.0, machinery: 0.25, electronics: 0.25, electricity: 1.25}
      outputs: {submarine: 0.084}
  sprite: shipyard

# 商社（フェーズ3-1）。銀行と同じくオフィス街のマスに入り、島にいくつも置けます。島の市場で輸出する物を
# 買って貿易圏の市場で売り、圏で買った物を輸入して島の市場で売ります（hakoniwa_core/trade/traders.py）。
trading:
  category: trade
  terrain: [plain]
  zone: office
  max_per_island: 10
  construction: {turns: 3, labor: 300, materials: {building_materials: 15, machinery: 1}}
  workers: 50
  recipes:
    default: {}
  sprite: trading

# 商店（回7）。町の中の小さな店（八百屋・衣料品店・雑貨店・スーパーなど）で、マスを取らず町のマスに属します
# （町の段階ごとに入れる数は settlements.yaml の shops）。売り場の働き（小売り）と少しのサービスを出し、電力と
# 包装などの消費財を少し使います。企業が採算で開き、退きます。お客は通勤圏に住む人だけです。
shop:
  category: commerce
  terrain: [plain]
  tileless: true
  site: town
  construction: {turns: 2, labor: 40, materials: {building_materials: 2}}
  workers: 40
  priority: 3
  recipes:
    default:
      inputs: {electricity: 0.4, consumer_goods: 0.01}
      outputs: {retail: 48, services: 8}

# 百貨店（回7）。商業地のマスに建つ大きな店で、衣料・消費財などの小売りとサービスを出します。働く人が多く、
# 1人あたりの量も商店より多い（規模の経済）。電力を多く使います。企業が採算で建て、国は出店を規制できます
# （命令 set_retail_policy）。お客は車を持つ家計なら島じゅうから、ない家計は通勤圏に住む人です。
department_store:
  category: commerce
  terrain: [plain]
  zone: commercial
  construction: {turns: 6, labor: 400, materials: {building_materials: 30, steel: 5}}
  workers: 300
  priority: 3
  factors: {infra: 0.3}
  recipes:
    default:
      inputs: {electricity: 6, consumer_goods: 0.05}
      outputs: {retail: 420, services: 60}
  sprite: department_store

# 商業・サービス業（バランス調整）。運送業と同じく島に1つ、マスを持たずに置きます（移し替えの段で
# 置く）。商店・飲食・理美容・娯楽・修理などの小さな店の集まりで、住民がサービスを買いに行く集落
# ごとに、そこで人を雇います。雇う人数は売上で決まります（hakoniwa_core/economy/services.py）。
services:
  category: commerce
  terrain: [plain]
  tileless: true
  buildable: false
  construction: {turns: 1}
  workers: 0
  recipes:
    default: {}

# 町（住宅地）は自動で建ちます（命令では建てられません）。住める人数・見た目・育つのに要る資源は
# settlements.yaml で決まります。
housing:
  category: housing
  terrain: [plain]
  buildable: false
  construction: {turns: 1}
  workers: 0
  recipes:
    default: {}
  sprite: housing

# 記念碑（フェーズ4-1。設計書 タブ 2 の PO-47・PO-48）。働く人も産出もなく、効果は将来の観光の魅力
# （attraction）だけ。費用は資材と工事の賃金で、ふつうの施設の工事と同じ。建てられる条件は
# monument（hakoniwa_core/monuments.py の CONDITIONS。しきい値は game.yaml の monuments）。
# 碑文は建てるときに自動の文を作り（server/web/monuments.py）、遊ぶ人が 1〜2 行足せる。
# モノリスと自作の記念碑以外は、1 つの国に 1 つまで（建て直すと、その時の記録で碑文が変わる）。
monument_monolith:
