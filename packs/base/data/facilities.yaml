  recipes:
    default:
      inputs: {bauxite: 8, electricity: 20}
      outputs: {aluminium: 3}
  sprite: aluminium_smelter

# 銅の精錬所・電子機器工場・兵器工場（フェーズ4-2。設計書 15-military「武器と装備」）。
# 銅の精錬所は銅鉱石から銅を、電子機器工場は銅・化学品・機械から電子機器（レーダー・ミサイル・軍艦・潜水艦・
# 軍用車両の材料）を、兵器工場は武器と弾薬（作り方で選ぶ）を作る。兵器は国だけが買う。
copper_smelter:
  category: industry
  industry: nonferrous
  terrain: [plain]
  construction: {turns: 5, labor: 600, materials: {building_materials: 25, steel: 10, machinery: 3}}
  workers: {general: 270, engineer: 30}
  pollution: {amount: 4, radius: 1}
  factors: {infra: 0.6, education: 0.5}
  recipes:
    default:
      inputs: {copper_ore: 12, electricity: 8}
      outputs: {copper: 4}
  sprite: copper_smelter

electronics_plant:
  category: industry
  industry: electronics
  terrain: [plain]
  construction: {turns: 6, labor: 800, materials: {building_materials: 30, steel: 10, machinery: 5}}
  workers: {general: 320, engineer: 80}
  pollution: {amount: 2, radius: 1}
  factors: {infra: 0.7, education: 0.8}
  recipes:
    default:
      inputs: {copper: 1, chemicals: 0.6, machinery: 0.4, electricity: 3}
      outputs: {electronics: 2}
  sprite: electronics_plant

arms_plant:
