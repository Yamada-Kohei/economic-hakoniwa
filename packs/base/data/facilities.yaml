# 施設。数値はフェーズ1の試し遊びで調整する仮の値です。
# 量は全力で動いたときの1ターンあたり。小数も書けます。
# priority は雇用と配分の優先順位（0〜9、大きいほど先）。プレイヤーが命令で施設ごとに変えられます。

farm:
  category: primary
  terrain: [plain]
  construction: {turns: 2, labor: 20, materials: {wood: 5}}
  workers: 50
  priority: 7
  recipes:
    default:
      outputs: {grain: 20}
  sprite: farm

lumber_camp:
  category: primary
  terrain: [forest]
  construction: {turns: 2, labor: 20, materials: {wood: 2}}
  workers: 40
  priority: 5
  recipes:
    default:
      outputs: {wood: 10}
  sprite: lumber_camp

quarry:
  category: primary
  terrain: [mountain]
  construction: {turns: 3, labor: 30, materials: {wood: 5}}
  workers: 60
  priority: 5
  pollution: {amount: 1, radius: 1}
  recipes:
    default:
      requires_resource: stone
      outputs: {stone: 12}
  sprite: quarry

mine:
  category: primary
  terrain: [mountain]
  construction: {turns: 4, labor: 40, materials: {wood: 10, building_materials: 5}}
  workers: 80
  priority: 5
  pollution: {amount: 2, radius: 1}
  recipes:
    iron_ore:
      requires_resource: iron_ore
      inputs: {electricity: 2}
      outputs: {iron_ore: 12}
    coal:
      requires_resource: coal
      inputs: {electricity: 2}
      outputs: {coal: 12}
  sprite: mine

fishing_port:
  category: primary
  terrain: [plain]
  coastal: true
  construction: {turns: 3, labor: 30, materials: {wood: 15}}
  workers: 60
  priority: 7
  recipes:
    default:
      outputs: {fish: 24}
  sprite: fishing_port

steel_mill:
  category: industry
  terrain: [plain]
  construction: {turns: 6, labor: 80, materials: {building_materials: 30, machinery: 5}}
  workers: 200
  pollution: {amount: 8, radius: 2}
  recipes:
    default:
      inputs: {iron_ore: 10, coal: 5, electricity: 5}
      outputs: {steel: 5}
  sprite: steel_mill

building_materials_plant:
  category: industry
  terrain: [plain]
  construction: {turns: 4, labor: 50, materials: {wood: 25}}
  workers: 100
  pollution: {amount: 3, radius: 1}
  recipes:
    stone:
      inputs: {stone: 10, wood: 2, electricity: 2}
      outputs: {building_materials: 8}
    wood:
      inputs: {wood: 12, electricity: 2}
      outputs: {building_materials: 5}
  sprite: building_materials_plant

machinery_plant:
  category: industry
  terrain: [plain]
  construction: {turns: 6, labor: 80, materials: {building_materials: 30, steel: 10}}
  workers: 150
  pollution: {amount: 3, radius: 1}
  recipes:
    default:
      inputs: {steel: 4, electricity: 4}
      outputs: {machinery: 2}
  sprite: machinery_plant

food_factory:
  category: industry
  terrain: [plain]
  construction: {turns: 3, labor: 40, materials: {building_materials: 10}}
  workers: 80
  priority: 6
  recipes:
    default:
      inputs: {grain: 12, electricity: 1}
      outputs: {food: 10}
  sprite: food_factory

thermal_power_plant:
  category: power
  terrain: [plain]
  construction: {turns: 5, labor: 60, materials: {building_materials: 25, steel: 10, machinery: 5}}
  workers: 60
  priority: 8
  pollution: {amount: 6, radius: 2}
  recipes:
    default:
      inputs: {coal: 4}
      outputs: {electricity: 30}
  sprite: thermal_power_plant

hydro_power_plant:
  category: power
  terrain: [mountain]
  construction: {turns: 8, labor: 100, materials: {building_materials: 60, steel: 10, machinery: 5}}
  workers: 30
  priority: 8
  recipes:
    default:
      outputs: {electricity: 20}
  sprite: hydro_power_plant

government_office:
  category: admin
  terrain: [plain]
  near_capital: 3
  construction: {turns: 3, labor: 30, materials: {building_materials: 10, wood: 5}}
  workers: 100
  priority: 9
  admin_power: 0.1
  recipes:
    default: {}
  sprite: government_office

# 住宅は自動で建ちます（命令では建てられません）。住める人数と見た目は settlements.yaml で決まります。
housing:
  category: housing
  terrain: [plain]
  buildable: false
  construction: {turns: 1}
  workers: 0
  recipes:
    default: {}
  sprite: housing
