    automobile_plant: {short: 自動車, long: 自動車工場}
    school: {short: 学園, long: 学校}
    university: {short: 大学, long: 大学}
    shop: {short: 商店, long: 商店}
    department_store: {short: 百貨, long: 百貨店}
    services: {short: サービス, long: サービス業}
  # 土地に根ざす施設は、会社の名前を付けず地名で呼ぶ（三池炭鉱のように）
  land_bound: [farm, lumber_camp, quarry, mine, oil_well, fishing_port, ranch, hydro_power_plant, thermal_power_plant, port]
  patterns:   # 上から順に、条件（when）に合う最初の形を使います
    - {when: {category: admin}, text: "中央省庁"}
    - {when: {category: security}, text: "{place}{long}"}
    - {when: {category: military}, text: "{place}{long}"}
    - {when: {politics: totalitarian, economy: planned}, every: 5, text: "{leader}記念{long}"}
    - {when: {economy: planned}, text: "国営第{number}{long}"}
    - {when: {head_of_state: monarchy, owner: state}, text: "王立{place}{long}"}
    - {when: {economy: mixed, owner: state}, text: "{place}{short}公社"}
    - {when: {owner: state}, text: "国営{place}{long}"}
    - {text: "{place}{short}"}

  # 民営の企業の名前の材料（作風ごと。島の地名の作風に合わせる）。実在の会社名・人名は入れない。
  #   surnames: 創業者の姓。early / late: 創業者の会社の形（建国から early_years 年以内に生まれたら early）
  #   local: 地元の出資の会社の形。{surname} 姓、{place} 生まれた地名、{short} 最初の業種の短い名前
  #   joiner: 会社の頭の名前と地名の間に入れる文字。industries: この作風で言い換える業種の短い名前
  companies:
    japanese:
      surnames: [川端, 古賀, 柴田, 島田, 中野, 藤井, 大野, 青木, 森下, 堀内, 浅井, 多田, 久保, 山岸, 宮坂, 水野, 関口, 安藤, 平野, 石川, 岡崎, 千葉, 桑原, 梶原, 村井, 内田, 吉岡, 小野寺, 大塚, 北川, 西園, 戸田, 松岡, 生駒, 越智, 菊池]
