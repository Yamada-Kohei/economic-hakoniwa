# 自動で付く名前の材料。名前（ja など）は言語で、game.yaml の locale の言語のものを使います。
# プレイヤーが名前を付けた施設には使いません。自動の名前は生まれたときに決めて残し、国有化・民営化・
# 体制の変更のときだけ付け直されます（hakoniwa_core/naming.py）。
ja:
  # 島の地名の作風。建国のときに1つ選び、「前半＋後半」で区画ごとの地名を作ります（作風は足せます）。
  # 地名は島の画面から命令で付け直せます。首都のある区画の地名は首都名になります。
