# 自動で付く名前の材料。名前（ja など）は言語で、game.yaml の locale の言語のものを使います。
# プレイヤーが名前を付けた施設には使いません。体制が変わると、自動の名前も付け直されます。
ja:
  # 島の地名の作風。建国のときに1つ選び、「前半＋後半」で区画ごとの地名を作ります（作風は足せます）。
  # 地名は島の画面から命令で付け直せます。首都のある区画の地名は首都名になります。
  places:
    japanese:
      label: 日本風
      first: [北, 南, 東, 西, 大, 小, 新, 高, 白, 青, 赤, 金, 若, 朝, 富, 長, 松, 桜, 鶴, 千]
      second: [浜, 和, 河, 川, 山, 田, 野, 原, 崎, 岡, 沢, 森, 谷, 台, 津, 宮, 浦, 坂, 里, 江]
    british:
      label: イギリス風
      first: [ブラック, ウェスト, ノース, サウス, アシュ, ブラッド, チェル, ダーリン, ハート, ウィン, ストラト, リッチ, グレン, ミル, オック, ケン, ラドン, ウォリン, ベル, ストーン]
      second: [フォード, トン, ベリー, ハム, チェスター, ウィック, ビー, フィールド, ブリッジ, ウッド, モア, リー, ワース, ストン, ポート]
    american:
      label: アメリカ風
      first: [スプリング, グリーン, フェア, レイク, リバー, オーク, パイン, ローズ, メイプル, シルバー, ゴールド, ハリソン, フランクリン, ジャクソン, リンカーン, マディソン, クリフ, サンセット, ベル, ヒッコリー]
      second: [フィールド, ヴィル, ポート, ウッド, デール, ビュー, タウン, クリーク, ヒル, スプリングス, バーグ, シティ, ハーバー, ヘイヴン, ウォーター]
    german:
      label: ドイツ風
      first: [ローゼン, ノイ, ハイデル, フランケン, シュヴァルツ, ヴァイセン, ブラウン, リンデン, オーバー, ニーダー, アイゼン, ザルツ, マリエン, ゾンネン, ヴァルデン, シュタイン, ブルーメン, ケーニヒス, ルートヴィヒス, ヴォルフス]
      second: [ベルク, ブルク, ハイム, ドルフ, ハウゼン, シュタット, フルト, バッハ, フェルト, ヴァルト, ブリュック, ハーフェン, ローデ, ゼー, タール]
    russian:
      label: ロシア風
      first: [ノヴォ, クラスノ, ベロ, スタロ, ヴォル, ウラル, セヴェロ, ユジノ, ザレ, ペトロ, アレクサンドロ, ゼレノ, ソスノ, カメンノ, ドブロ, スヴェトロ, ヴィシュネ, ラド, イヴァノ, ニコラ]
      second: [ゴルスク, グラード, スク, ヴォ, ダール, ゴロド, ポリ, ヤルスク, ドンスク, ザヴォツク, ヴォルスク, レチェンスク, スロボダ, モルスク, カ]
    spanish:
      label: スペイン風
      joiner: ・
      first: [サン, サンタ, プエルト, ビリャ, リオ, モンテ, ヌエバ, バジェ, カンポ, プラヤ]
      second: [ロサ, マリア, クルス, ベルデ, ブランカ, ルナ, ソル, ミゲル, アレグレ, エスペランサ, ドラダ, レアル, フエンテ, オリバ, カルメン, ビスタ, ロマ, アルタ, セカ, パロマ]
    french:
      label: フランス風
      first: [ボー, ベル, モン, シャトー, フォンテーヌ, ヴィル, グラン, ロッシュ, クレール, ブラン]
      second: [モン, ヴィル, フォール, ヴァル, ポン, ブール, リュー, シャン, フォレ, ヌフ, ロワ, ラック, ボワ, リヴ, マレ]
    italian:
      label: イタリア風
      first: [モンテ, カステル, ポルト, ヴィラ, ロッカ, ヴァル, ボルゴ, ポッジョ, ピエトラ, ブオン]
      second: [フランコ, ベッロ, ヴェルデ, ロッソ, アルト, ヌオーヴォ, マーレ, ソーレ, フィオーレ, ルーナ, セレーノ, キアーロ, ドーロ, グランデ, マリーナ]
  numbers: [一, 二, 三, 四, 五, 六, 七, 八, 九, 十, 十一, 十二, 十三, 十四, 十五, 十六, 十七, 十八, 十九, 二十]
  industries:
    farm: {short: 農産, long: 農場}
    lumber_camp: {short: 林業, long: 林業場}
    quarry: {short: 採石, long: 採石場}
    mine: {short: 鉱業, long: 鉱山}
    fishing_port: {short: 水産, long: 漁港}
    steel_mill: {short: 製鉄, long: 製鉄所}
    building_materials_plant: {short: 建材, long: 建材工場}
    machinery_plant: {short: 重工業, long: 機械工場}
    food_factory: {short: 食品, long: 食品工場}
    consumer_goods_factory: {short: 日用品, long: 消費財工場}
    bank: {short: 銀行, long: 銀行}
    transport: {short: 運輸, long: 運送会社}
    port: {short: 港湾, long: 港}
    shipping: {short: 海運, long: 海運会社}
    shipyard: {short: 造船, long: 造船所}
    copper_smelter: {short: 製銅, long: 銅の精錬所}
    electronics_plant: {short: 電子, long: 電子機器工場}
    arms_plant: {short: 兵器, long: 兵器工場}
    missile_plant: {short: ミサイル, long: ミサイル工場}
    trading: {short: 商事, long: 商社}
    thermal_power_plant: {short: 電力, long: 火力発電所}
    hydro_power_plant: {short: 水力電気, long: 水力発電所}
    government_office: {short: 中央省庁, long: 中央省庁}
    police: {short: 警察, long: 警察署}
    barracks: {short: 兵舎, long: 兵舎}
    naval_base: {short: 軍港, long: 軍港}
    radar: {short: レーダー, long: レーダー基地}
    fortress: {short: 要塞, long: 要塞}
    missile_base: {short: ミサイル基地, long: ミサイル基地}
    air_defense: {short: 防空, long: 防空陣地}
  patterns:   # 上から順に、条件（when）に合う最初の形を使います
    - {when: {category: admin}, text: "中央省庁"}
    - {when: {category: security}, text: "{place}{long}"}
    - {when: {category: military}, text: "{place}{long}"}
    - {when: {politics: totalitarian, economy: planned}, every: 5, text: "{leader}記念{long}"}
    - {when: {economy: planned}, text: "国営第{number}{long}"}
    - {when: {head_of_state: monarchy, owner: state}, text: "王立{place}{long}"}
    - {when: {economy: mixed, owner: state}, text: "{place}{short}公社"}
    - {when: {owner: state}, text: "国営{place}{long}"}
    - {text: "{place}{short}"}
