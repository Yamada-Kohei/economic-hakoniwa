# 施設に自動で付く名前の材料。名前（ja など）は言語で、game.yaml の locale の言語のものを使います。
# プレイヤーが名前を付けた施設には使いません。体制が変わると、自動の名前も付け直されます。
ja:
  places:   # 島の地名は「前半＋後半」で作ります（例: 北浜、東和）
    first: [北, 南, 東, 西, 大, 小, 新, 高, 白, 青, 赤, 金, 若, 朝, 富, 長, 松, 桜, 鶴, 千]
    second: [浜, 和, 河, 川, 山, 田, 野, 原, 崎, 岡, 沢, 森, 谷, 台, 津, 宮, 浦, 坂, 里, 江]
  numbers: [一, 二, 三, 四, 五, 六, 七, 八, 九, 十, 十一, 十二, 十三, 十四, 十五, 十六, 十七, 十八, 十九, 二十]
  industries:
    farm: {short: 農産, long: 農場}
    lumber_camp: {short: 林業, long: 林業場}
    quarry: {short: 採石, long: 採石場}
    mine: {short: 鉱業, long: 鉱山}
    fishing_port: {short: 水産, long: 漁港}
    steel_mill: {short: 製鉄, long: 製鉄所}
    building_materials_plant: {short: 建材, long: 建材工場}
    machinery_plant: {short: 重工業, long: 機械工場}
    food_factory: {short: 食品, long: 食品工場}
    thermal_power_plant: {short: 電力, long: 火力発電所}
    hydro_power_plant: {short: 水力電気, long: 水力発電所}
    government_office: {short: 庁舎, long: 庁舎}
  patterns:   # 上から順に、条件（when）に合う最初の形を使います
    - {when: {category: admin}, text: "{place}合同庁舎"}
    - {when: {politics: totalitarian, economy: planned}, every: 5, text: "{leader}記念{long}"}
    - {when: {economy: planned}, text: "国営第{number}{long}"}
    - {when: {head_of_state: monarchy, owner: state}, text: "王立{place}{long}"}
    - {when: {economy: mixed, owner: state}, text: "{place}{short}公社"}
    - {when: {owner: state}, text: "国営{place}{long}"}
    - {text: "{place}{short}"}
