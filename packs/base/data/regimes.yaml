# 体制の選択肢。建国時に軸ごとに1つずつ選びます。
# 効くのは、首都に建つ建物の見た目と、施設と銀行の持ち主・国営施設の会計の形です。
# 体制ごとの特色（政情や命令の手続きへの効き目）はフェーズ3で足します。

# 政治の仕組み
democracy:     {axis: politics, capital_building: parliament}
authoritarian: {axis: politics, capital_building: official_residence}
totalitarian:  {axis: politics, capital_building: party_headquarters}

# 国家元首の形
monarchy: {axis: head_of_state, capital_building: palace}
republic: {axis: head_of_state, capital_building: presidential_office}

# 経済体制。owner: 建国直後の施設の持ち主の既定、state_owned: それでも国営にする施設（基幹産業など）
# state_accounting: 国営施設の会計の既定、bank_owner: 建国のときに置く銀行の持ち主（並べると銀行を
# その数だけ置き、家計の預金を等分する）、private_entry: 民営工場の参入（any: どれでも・non_core:
# state_owned を除く・none: なし）、bank_entry: 民間銀行の参入の既定（free: 自由・license: 許可制・
# closed: 禁止）、capital_controls: 資本取引の既定（free: 自由・official: 政府と中央銀行だけ・closed: 禁止。
# フェーズ3-3）、policy_loans: 国営銀行が state_owned の施設に利ざやなしで貸すか（政策融資）
market:
  axis: economy
  owner: private
  state_owned: [government_office]
  state_accounting: self_supporting
  bank_owner: private
  private_entry: any
  bank_entry: free
  capital_controls: free
  start: default
mixed:
  axis: economy
  owner: private
  state_owned: [government_office, thermal_power_plant, hydro_power_plant, mine, steel_mill, transport, shipping]
  state_accounting: self_supporting
  bank_owner: [state, private]
  private_entry: non_core
  bank_entry: license
  capital_controls: official
  policy_loans: true
  start: default
planned:
  axis: economy
  owner: state
  state_accounting: treasury
  bank_owner: state
  private_entry: none
  bank_entry: closed
  capital_controls: official
  start: default
