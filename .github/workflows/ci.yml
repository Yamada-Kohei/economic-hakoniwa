name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 変えたファイルが docs/ の下だけの PR か。そのときは lint とゲームの試験を飛ばし、
  # 下の design（文書の確かめ）だけを回す。main への push では毎回すべて回す。
  # 飛ばした仕事は「skipped」になり、GitHub では成功と同じに扱われるので、PR は待ちにならない。
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        name: 変えたファイルを調べる
        run: |
          docs_only=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR の checkout は main との合わせ（merge）の commit なので、1つ目の親との差が PR の変更
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^docs/'; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  # 文書の確かめ。設計書の索引と本文のずれ（tools/spec/design_index.py check）と、
  # docs/ を読む試験だけを回す。どの PR でも回る。
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: 設計書の索引と本文のずれ
        run: python tools/spec/design_index.py check
      - name: docs/ を読む試験
        run: pytest tests/core/test_spec_design.py tests/core/test_docs_match.py

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff（誤りの検査）
        run: ruff check .
      - name: Ruff（書式）
        run: ruff format --check .
      - name: 定義データの検証
        run: python -m hakoniwa_core.defs
      - name: 公開サーバーの台本（shellcheck）
        run: shellcheck -x -e SC1091 -S warning tools/deploy/prod/bin/* tools/deploy/prod/install.sh
      - name: 移行ファイルの作り忘れ
        run: python manage.py makemigrations --check --dry-run

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hakoniwa
          POSTGRES_PASSWORD: hakoniwa
          POSTGRES_DB: hakoniwa
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://hakoniwa:hakoniwa@localhost:5432/hakoniwa' || 'sqlite:///db.sqlite3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,postgres]"
      # 試験を頭の数（GitHub の入れ物は4つ）だけ同時に回す（pytest-xdist）。
      # PostgreSQL の組は、pytest-django が回し手ごとに別の DB（名前に gw0 などが付く）を作る。
      - name: 自動テスト
        run: pytest -n auto --durations=15
      - name: 一括シミュレーション（50島）
        run: python -m hakoniwa_core.simulate --islands 50 --turns 30
