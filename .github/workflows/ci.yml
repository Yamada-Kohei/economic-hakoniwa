name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read # release 向けの PR で、main での CI の結果を読む

jobs:
  # 変えたファイルが docs/ の下だけの PR か。そのときは lint とゲームの試験を飛ばし、
  # 下の design（文書の確かめ）だけを回す。main への push では毎回すべて回す。
  # 飛ばした仕事は「skipped」になり、GitHub では成功と同じに扱われるので、PR は待ちにならない。
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        name: 変えたファイルを調べる
        run: |
          docs_only=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR の checkout は main との合わせ（merge）の commit なので、1つ目の親との差が PR の変更
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^docs/'; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"
          # release への PR（本番へ出す PR）か。中身は main で全部の試験を通っているので、
          # 重い試験は回さず、下の release-check（軽い確かめ）だけにする。
          release=false
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "release" ]; then
            release=true
          fi
          echo "release=$release" | tee -a "$GITHUB_OUTPUT"

  # 文書の確かめ。設計書の索引と本文のずれ（tools/spec/design_index.py check）と、
  # docs/ を読む試験だけを回す。release への PR のほかは、どの PR でも回る。
  design:
    needs: changes
    if: needs.changes.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: 設計書の索引と本文のずれ
        run: python tools/spec/design_index.py check
      - name: docs/ を読む試験
        run: pytest tests/core/test_spec_design.py tests/core/test_docs_match.py

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff（誤りの検査）
        run: ruff check .
      - name: Ruff（書式）
        run: ruff format --check .
      - name: 定義データの検証
        run: python -m hakoniwa_core.defs
      - name: 公開サーバーの台本（shellcheck）
        run: shellcheck -x -e SC1091 -S warning tools/deploy/prod/bin/* tools/deploy/prod/install.sh
      - name: 移行ファイルの作り忘れ
        run: python manage.py makemigrations --check --dry-run

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hakoniwa
          POSTGRES_PASSWORD: hakoniwa
          POSTGRES_DB: hakoniwa
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://hakoniwa:hakoniwa@localhost:5432/hakoniwa' || 'sqlite:///db.sqlite3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,postgres]"
      # 試験を頭の数（GitHub の入れ物は4つ）だけ同時に回す（pytest-xdist）。
      # PostgreSQL の組は、pytest-django が回し手ごとに別の DB（名前に gw0 などが付く）を作る。
      - name: 自動テスト
        run: pytest -n auto --durations=15
      - name: 一括シミュレーション（50島）
        run: python -m hakoniwa_core.simulate --islands 50 --turns 30

  # release への PR（本番へ出す PR）だけの軽い確かめ。
  #   1. PR の先頭が main に入っている commit で、main への push の CI がそこで成功している
  #   2. 合わせた後の中身が main の先頭と同じ（main で試していない変更が本番に混ざらない）
  #   3. 起動の最小確認（設定の検査・空の DB への migrate・数ターンの一括シミュレーション）
  # 1 は、main の先頭が PR のマージで、中身がその PR の先頭と同じなら、PR で成功した CI で足りるとする
  # （マージの直後でも待たない）。そうでなく main の CI がまだ動いているときは、終わるまで待つ（最大およそ 50 分）。
  release-check:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR の先頭が main に入っているか
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::error::PR の先頭 ${HEAD_SHA:0:7} が main に入っていません。release へは main から出してください。"
            exit 1
          fi
      - name: 合わせた後の中身が PR の先頭と同じか
        run: |
          # checkout は release と PR の合わせ（merge）の commit。2つ目の親が PR の先頭
          if ! git diff --quiet HEAD^2 HEAD; then
            git diff --stat HEAD^2 HEAD
            echo "::error::release に main にない変更があり、合わせた後の中身が main と違います。"
            exit 1
          fi
      - name: main での CI の結果
        run: |
          ok() {  # ci.yml の run で、event と head_sha が合い、成功したものがあるか
            gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=$1&head_sha=$2" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length > 0' | grep -qx true
          }
          # 早道: 先頭が PR のマージで、マージ後の中身がその PR の先頭と同じなら、PR で通った CI を
          # そのまま使う（同じ中身をもう一度試すだけなので、main の CI の終わりを待たない）
          second=$(git rev-parse -q --verify "$HEAD_SHA^2" || true)
          if [ -n "$second" ] && git diff --quiet "$second" "$HEAD_SHA" && ok pull_request "$second"; then
            echo "マージした PR の先頭 ${second:0:7} の CI が成功済みで、中身も同じ"
            exit 0
          fi
          for i in $(seq 1 100); do
            runs=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$HEAD_SHA" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            echo "$runs"
            if echo "$runs" | jq -e 'any(.conclusion == "success")' >/dev/null; then
              echo "main の CI は ${HEAD_SHA:0:7} で成功済み"
              exit 0
            fi
            if ! echo "$runs" | jq -e 'any(.status != "completed")' >/dev/null; then
              echo "::error::main への push の CI が ${HEAD_SHA:0:7} で成功していません（ない・失敗・取り消し）。"
              exit 1
            fi
            sleep 30
          done
          echo "::error::main の CI が 50 分たっても終わりません。"
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: 起動の最小確認
        env:
          DATABASE_URL: sqlite:///db.sqlite3
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python -m hakoniwa_core.simulate --islands 5 --turns 3
