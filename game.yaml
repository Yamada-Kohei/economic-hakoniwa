# サーバー設定（ゲームの数値と組み立て）。
# パスはこのファイルからの相対パスです。数値はここで変えられます。

# 定義データ
packs_dirs: [packs]     # パックを探すフォルダ
packs: [base]           # 使うパック（本体パック base は必ず読み込まれます）
schemas_dir: schemas    # 定義データのスキーマ

# ターン処理の段。ここに並べた順に実行します。入れ外しもここで行います。
stages:
  - upgrade          # 前のフェーズから続く島の移し替え（1度だけ）
  - execute_orders   # 計画の実行（命令）。税率・予算などの政策もここで変わる
  - diplomacy        # 世界の段（フェーズ4-1）: 宣戦布告と条約（提案・署名・破棄）の命令、流れた提案、破棄の予告、講和の賠償の期日
  - budget           # 国庫の取り置き（支出の項目ごとに、支払いの順番で）
  - military         # 軍の維持（フェーズ4-2）: 兵の賃金（国防費）・食べ物・士気と練度・逃げる兵、食べ物を市場で買う注文
  - employment       # 通勤と雇用（賃金の高い施設から）
  - production       # 生産と電力（電力は送電網ごとに板寄せし、電気代を払う）
  - construction     # 工事の進み
  - payroll          # 賃金・所得税・失業手当と、賃金の見直し
  - market           # 財ごとの板寄せ、代金・運賃・消費税、傷んだ物を捨てる、希望価格の見直し
  - operations       # 世界の段（フェーズ4-2 の③）: 部隊の編成・解散・動き・陣地の命令、兵と装備の集め、部隊の動き。戦闘・揚陸・占領・ミサイルは 4-3 でここに足す
  - trade            # 世界の段（フェーズ3-1）: 荷下ろし、貿易圏と契約と援助の命令、為替（介入・固定相場）、圏の市場（関税・輸出補助・輸入の割り当て・禁輸）、契約の履行、船出
  - banking          # 銀行間と中央銀行への返済、融資の利払いと返済、預金の利子、運転資金の融資、預金の乗り換え
  - bonds            # 世界の段（フェーズ3-3 から）: 国債の利払いと償還（不履行）、入札と売れ残りの引き受け、国債の売買の市場。外国の持ち手と買い手も加わる
  - accounts         # 決算: 損益（国債は売った・償還された分の損益だけ）、減価償却、補助金、法人税、配当と納付、中央銀行の納付
  - central_bank     # 政策金利（独立のとき）、銀行間の貸し借り、中央銀行の貸し出し
  - failures         # 返済の遅れが続いた施設の倒産、銀行の破綻と破綻処理
  - firms_funds      # 企業の資金（回7）: 施設の余りを企業へ上げ、足りない施設に回す、連結の法人税と配当、立て直し
  - entry_exit       # 民営工場と民間銀行の参入・撤退、差し押さえた施設の売却
  - population       # 消費と人口
  - housing          # 都市の発展（町の自動建設と成長）
  - migration        # 世界の段（バランス調整の回3）: 国をまたぐ移民・帰る人・送金
  - politics         # 政情・支持率・選挙・デモと暴動・混乱期間・首都の建物の建て替え（フェーズ3-4）
  - infrastructure   # インフラの傷みと統計（工事と維持は雇用・工事・賃金・市場の段で進む）
  - education        # 教育水準と、大学の技術者の育成・引退
  - events           # 災害
  - records          # 記録（統計と、帳簿の確かめ）
  - rankings         # 世界の段（フェーズ3-3）: 各産業の経験の累積が世界で1位の国の称号と、産業ごとの順位
  - monuments        # 世界の段（フェーズ4-1）: 記念碑の条件が読む国の歴史（暴動・戦争・亡くなった人・称号）を書き足し、倒れる像を取り除く
  - trade_check      # 世界の段（フェーズ3-1）: 島をまたぐお金と運ぶ途中の荷の突き合わせ

# 名前付きの式の差し替え。例: admin_power: "my_pack_module:admin_power"
formulas: {}

turn:
  interval_minutes: 240  # 更新の間隔（ベータ版も4時間おき。設計書の台帳 2026-10-18）

# 世界の暦（hakoniwa_core/dates.py）。1ターンが1か月で、ターン1 が first_year 年の1月。ターンが 12 の倍数の
# ときが12月（年の終わり）で、年に1度の処理はそのターンに動く。画面では「箱庭暦32年11月（ターン 383）」と書く
calendar:
  name: 箱庭暦          # 暦の名前
  first_year: 1         # ターン1 の年（1 以上）

orders:
  # 行政力 = 1ターンに実行できる命令の数。中央省庁で働く公務員の数で決まり（施設の定義の admin_power）、
  # 最低 base_admin_power、最大 max_admin_power。命令ごとの消費は orders.yaml の admin_cost。
  base_admin_power: 1   # どの国でも1ターンに実行できる命令の数
  max_admin_power: 5    # 強大な国でもこれまで
  max_queue: 30         # 前もって並べておける命令の数

world:
  cells_per_island: 2   # 世界マップの区画数は島数のおよそこの倍
  default_islands: 50   # 規模の目安（区画数の計算に使う）
  # 一括シミュレーションとサンプルの島が鉱業資源を選ぶ重み（フェーズ3-2。プレイヤーの建国には
  # 効かない）。石炭と鉄鉱石はどこにでもあり、原油とボーキサイトは限られた島にある。銅鉱石は選ばず、military.veins で鉱業資源の上限の外に置く（フェーズ4-2）
  sample_resources: {coal: 3, iron_ore: 3, stone: 2, crude_oil: 1, bauxite: 1, copper_ore: 0, uranium_ore: 0}

# 気候帯と肥沃度（フェーズ3-2。hakoniwa_core/nature.py）。気候帯ごとの倍率は climate.yaml
climate:
  zones: [cold, temperate, tropical]   # 世界マップの行を上からこの順に分ける
  shares: [0.34, 0.33, 0.33]           # 分ける割合（合わせて 1）
  blend_turns: 12       # 移し替えた島は、気候の倍率をこのターン数かけて効かせる
  fertility: [0.7, 1.3] # 平地のマスの肥沃度の幅（島を作るときにまとまりで配る）
  fertility_cell: 5     # まとまりの大きさの目安（マス）
  fertility_terrain: plain
  fertility_loss: 0.02  # 汚染のあったターンが1年分たまるごとに下がる量
  fertility_floor: 0.5

# 経験と集積（フェーズ3-3。hakoniwa_core/economy/experience.py）。経験は島×産業ごとの累積の産出を
# 「標準の施設が全力で動いたターン数」で数え、係数 min(上限, 1 + slope × log2(1 + 累積 ÷ base_turns)) を
# その産業の施設の生産性に掛ける。
experience:
  base_turns: 24        # 係数の式の 24（標準の施設が2年動いた分で 1 + slope）
  slope: 0.1
  cap: 1.5              # 係数の上限
  assembly: [automobile, shipbuilding]  # 組み立て産業（上限が assembly_cap）
  assembly_cap: 1.7
  dormant_share: 0.1    # その年に動かした量が base_turns のこの割合に満たない産業は、
  decay: 0.05           # 年の終わりに累積がこの割合だけ減る
  cluster_radius: 3     # 集積: この半径のマスの中の、同じ産業のほかの施設1つごとに
  cluster_step: 0.03    # 生産性をこれだけ上げる（上限 cluster_cap）
  cluster_cap: 0.15
  cluster_categories: [industry]  # 集積が効く施設の分類（facilities.yaml の category。工場だけ）

island:
  size: 32              # 島は size × size のマスの中に描く
  land_min: 120         # 陸地のマス数の下限
  land_max: 400         # 陸地のマス数の上限（離れ小島も合わせた数）

founding:
  max_resources: 2      # 選べる鉱業資源の数
  terrain_edits: 40     # 自動で配った地形を描き直せるマス数
  sea_terrain: sea      # 地形の自動の配り方: 海、陸地に接する海、陸地の既定
  coast_terrain: shallows
  base_terrain: plain
  land_terrain:         # 上から順に、陸地のうち share の割合をこの地形にする
    - {terrain: mountain, share: 0.12, inland: true}   # inland: 海から遠いマスから
    - {terrain: forest, share: 0.25}                   # まとまりで散らす
  capital_margin: 2     # 首都の候補は、海からこのマス数以上離れたマスを優先する
  money:                # 建国と移し替えのときのお金（仕訳の列として作る）
    general_deposit: 1500   # 一般の層の預金（1人あたり）
    owner_deposit: 30000    # 資産を持つ層の預金（1人あたり、出資の後に残る額）
    treasury: 500           # 国庫（住民1人あたり）
    # 建国のときに独立採算の施設に持たせる手元の資金（支払いのターン数分）。売れ出すまでの賃金を払えず
    # 1年目に工場が止まらないように、建った後の施設の firms.operating_turns より多くする（バランス調整）
    operating_turns: 6
    bond: bond_5y           # 建国の国債の期間（finance.yaml の bond_term）
  name_max:             # 名前の長さの上限（文字数）
    country: 32
    capital: 16
    currency: 16
    currency_symbol: 4
    leader: 16

labor:
  commute_radius: 3     # 通勤圏（マス）。施設の定義の commute_radius で施設ごとに変えられる
  default_priority: 5   # 優先順位（0〜9）の既定値
  initial_wage: 1000    # 初めの賃金（一般の労働者1人1ターン）。値段の基準になる
  natural_unemployment: 0.05  # ふつうの失業率 u*
  wage_speed: 0.03      # 人手が足りないときの賃金の動きやすさ k_w
  slack_speed: 0.005    # 失業がふつうより多いときの賃金の動きやすさ
  indexation: 0.5       # 物価の上がった分のうち、賃金が追いかける割合
  max_raise: 0.03       # 1ターンに賃金が上がる上限
  max_cut: 0            # 1ターンに賃金が下がる上限（0 で下げない。失業の多い島で賃金と物価が下がり続けないように）
  poach_gap: 0.05       # 賃金がこの割合以上安い施設から働き手を引き抜く
  poach_limit: 0.1      # 1つの施設から1ターンに引き抜かれる働き手の割合の上限
  # 賃金の遅配（回3）: 払えない分の働き手は払われないまま働き続け、未払いが続いた月数 m に応じて、毎ターン
  # そのうち arrears_quit × (m + 1) の割合が辞める（半年続くと半分ほど、1年で9割ほどが辞める。1990年代の
  # ロシアでは遅配が数か月続いても多くの人が働き続けた）
  arrears_quit: 0.03
  # 食べ物が買えずに畑に戻った村の働き手（回4。modules/employment の back_to_fields）は、食べ物が買える
  # ようになっても、1ターンにこの割合ずつ仕事に戻る（蒔いた畑を収穫するまで。穀物は4〜6か月で実る）
  back_to_work: 0.2
  # 休業（回7 後半）: 電気・送電網・原料が足りずに動けなかった分の働き手に払う賃金の割合（労働基準法の休業
  # 手当は平均賃金の 6 割）。働き手は辞めずに残る
  furlough_pay: 0.6
  # 技術者（フェーズ2-3）
  engineer_wage_ratio: 2   # 施設の技術者の初めの賃金（一般の賃金に対する倍率）
  engineer_floor: 0.6      # 技術者がいなくても動ける稼働率（上限 = floor + (1 − floor) × 技術者の充足率）

market:
  # ふだんの付け値の幅: 自分の付け値の決め方を持たない買い手は前の値段のこの割合増しまで買い、値段を
  # 問わない売りはこの割合引きから売る。売り手の希望価格も1ターンにこの幅まで動く。市場の値段そのものに
  # 値幅はない（2026-10-20 セビーリャさんの決定「幅をなくす」）
  band: 0.10
  price_speed: 0.2      # 希望価格の動きやすさ k
  household_priority: 8 # 家計の買い注文の優先順位（値幅の端で止まって割り当てるとき）
  # 操業目標 = (売れ行きの見込み ＋ (見込み × inventory_turns − 在庫) × inventory_adjust) ÷ 全力の産出
  sales_smoothing: 0.5  # 売れ行きの見込みを、前のターンに売れた量へ近づける割合
  inventory_turns: 2    # 産出物の在庫の目安（売れ行きの見込みの何ターン分）
  inventory_adjust: 0.25 # 在庫と目安の差を、1ターンに埋める割合
  target_step: 0.1      # 売り切れたときに多めに見る量（全力の産出に対する割合）。発電所の余裕
  expand_margin: 0.2    # 売り切れて、値段が変動費よりこの割合以上高いときに増産する
  max_target_change: 0.2  # 操業目標を1ターンに変える幅の上限（全力に対する割合）
  public_stock_turns: 3 # 公務の施設（学校と大学）が持っておく投入財（教材）のターン数
  initial_prices:       # 初めの値段は定義のレシピから「原価＋上乗せ」で解く
    markup: 0.1         # 原価に上乗せする割合
    capital_rate: 0.05  # 設備の利子（年率）。減価償却は firms.depreciation_turns
    reference: {electricity: thermal_power_plant}  # この施設の原価で値段を決める財
    default: 1000       # 作る施設のない財の値段

freight:
  facility: transport   # 運送業の施設（島に1つ、マスを持たない）
  per_step: 0.01        # 売り手から買い手までの道のり1あたりの運賃の率（売り手と買い手が半分ずつ払う）
  max_rate: 0.2         # 1人が払う運賃の率の上限
  hub_level: city       # 拠点になる町の段階（首都のマスはいつも拠点）。取引の相手が足りない分は拠点まで運ぶ
  labor_share: 0.6      # 雇う人数 = 前のターンの運賃 × これ ÷ 賃金
  max_surcharge: 2.0    # 人手が足りないときの運賃の割り増しの上限（倍）
  # トラック（フェーズ3-2。hakoniwa_core/economy/trucks.py）。運送業は自動車を買ってトラックにし、
  # 運転手の代わりに使う。1台を1ターン使う費用（値段 ×（設備の利子 + wear）÷ 12 + 燃料）が
  # drivers 人の賃金より安ければ買う
  trucks:
    good: automobile
    drivers: 3          # トラック1台を、運転手何人分の働きとして数えるか
    fuel: {fuel: 0.005} # 1台が1ターンに使う燃料
    wear: 0.1           # 1年に傷んで使えなくなる割合
    max_share: 0.5      # 雇いたい運転手のうち、トラックで替えられる割合の上限
    catch_up: 0.1       # 欲しい台数に足りない分のうち、1ターンに買う割合
    fuel_turns: 3       # 持っておく燃料（持っているトラックの何ターン分）

# 貿易（フェーズ3-1）。量は財の重さ（goods.yaml の freight_weight。トン）で数えます。
trade:
  port_facility: port   # 港の施設
  shipping_facility: shipping  # 海運業の施設（島に1つ、マスを持たない）
  trader_facility: trading     # 商社の施設（オフィス街。島に複数）
  ship_good: transport_ship    # 輸送船の財（海運業が設備として持つ）
  ship_speed: 4         # 船が1ターンに進む世界マップの区画の数。片道のターン数 = 距離 ÷ これ（切り上げ、最低 1）
  ship_capacity: 40     # 輸送船1隻が1航海で運べる重さ（トン）
  ship_crew: 30         # 輸送船1隻の船員（航海に出ている船の数に合わせて雇う）
  idle_crew: 0.0        # 港につないでいる船を守る船員（船団の何隻分か。0 は船員を置かない）
  ship_fuel: {fuel: 0.025, coal: 0.05}  # 航海中の船1隻が1ターンに使う燃料（どれか1つ。安い方から使い、買う）
  ship_life: 300        # 船が使えるターン数（年 4% 傷む。過ぎたら解体する）
  ship_order_turns: 24  # 寿命までこのターン数になった船は、使っている分だけ前もって買い替える（回6。E31）
  fuel_turns: 6         # 海運業が持っておく燃料（船を全部出したときの何ターン分）
  start_ships: 2        # 建国と移し替えのときに海運業に持たせる輸送船
  start_fuel: {coal: 2} # 建国と移し替えのときに海運業に持たせる燃料
  port_capacity: 100    # 港で1ターンに積み下ろしできる重さ（トン。積む量と下ろす量の合計）
  port_labor: 2         # 港で荷 1 トンを扱うのに要る働き手（直近の扱った量の平均に合わせて雇う）
  cost_turns: 12        # 船の運賃と港の使用料を決める、費用と運んだ量を数えるターン数
  cost_markup: 0.1      # 運賃と使用料 = 費用 ÷ 運んだ量 ×（1 + これ）
  bloc_band: 0.10       # 貿易圏の市場の値幅
  trader_cut: 0.05      # 商社の取り分（値段の差のうち、これだけは残す）
  trader_capacity: 40   # 商社1社が1ターンに扱える重さ（トン。輸出と輸入の合計）
  trader_capital: 3000  # 商社を開くときに持ち主が出す資金（平均賃金の何倍か）
  target_speed: 0.2     # 狙う量を、売れた量と足りない量へ1ターンに近づける割合
  clearance_turns: 3    # 売れ残った荷を、この数のターンが過ぎたら指値を外して売る
  entry_threshold: 0.8  # 島の商社の扱った重さが、12 ターン平均で上限のこの割合を超えたら、民営の商社が開く
  entry_turns: 12       # 民営の商社の開業を見るターン数。商社がなくなった島は、このターン数の後に開き直す
  contract_cancel_turns: 3  # 二国間契約をやめる命令から、やめるまでのターン数
  history_turns: 60     # 貿易圏の値段の記録を残すターン数

# 為替（フェーズ3-1。変動相場）
fx:
  band: 0.02            # 1ターンに動ける幅（財の市場より狭い。設計の案の 5% では、1島に商社が1つで
                        # 売りと買いがそろわないうちに年に倍ほど振れたので狭くした）
  keep_turns: 2         # 商社が持っておく決済通貨（次のこのターン数分の輸入の代金）
  depth_turns: 12       # 市場の厚み（片側だけの注文で動く割合を決める）を数えるターン数
  min_depth: 1000       # 市場の厚みの下限（平均賃金の何倍か）
  peg_band: 0.01        # 固定相場（フェーズ3-3）: 中央銀行が決めたレートのこの幅の端で、限りなく売り買いする
  reserve_share: 0.25   # 受け身の注文で中央銀行が持つ外国の資産の上限（年の GDP に対する割合。フェーズ3-3）
  # 中央銀行どうしの融通（3-3 の続き。hakoniwa_core/trade/swap.py）
  swap_quota: 0.1       # 借りられる額の合計の上限（借りる国の年の GDP に対する割合）
  swap_issuer_share: 0.1  # 通貨を発行した国の中央銀行が新しく作って貸す額の合計の上限（その国の年の GDP に対する割合）
  swap_keep_turns: 3    # 貸し手の中央銀行が手元に置く分（自分の板の市場の厚みのターン数）
  swap_spread: 0.01     # 融通の金利 = 通貨を発行した国の政策金利 + これ（年率）

# 海外の商人（フェーズ3-1）。島の市場で、決まった値段と1ターンの上限で売る（買わない）。港も船も
# 為替も要らない。代金は島の外に出て消える（仕訳の種類 merchant）。
foreign_merchant:
  enabled: true
  turns: 120            # 建国（前のフェーズの島は移し替え）からこのターン数だけ来る
  multiplier: 1.5       # 値段 = 初めの値段（原価 + 1 割）× これ
  last_turns: 24        # 最後のこのターン数で、値段の倍率を last_multiplier まで上げていく
  last_multiplier: 3.0
  goods: [coal, iron_ore, steel, machinery, building_materials, crude_oil, fuel]  # 1ターンの上限は、その財を作る標準の施設1つの全力の産出

household:
  layers:               # 家計の層。share を書いた層は住民のその割合で、働かない（資産を持つ層）
    general: {c1: 0.9}
    owners: {c1: 0.6, share: 0.01}
    engineers: {c1: 0.85, workers: engineer}   # 技術者とその家族（workers.yaml の engineer。フェーズ2-3）
    # 失業している一般の労働者とその家族（回3）。所得・預金・食べた量を仕事のある家計と別に持ち、
    # 失業手当を受け取る。所得の少ない家計ほど所得のほとんどを使う
    jobless: {c1: 0.95, jobless: true}
  c2: 0.01              # 使う額 C = c1 × 直近の可処分所得の平均 + c2 × 預金
  income_turns: 3       # 可処分所得を平均するターン数
  c1_rate_effect: 0.02  # 預金の実質金利が1%高いごとに c1 を下げる量
  c1_range: 0.1         # c1 を既定の値から動かす幅の上限
  consumer_goods_share: 1.0     # 必需品（電気代・食費・衣料）の残りのうち、ぜいたく品と自動車に使う割合
  food_elasticity: 4    # 食料の割り振りで、値段の差をどれだけ効かせるか（質を足した栄養あたりの値段の比の乗数）
  # 飢えている家計（回3。前のターンに食べた割合が threshold より少なかったか、飢えの蓄えが残って
  # いる）は、使う額に預金の savings を足した額を食費の限りにし、ほかの層の分にも手を伸ばして、
  # 要る量の累積の割合 steps の段ごとに、飢える前の値段の「割合 ^ (−1/elasticity)」倍まで買い上がる
  # （食費の限りでその段まで買える値段まで）。食料の需要の値段への反応（現実の目安は −0.3〜−0.5）で、
  # 品不足が2〜3割なら値段は2〜3倍、半分なら5倍ほどになり、お金のない家計から買えなくなる
  hungry: {threshold: 0.99, savings: 0.1, steps: [0.5, 0.7, 0.85, 1.0], elasticity: 0.4}
  # 必需品（食べ物・電力・衣料。goods.yaml の need）に使う額の上限（使う額に対する割合。フェーズ3-2）。
  # 実質の使う額（1人あたり、物価指数で割る）が base_income のとき share で、倍になるごとに fall の割合
  # だけ下がる（下限 floor）。安い食料の費用との差の分だけ、この上限まで質の高い食料に替える
  necessity: {share: 0.4, fall: 0.1, floor: 0.3}
  base_income: 250      # 1人1ターンの実質の使う額の基準（建国のときの一般の層くらい）
  # 消費財の注文の指値（いつもの値段に対する倍率）。高い段から「その値段で使い切る量」まで足していく
  consumer_goods_tiers: [0.95, 1.0, 1.05]
  # 今の値段がいつもの値段の一番下の段より安いときに足す段（今の値段に対する倍率。値下がりした分だけ多く買う）
  consumer_goods_low_tiers: [0.9, 0.95, 1.0]
  usual_price_turns: 12 # いつもの値段 = 直近このターン数の値段の平均
  # 売りに出ていたのに家計が1つも買わなかったターンがこの数続いた財は、いつもの値段をその間の売りの一番安い
  # 指値との半ばまで上げる（値上がりに少しずつ慣れる。回7 後半。W-77。economy/prices.py の adapt_usual）
  reprice_turns: 3
  # 1人1ターンあたりの目安（幸福度。フェーズ3-2）。衣料はこの量を必需品として買う
  targets: {clothing: 0.00004, consumer_goods: 0.0005, luxury_crop: 0.0002, services: 0.05}
  # サービス（商店・飲食・理美容・娯楽・修理など。hakoniwa_core/economy/services.py）に使う割合。必需品
  # （食料・衣料）を買った残りのうち、実質の使う額が base_income のとき share、倍になるごとに rise ずつ
  # 増え、半分になるごとに減る（floor〜max）。所得が上がるほどサービスに多く使う（バランス調整）
  services: {share: 0.4, rise: 0.05, floor: 0.25, max: 0.6}
  # ぜいたく品の予算を、売りに出ている物の間で割り振る重み（書かない物は 1）。売りに出ていない物は
  # 買いたい量だけ記録する（作る施設や商社が動く合図になる）
  luxury_weights: {consumer_goods: 3, luxury_crop: 1}
  cars:                 # 自動車（耐久消費財。フェーズ3-2）
    good: automobile
    fuel: {fuel: 0.001} # 1台が1ターンに使う燃料
    wear: 0.1           # 1年に傷んで使えなくなる割合
    catch_up: 0.1       # 欲しい台数に足りない分のうち、1ターンに買う割合
    share: 0.5          # ぜいたく品の予算のうち、自動車に使う上限
    # 層ごとの欲しい台数（1人あたり）。実質の使う額が base_income の from 倍から full 倍のあいだで、
    # 0 から per_person まで増える
    layers:
      owners: {per_person: 0.5, from: 0, full: 1}
      engineers: {per_person: 0.2, from: 0.5, full: 2}
      general: {per_person: 0.2, from: 1.5, full: 3}
  housing_share: 0.02   # 町の資材に使う預金の割合の上限
  # 家計の支え合い（回7。家族・親せき・村の助け合い）: 失業している家計が食べ物を買いきれないとき、
  # 一般の層と技術者の層が、このターンの可処分所得のこの割合までを上限に、足りない分を送る（賃金の段）
  support: {share: 0.1}

# 商業・サービス業（バランス調整。hakoniwa_core/economy/services.py）。島に1つ、マスを持たない施設で、
# 住民がサービスを買いに行く集落（通勤圏でいちばん人の多い集落）ごとに、そこで人を雇って出す
services:
  facility: services    # 商業・サービス業の施設
  good: services        # サービス（持ち越せず、島の外へ運べない）
  per_worker: 1         # 働く人1人が1ターンに出すサービスの量
  labor_share: 0.9      # 雇う人数の目安 = 直近の売上 × これ ÷ 賃金（残りは店の利益）

# 小売り（回7。hakoniwa_core/economy/retail.py）。家計は品物（電力と町の資材を除く）を買うと、代金を物価指数で
# 割った額 value_per_unit ごとに小売り1人月を商店・百貨店から買う（現実の小売りの粗利は売上の2〜3割、店員1人が
# 月に売る額は賃金の6〜8倍ほど）。店で買いきれない分は、商業・サービス業（小さな店と屋台）から、小売りの値段の
# (1 + direct_premium) 倍で買う（直売・屋台）
retail:
  good: retail
  value_per_unit: 5000
  direct_premium: 0.5
  persons_per_car: 3      # 自動車1台で百貨店に行ける人数（家族）
  permit_turns: 12        # 許可制の国で、百貨店の出店の申請を待つターン数

equipment:
  # 設備の傷みと直し（バランス調整の回6。hakoniwa_core/economy/equipment.py）。物を作る施設は建てたときの資材を
  # 設備として持ち、資材ごとに年にこの割合が傷む（現実の工業国の目安: 機械は年 7〜10%、建物は年 2〜3%）
  wear: {machinery: 0.08, steel: 0.03, building_materials: 0.025, wood: 0.04}
  default_wear: 0.03    # wear に書いていない資材
  scrap: 0.3            # 民営の施設は、直す採算が合わないまま設備の割合がこれを切ったら閉じる
  notice: 0.7           # 国営の施設の設備の割合がこれを切ったら知らせる
  state_priority: 6     # 国が直す資材の買い注文の優先順位（インフラの維持の後、新しい工事の前）

firms:
  operating_turns: 2    # 独立採算の施設に、出資で初めに持たせる手元の資金（支払いのターン数分）
  depreciation_turns: 240  # 設備の減価償却のターン数（20年）
  payout: 0.5           # 税引き後の利益のうち、配当（民営）・国庫への納付（国営）に回す割合
  cash_turns: 6         # 手元の資金がこのターン数分の支払いを超えたら、超えた分も配当・納付に回す
  # 企業（回7。modules/companies）: 施設を建ても買いもせず idle_cash_years 年たち、手元が施設の支払いの
  # firm_cash_turns ターン分を超えた企業は、超えた分も配当する。連結の現金収支が restructure_turns ターン
  # 続けてマイナスで、預金が施設の次の支払いに足りなければ、変動費の利益が一番低い施設を閉める
  idle_cash_years: 3
  firm_cash_turns: 24
  restructure_turns: 12
  # 企業の中のお金の融通（回7 後半）: 施設が足りないとき、企業の預金のあとは、同じ企業のほかの施設の手元の
  # うち次の支払いのこのターン数分（と返済の見込み）を超えた分から回す
  pool_floor_turns: 1
  loss_carry_turns: 60  # 赤字を繰り越せるターン数
  # 民営工場の参入（フェーズ2-2）。見込みの年の利益率 R（式 entry_return）が「借りる金利 + entry_margin」を
  # 超え、その財が直近 price_turns ターンのうち shortage_turns ターン以上品切れか、値段が原価の
  # cost_ratio 倍を超えていて、空いた工業団地のマスがあれば建つ。同じ財の民営工場が建設中か、
  # 建ってから price_turns ターンたっていなければ待つ
  entry_margin: 0.03    # 体制の特色 entry_margin があればそちら（市場経済は 0.01。regimes.yaml）
  entries_per_turn: 1   # 1つの島で1ターンに建つ数
  # 工業団地のほかに、指定のない人の住んでいないマスにも建つ施設（回6。開墾は国の用途の指定を待たない）
  open_land: [farm, fishing_port]
  equity_share: 0.3     # 建設費のうち資産を持つ層が出資する割合（残りは建設資金の融資）
  price_turns: 6        # 参入の計算で値段を平均するターン数
  shortage_turns: 3
  entry_gap: 0.5        # 品切れと見る足りない量（新しい工場の全力の産出に対する割合）
  cost_ratio: 1.2
  # 撤退と倒産
  # 作り方の見直し（フェーズ3-2）。作り方が複数ある民営の施設は、このターン数ごとに変動費の利益が一番大きい
  # 作り方を選び、今より recipe_margin の割合以上大きければ替える（替えた次のターンは稼働率が半分）
  recipe_turns: 12
  recipe_margin: 0.1
  exit_idle_turns: 12   # 動かない（稼働率0）ままこのターン数続いたら閉鎖する
  exit_loss_turns: 12   # 変動費の利益がこのターン数続けてマイナスなら閉鎖する
  exit_loss_margin: 0.01  # マイナスと見るのは、全力の売上のこの割合を超える損のとき（端数で閉鎖しない）
  abandon_turns: 12     # 民営の工事が資材を買えずに進まないままこのターン数続いたら、工事をやめる
  foreclosure_turns: 12 # 倒産して差し押さえた施設を売りに出すターン数（売れなければ取り壊す）
  foreclosure_price: 0.5  # 差し押さえた施設の売り値（帳簿の設備の値打ちに対する割合）
  loss_notice_turns: 6  # 国営の独立採算の施設が、このターン数続けて赤字ならプレイヤーに知らせる
  ebitda_turns: 6       # 融資の審査で見る「利払い前の利益 ＋ 減価償却」を平均するターン数

banking:
  facility: bank        # 市中銀行の施設
  office_tiles: 2       # 建国のときに首都の近くでオフィス街に指定するマスの数
  capital_ratio: 0.1    # 建国のときの銀行の自己資本（預金に対する割合）。債務超過の銀行の立て直しもこの割合まで
  bond_ratio: 0.2       # 建国のときに銀行が持つ国債（預金に対する割合）
  # 国債への偏りの上乗せ: 国債の額面 ÷ 資産が free を超えた分 × premium だけ、銀行は高い利回りを求める
  # （1つの借り手に偏る危うさ。計画経済の国営銀行は上乗せしない。回5）
  bond_concentration: {free: 0.25, premium: 0.04}
  # 国債の入札では、準備預金を最低限 + 預金 × これだけ手元に残す（決算の支払いと預金の出入りの分。
  # 足りなくなれば国債を売る。国債は流動性に数えるので、liquidity_target より小さくてよい）
  liquidity_share: 0.02
  auction_steps: 4      # 国債の入札の注文を分ける段の数（段ごとに、その段まで買ったときの偏りで求める利回り）
  reserve_ratio: 0.02   # 最低限の準備預金（預金に対する割合）
  deposit_rate: 0.01    # 初めの預金金利
  deposit_spread: 0.02  # 預金金利の目安 = 政策金利 − これ（準備預金が足りない銀行はさらに上げる）
  liquidity_target: 0.05  # 準備預金の余りと国債の額面がこの割合（預金に対する）を下回る銀行は、預金金利を上げる
  rate_step: 0.001      # 預金金利と利ざやを1ターンに動かす幅
  regulatory_ratio: 0.08  # 自己資本比率（自己資本 ÷ 融資）の規制。下回ると新しく貸さない
  large_exposure: 0.25  # 大口融資の規制: 1つの民営施設への融資の残高は、銀行の自己資本 × これまで
  margin: 0.02          # 初めの利ざや m（融資の金利 = 政策金利 + m + ρ × 借入 ÷ 資産）
  margin_range: [0.005, 0.06]
  rho: 0.04             # ρ
  risk_buffer: 0.05     # 自己資本比率が「規制 + これ」を下回ると、預金者は危なさを見て割り引く
  risk_weight: 0.25     # その割り引きの係数（自己資本比率が1%低いごとに預金金利を 0.25% 低く見る）
  capital_floor: 0.03   # 自己資本の目安の下限（預金に対する割合）。配当は目安を超える分から払い、救済も目安まで入れる
  switch_share: 0.05    # 家計が1ターンに乗り換える預金の割合の上限
  run_share: 0.2        # 取り付け: 規制を下回った銀行と中央銀行に頼る銀行から、1ターンに流れ出す割合
  max_banks: 5          # 島の銀行の数の上限
  staff_volume: 30000   # 預金と融資の合計が平均賃金のこの倍に届く銀行は、定義の人数の職員を雇う。小さい銀行はその割合
  staff_floor: 0.1      # 小さい銀行の職員の下限（定義の人数に対する割合）
  # 経費の切り詰め（回7 後半）: 直近1年の利益がマイナスの銀行は職員の下限を外す。利益がプラスのまま
  # このターン数続いたら戻す
  lean_turns: 24
  entry_capital: 0.02   # 民間銀行の資本（島の預金に対する割合。資産を持つ層が出資する）
  entry_deposits: 2000000 # 参入した後の銀行1つあたりの島の預金がこれを超え、利益の見込みが立てば民間銀行が入る
  entry_roe_margin: 0.02  # 今ある銀行の自己資本利益率の平均が「政策金利 + これ」を超えたら
  liquidation_price: 0.7  # 清算で融資を売る値段（額面に対する割合）
  deposit_insurance: 30000  # 預金保護の上限額の既定（1人あたり、施設は1つあたり）
  sell_premium: 0.005   # 国債を売るときに受け入れる利回りの上乗せ（求める利回りより高くても売る幅）
  default_crunch_turns: 36  # 国債の債務不履行で損をした銀行は、このターン数のあいだ新しく貸さない
                            # （返す元金の借り換えだけ。計画経済の島は除く）
  # 外国の国債（フェーズ3-3。資本取引が自由な島の市中銀行。hakoniwa_core/trade/abroad.py）
  foreign_share: 0.1    # 外国の資産（外貨と外国の国債）の上限（預金に対する割合）
  foreign_step: 0.01    # 1ターンに外貨を買い足す上限（預金に対する割合。準備預金の余りの半分まで）
  foreign_margin: 0.01  # 外国の利回り − 値下がりの率が、自国の利回りよりこれ以上高い通貨だけ買う

loans:
  working_turns: 6      # 運転資金を返す期間
  construction_turns: 120  # 建設資金を返す期間（据え置きの後から）
  grace_turns: 6        # 建設資金の元金の据え置き（工事が済んでからこのターン数は利子だけ払う）。
                        # この間の運転資金の審査は、全力で動いたときの見込みの利益で見る
  coverage: 1.2         # 審査: 利払い前の利益 ＋ 減価償却 ≧ 毎ターンの返済（利子 + 元金）× これ
  max_leverage: 0.8     # 審査: 借入の合計 ≦ 資産（設備の値打ち + 預金 + 在庫）× これ
  inventory_ratio: 0.5  # 審査: 利益で返せなくても、運転資金の残高が在庫の値打ち × これ以内なら貸す
  arrears_limit: 3      # 返済がこのターン数続けて遅れたら倒産

central_bank:
  policy_rate: 0.03     # 初めの政策金利
  # 準備預金の余りに付ける利子は、政策金利からこれを引いた率（銀行間の金利の下端）
  reserve_spread: 0.01
  corridor: 0.01        # 銀行間の金利の幅（政策金利 ± これ。上端は中央銀行から借りる金利）
  inflation_target: 0.02  # 物価の目標 π*
  # 独立した中央銀行の政策金利: r* + π + a (π − π*) − b (u − u*)。1ターンに max_step まで、range の中
  natural_rate: 0.01
  inflation_weight: 0.5
  unemployment_weight: 0.5
  max_step: 0.0025
  rate_range: [0.0, 0.2]
  switch_lock_turns: 12 # 独立させる・戻す命令の後、このターン数は戻せない
  collateral_ratio: 0.9 # 担保（国債の時価と延滞のない融資）の値打ちのうち、貸し出しに使える割合

bonds:
  auto_terms: {bond_1y: 1.0}  # 自動の発行の期間（finance.yaml の bond_term）と割合
  # 返す力の比（中央銀行以外の持ち手に払う利子 ÷ 国債と中央銀行からのお金を除く国の収入。年）がこれを
  # 超えた分に、利回りを上乗せする（回5。中央銀行の持ち分は市場の外）
  burden_threshold: 0.25
  burden_sigma: 0.1     # その上乗せの係数 σ（σ × 市場の持つ借金 ÷ 収入 が 1 を超えると利払いが雪だるまになる）
  kappa: 0.5            # 物価上昇率が目標を超えた分の上乗せの係数 κ
  max_yield: 0.2        # 利回りの上限
  buffer_turns: 1       # 国庫に残す額（支出のターン数分）
  default_premium: 0.15 # 債務不履行の上乗せ δ（不履行の直後。default_decay_turns ターンかけて 0 に減る）
  default_decay_turns: 120
  default_exclusion_turns: 36  # 債務不履行からこのターン数は、銀行が国債を買わない（入札で売れず、
                               # 売れ残りは政策どおり中央銀行が引き受けるか支出を減らす）
  haircut: 0.5          # 不履行になった銘柄の額面を切り下げる割合
  independence_discount: 0.005  # 中央銀行が独立しているときの利回りの割り引き β
  buckets: [12, 36, 84] # 国債の売買の区分（残りのターン数の境目: 1年未満・1〜3年・3〜7年・7年以上）
  bucket_terms: [6, 24, 60, 120]  # 区分の利回りを代表する残りのターン数（区分の間は直線でつなぐ）
  trade_band: 0.01      # 国債の売買の値幅（前のターンの利回り ± これ）

fiscal:
  income_tax: 0.1       # 所得税（賃金から差し引く）
  corporate_tax: 0.2    # 法人税（施設と銀行の利益）
  consumption_tax: 0.05 # 消費税（家計の食料・消費財・電気の買い物）
  minimum_wage: 0       # 最低賃金（0 は決めない）
  # 失業手当（失業者1人に平均賃金の何割）の建国のときの値。多くの国と同じく初めから払い、建国直後に
  # 買い手が減って経済が縮むのを和らげる（バランス調整。命令 set_labor_policy で変えられる）
  unemployment_benefit: 0.4
  # 国庫が足りないときの支払いの順番（前の項目から取り置く）
  # arrears は前のターンまでの未払い賃金（回3。お金が入れば先に払う）
  # 支払いの順番。[ ] の組の中は、国庫が足りなければ見積もりに同じ割合を掛けて取り置く（今月の人件費と
  # 運営費。回5）。昔の未払い賃金（arrears）は失業手当の後に残ったお金で払う
  payment_order: [bonds, [civil_servants, state_facilities, education, security, defense_personnel], unemployment, arrears, construction, defense_procurement, subsidies, warehouse]
  # 銀行の救済と預金保護（支出の項目の外）は、この項目の入った組までの次のターンの支払いを国庫に残した額から出す
  rescue_after: civil_servants
  # 年の予算を命令で決める項目（毎ターン予算の12分の1まで使う）。construction は公共事業費
  # （国の工事とインフラの工事・維持の資材と作業員の賃金）、education は教育費（学校と大学の教員の
  # 賃金と教材。建国のときの額は education.start_budget_years）、subsidies は補助金、security は治安費
  # （警察官の賃金。フェーズ3-4）
  budget_items: [construction, education, security, subsidies, warehouse, defense_personnel, defense_procurement]
  budget: {construction: 600, security: 0, subsidies: 0, warehouse: 0, defense_personnel: 0, defense_procurement: 0}  # 建国のときの年の予算（住民1人あたり）
  reserve_margin: 0.2   # 取り置きの見積もりを、前のターンの支出よりこの割合だけ多めにする

infrastructure:
  # インフラと教育の係数 f = 1 + w ×（low + (high − low) × L − 1）の low と high（L が 0 のときと
  # 1 のときの、w が 1 の施設の係数）。w はレシピの factors
  factor: [0.7, 1.2]
  pollution_floor: 0.5  # 汚染の係数の下限（農場と漁港。汚染1あたり factors の pollution だけ下げる）
  upkeep_priority: 7    # 維持の資材の買い注文の優先順位（値幅の端で止まって割り当てるとき）
  build_priority: 4     # 新しい工事の資材の買い注文の優先順位
  # 建国と移し替えのときに、施設のマスとその周りの陸のマスと町のマスに引く道路の整備度
  start_road: 0.6
  start_water: 0.8      # 移し替えのときに、都市と大都市のマスに引く上下水道の整備度

education:
  start: 0.6            # 建国と移し替えのときの教育水準（インフラと教育の係数が 1 になる値）
  children: 0.15        # 住民のうち子どもの割合（学校の定員と比べる）
  # 教育水準は働き手のうち学んだ人の割合（回3）。子どもたちの学んだ割合は通う年数 school_years で、
  # 働き手は働く年数 working_years で入れ替わる（上がるのも下がるのも同じ速さ。カードで決定）
  school_years: 9
  working_years: 40
  start_school: school  # 建国と移し替えのときに首都の近くに建てた状態で置く学校
  start_budget_years: 1.2   # 建国と移し替えのときの教育費の年の予算（学校1つを動かす費用の何年分）
  engineer_share: 0.02  # 建国と移し替えのときの技術者の数（一般の労働者に対する割合）
  retire_rate: 0.005    # 技術者が1ターンに引退して一般の層に戻る割合
  intake_unemployment: 0.3  # 技術者の失業率がこれに近づくほど大学に入る人が減る（この値以上で 0）

power:
  good: electricity     # 電力の財
  household_use: 0.0005 # 住民1人あたりの電力
  household_priority: 4 # 家庭への送電の優先順位（施設の優先順位と比べる）
  household_share: 0.3  # 家計が電気代に使う額の上限（使う額に対する割合）。これを超える電気料金では買わない

population:
  food_per_person: 0.002 # 1人1ターンあたりの食料
  # 生まれる人と亡くなる人（バランス調整の回4。現実の人口転換。1年あたりの割合で、1ターンはその 12 分の 1）。
  # 生まれる割合（粗出生率）= low + (high − low) × (1 − E)^education × y^(−income)。E は教育水準（働き手の
  # うち学んだ人の割合）、y は層の実質の可処分所得の household.base_income に対する倍率（income_floor 以上）。
  # 値の目安: 学校に通えた人が3割台の最も貧しい国で年 4〜5%（ニジェール）、6割ほどで 3% 前後（1970年代の
  # ブラジル・インド）、9割を超える中所得の国で 1.5〜2%、豊かな国で 1% ほど（日本・欧州）
  births: {high: 0.045, low: 0.008, education: 0.5, income: 0.3, income_floor: 0.25}
  # 亡くなる割合（粗死亡率。飢えで亡くなる人は別）= base + food ×（1 − 食事の質）+ water ×（1 − 上下水道の
  # 整備度）× 混み具合。混み具合はマスの人数 ÷ crowd（1 まで）で、人が密に住むほど汚れた水から病気が広がる
  # （19世紀の「都市の墓場」。村は井戸と川で、町ほどは死なない）。目安: 上下水道がなく穀物ばかりの暮らしの
  # 農村で年 1.8〜2% ほど、同じ暮らしの大きな町で 3% ほど（1840年代のイングランドの農村とリバプール・
  # マンチェスター）、水道と下水が行き渡り食事に肉や魚があると 1% を切る（若い人の多い今の中所得の国）。
  # 年齢の層は持たない（Codex E04 は後回し）
  deaths: {base: 0.007, food: 0.012, water: 0.016, crowd: 8000}
  # 飢えの蓄え（回3）: 家計の層ごとに、栄養の不足が何か月分たまったか S を持つ。毎ターン
  # S ← S + 足りなかった割合 − tolerance − recovery × S（0 未満は 0）。体の余力（何か月分の不足に
  # 耐えられるか）は人によって違い、平均 reserve・ばらつき reserve_spread の正規分布に従う（いちばん
  # 弱い人でも reserve_min はある）。S が自分の余力を超えた人が亡くなるので、弱った人から先に、何か月
  # かに分かれて亡くなる。現実の目安（設計書の回3）: オランダの飢餓の冬（必要の半分ほどが半年）で
  # 半年に 0.5% ほど、レニングラードの最悪の冬（必要の3割前後）で4〜5か月目に1か月 3〜8%、何も
  # 食べられなければ3か月目から多く亡くなり、4か月で3分の2ほど（ハンガーストライキで亡くなるのは
  # 45〜75 日ほど）。町の人は、蓄えが flee（何か月分の不足）を超えると、空きのある村へ移り始める
  # （回4。現実の飢饉でも、家の蓄えと持ち物を食べ尽くしてから村へ逃れる。いちばん弱い人が亡くなり
  # 始める reserve_min より前。1か月足りないだけでは移らない）
  # 村へ逃れた人は、町で食べ物が買えるようになり、町に人手の足りない仕事があれば、1ターンに
  # return_share の割合ずつ町へ戻る（回7。W-21。1割なら2年ほどでほとんど戻る）
  hunger: {tolerance: 0.1, recovery: 0.2, reserve: 2.5, reserve_spread: 0.4, reserve_min: 1.3,
           flee: 0.5, return_share: 0.1}
  migration_rate: 0.1   # 仕事のない人のうち、1ターンに働き口の近くへ移る割合
  # 幸福度 = base + 各項目（足りている割合 × 重み） − 汚染 × pollution_per_point − 実質賃金と物価の減点
  # 上下水道はそのマスの整備度、教育は島の教育水準（フェーズ2-3）
  happiness:
    base: 15
    food: 25
    jobs: 15
    power: 10
    food_quality: 10
    clothing: 5          # 衣料（フェーズ3-2）
    luxury: 10           # ぜいたく品（種類が多いほど満足が上がる。フェーズ3-2）
    water: 5
    education: 5
    pollution_per_point: 1
    real_wage_per_point: 1   # 実質賃金が1年前より1%下がるごとの減点
    real_wage_max: 15
    inflation_threshold: 0.05  # 物価上昇率（年率）がこれを超えた1%ごとに減点
    inflation_per_point: 1
    inflation_max: 15
    hunger: 10           # 飢えの蓄え1か月分ごとの減点（回3。食べられるようになっても体が戻るまで残る）
    hunger_max: 30
    arrears: 20          # 賃金が払われなかった働き手の割合 1 あたりの減点（回3。賃金の遅配）
    crowding: 15         # 過密の度合い 1（住める上限の倍が住む）あたりの減点（回5。詰め込み住まい）
    crowding_max: 30
  # 前のフェーズの世界を移し替えた島は、幸福度の重みを blend_turns ターンかけて、その時の重みから移す
  # （フェーズ1の島は happiness_phase1、フェーズ2-2 までの島は happiness_phase2、フェーズ3-1 までの島は
  # happiness_phase3_1 から）。consumer_goods は 3-1 までの消費財（目安は household.targets）
  happiness_phase1: {base: 20, food: 30, jobs: 20, power: 10, food_quality: 20, consumer_goods: 0, water: 0, education: 0}
  happiness_phase2: {base: 25, food: 25, jobs: 15, power: 10, food_quality: 10, consumer_goods: 15, water: 0, education: 0}
  happiness_phase3_1: {base: 15, food: 25, jobs: 15, power: 10, food_quality: 10, consumer_goods: 15, water: 5, education: 5}
  blend_turns: 12
  # 過密（回5、10-19 のカード「分家と開拓」）: 住む所の上限を超えた人は、消えずにそのマスに詰めて住む。
  # 過密の度合い c = 人数 ÷ 住める上限 − 1（上限の倍で 1。頭打ちにしない）。亡くなる割合（1年）に deaths × c を
  # 足し、生まれる割合を max(0, 1 − births × c) 倍にする（詰めるほど強く効き、どこかで釣り合う）。目安: 19世紀の町の裏長屋の死亡率は同じ国の農村の 1.5 倍ほど（年 2% → 3%）、
  # 土地の足りない農村は結婚が遅れて生まれる数が減った（マルサスの予防的な抑制。18世紀の日本や西欧の農村）
  overcrowding: {deaths: 0.01, births: 0.3}

housing:
  facility: housing     # 自動で建つ町の施設（育つのに要る資源は settlements.yaml の materials）
  max_new_per_turn: 2   # 1ターンに新しくできる町の数
  max_upgrades_per_turn: 2  # 1ターンに上の段階へ育つ町の数
  fill_ratio: 0.8       # 町が上の段階へ育つのは、住む人が上限のこの割合を超えてから
  # 分家と開拓（回5、10-19 のカード）: 島の上限を超えて住む人が島の空きより多ければ、いちばん過密なマスから
  # これだけのマスの内の空いた平地に、家計が木材を使って村を開く（江戸の新田開発・分家。施設の通勤圏でなくてよい）
  settle_radius: 3

# 国をまたぐ移民（バランス調整の回3。hakoniwa_core/modules/migration）。暮らしの見込み V =
# 実質賃金 × 仕事の見つかる割合 × 食べられた割合 が、行き先で ln(V行き先 ÷ V今) − cost −
# distance_cost × 距離 だけ良ければ、受け入れてくれる行き先のうちいちばん良い差 ×
#（1 + ties × 同郷の人の割合）× 組の人数 × response が1ターンに移りたいと思い、行き先には差の比で分かれる。
# 値は、東欧から西欧への移民（2004年からの数年、賃金が3倍ほどの差で1年に住民の 1% 前後）、
# 飢饉の国から逃げる人（1年に数%）の幅に入るように置いた
migration:
  response: 0.001       # 差 1 あたり、1ターンに移りたい人の割合
  cost: 0.3             # 移る費用（対数の差で。旅費・言葉・知り合いのいない不安）
  distance_cost: 0.02   # 世界マップの区画 1 つあたりに足す費用
  floor: 0.05           # 今の島の見込みは行き先のこの倍を下回らない（飢えても差は対数で約 3 まで）
  ties: 10              # 行き先に住む同郷の人（元の島の住民に対する割合）1 あたり、移りたい人が増える倍率
  ties_decay: 0.03      # 同郷の人のつながりが1年で薄れる割合（土地になじむ・世代が替わる）
  remittance: 0.15      # 移った人のうち働いている人が、賃金のうち元の島へ送る割合
  default_cap: 100      # 受け入れの1年の上限の既定（住民の1万分の1。100 は 1%）
  border: 0.95          # 警察の人手が足りているとき、出国を止めた人のうち国境で止められる割合
  trapped: 2            # 出たいのに出られない人（1年に住民の 1% あたり）が政情の目標から引く分
  trapped_max: 20

naming:
  place_block: 8        # 地名は島をこのマス数四方の区画に分けて付ける
  place_style: japanese # 地名の作風の既定（建国のときに選べる。naming.yaml の places）

disasters:
  rate: 0.02            # 1つの島に1ターンで災害が起きる確率（0 で起きない）
  kinds:                # 災害の種類と、施設が止まるターン数の幅
    earthquake: {halt_turns: [2, 4]}
    typhoon: {halt_turns: [1, 2]}
    flood: {halt_turns: [1, 3]}
    fire: {halt_turns: [1, 3]}

records:
  history_turns: 24     # 値段・物価指数・平均賃金の履歴を状態に残すターン数
  cpi_weight_turns: 12  # 物価指数の重み（家計が買った量）を数えるターン数
  journal_turns: 24     # 仕訳を残すターン数
  trades_turns: 24      # 約定を残すターン数
  books_turns: 2400     # 施設の帳簿を残すターン数（200年）
  # 品不足の知らせ（産業の鎖の画面。フェーズ3-2）: 市場で買いたい量の share 以上が買えないターンが
  # turns ターン続いたら、ターンログで知らせる
  shortage: {share: 0.1, turns: 3}

backups:
  keep: 24              # 残すバックアップの数

accounts:
  signups_per_ip: 1     # 同じ IP から登録できるアカウントの数（0 で制限しない）
  remember_days: 30     # 照合用に IP のハッシュを残す日数

locale: ja              # 表示名を必ずそろえる言語
theme: default          # 絵のテーマ（server/static/themes/<名前>/）

# 政治（フェーズ3-4。hakoniwa_core/politics.py と hakoniwa_core/modules/politics）
politics:
  # 政情の目標 T* = base + happiness ×（H − happiness_mid）− unemployment ×（U − unemployment_free）+
  # − inflation ×（π − inflation_free）+ − inequality ×（G − inequality_free）+ + R + E（式 stability）。
  # H は幸福度、U は失業率（%）、π は年の物価上昇率（%）、G は家計の層の所得の格差（ジニ係数）
  # 失業率の重みは設計の値（5% を超えた分 × 1.5）。フェーズ3-4 では失業率が2割台で、国の半分近くが
  # デモ以上になるため弱めてあった（1.0・15%）。回4 でサービスの仕事が入って失業が下がったので戻した
  weights: {base: 50, happiness: 0.6, happiness_mid: 50, unemployment: 1.5, unemployment_free: 5,
            inflation: 1.0, inflation_free: 5, inequality: 60, inequality_free: 0.35}
  levels: {demo: 40, riot: 25, rebellion: 10}   # この値を下回るとデモ・暴動・反乱の前触れ
  stability_turns: 6    # 政情が目標に近づく速さ（差の 1/これ ずつ）の既定。体制の特色で変わる
  # 出来事の補正 E: 債務不履行（default から default_turns ターンかけて 0 に戻る）、体制を変えた後の
  # 混乱期間（transition）、首都の政府の建物が暴動で壊れている間（office）
  events: {default: -15, default_turns: 36, transition: -10, office: -10}
  # 報道と集会の統制: 政情の目標に足す分。統制している間、その分 × grievance_rate ずつ不満を積み
  # （grievance_max まで）、ゆるめるか政情が levels.riot を切ったら、まとめて政情から引く
  press: {bonus: {free: 0, limited: 5, controlled: 10}, grievance_rate: 0.1, grievance_max: 30}
  # 支持率 = 政情 + wage × 実質賃金の1年の伸び（%）− unemployment × 失業率の1年の伸び（ポイント）
  support: {wage: 1.0, unemployment: 1.0}
  election_turns: 48    # 選挙の間隔（民主主義）
  # 議会の採決: 賛成 = 与党の議席 +（今の支持率 − 選挙のときの支持率）÷ 100 × swing。majority は
  # これを超えたら、two_thirds はこれ以上で通る。税率は tax_points ポイントより大きく変えるときだけ採決する
  parliament: {swing: 0.5, majority: 0.5, two_thirds: 0.6667, tax_points: 5}
  republic: {support: 50, turns: 12}   # 共和制: 選挙で支持率がこれを超えたら、次のこのターン数は体制の補正を足す
  transition: {turns: 24, productivity: 0.1}  # 体制を変えた後の混乱期間と、生産性の落ち込み（一様に戻る）
  monarch_age: 40       # 君主制の君主の初めの年齢（12 ターンで 1 つ上がる）
  history: 12           # 選挙と採決の履歴を残す数
  # 暴動（政情が levels.riot 未満）: urban 以上の住宅地から radius マスの中の施設のうち、halt_share の
  # 割合を halt_turns ターン止め、国営の施設は destroy_chance で壊れる（直すのに建てるときの資材と
  # 人手の repair_share が要る）。反乱の前触れは効き目が 2 倍。警察で働く人が住民 × police_per_person
  # に足りている割合 × police_effect だけ、止まる数と壊れる見込みを減らす
  riot: {urban: town, radius: 1, halt_share: 0.1, halt_turns: [1, 3], destroy_chance: 0.02,
         repair_share: 0.2, police_per_person: 0.002, police_effect: 0.8}
  # 労働の動員（全体主義）: 住民のうち働く人の割合に share を足し、失業者を国営施設に最低賃金
  # （決めていなければ平均賃金の wage）で割り当てる
  mobilization: {share: 0.05, wage: 0.5}

# 計画経済（フェーズ3-4。hakoniwa_core/economy/plan.py）
planning:
  # 公定価格は原則据え置き。review_turns ごとに原価（原価＋1割を今の平均賃金で解く）を確かめ、
  # 公定価格との差が review_band（割合）を超えた財だけ原価に改める。held_goods（食料）は原価を
  # 下回っても据え置き、差を補助金で埋める（ソ連の小売価格の据え置きに寄せた既定。命令で変えられる）
  review_turns: 12      # 原価との差を確かめる間隔
  review_band: 0.2      # 見直す幅（±20%）
  held_goods: [grain, fish, meat, food]  # 原価を下回っても据え置く財
  demand_turns: 12      # 生産目標に使う需要の履歴のターン数
  target_markup: 0.1    # 生産目標 = 需要の平均 ×（1 + これ）
  max_priority: 3       # 重点産業の数の上限

# 外交（フェーズ4-1。hakoniwa_core/diplomacy と hakoniwa_core/modules/diplomacy）
diplomacy:
  proposal_turns: 12    # 条約の提案が返事を待つターン数（過ぎると流れる）
  max_proposals: 6      # 1つの島が出せる、返事待ちの提案の数
  notice_turns: 3       # 予告つきの破棄の予告のターン数の既定（条項で決めなければ）
  min_notice_turns: 1
  max_notice_turns: 24
  withdraw_turns: 3     # 講和の引き揚げの期限の既定（講和が効いてから、相手の島の部隊が引き揚げるターン数）
  max_withdraw_turns: 12
  max_reparation_turns: 60  # 講和の賠償の期日（効いてから）の上限
  # 条約の違反が残す信用の傷: 国債の利回りへの上乗せ。違反の重み 1 ごとに violation_premium を、
  # violation_decay_turns ターンかけて 0 に減らし、足し合わせた上乗せは violation_premium_max まで
  # （債務不履行は bonds.default_premium。違反は銀行が国債を買わなくなるほどは重くない）
  violation_premium: 0.03
  violation_premium_max: 0.1
  violation_decay_turns: 60
  # 経済の取り決めの条項（回4-1 の②）
  violation_repeat_turns: 12  # 契約の不足の違反を、同じ条項で重ねて記録しない間（ターン数）
  max_contract_turns: 600     # 契約の条項の期間の上限（trade の契約と同じ）
  max_aid_period_turns: 12    # 援助の約束の、送る間隔の上限
  max_aid_count: 24           # 援助の約束の、送る回数の上限

# 賞（フェーズ4-1。server/web/awards.py。島の一覧と国の公開ページに出す。元の箱庭諸島の賞の名前）
awards:
  prosperity: [50000, 100000, 200000]  # 繁栄賞・超繁栄賞・究極繁栄賞: 人口がこの人数に届いたことがある
  peace_kills: 10000    # 平和賞（元の箱庭諸島と同じ皮肉）: 戦争で殺した相手の数の累計がこの人数に届いた国
  calm_turns: 120       # 平穏賞: 災害・暴動・反乱・戦争がこのターン数のあいだ続けてない（建国から数える）
  calamity_count: 24    # 災難賞: 災害・暴動・反乱・飢え・倒産・債務不履行・銀行の破綻の出来事の数
  cup_turns: 120        # ターン杯: 建国から最も長く続いている国（休止中を除く）。これ以上続いた国だけ

# 記念碑（フェーズ4-1。hakoniwa_core/monuments.py。設計書 タブ 2 の PO-47）。建てられる条件のしきい値
monuments:
  founding_turns: 12     # 建国記念碑: 建国からこのターン数（1 年）以上
  peace_turns: 120       # 平和記念碑: 災害・暴動・反乱・戦争の始まりと終わりがこのターン数のあいだ続けてない（10 年。建国から数える）
  cenotaph_dead: 1000    # 慰霊碑: 飢え・戦争で亡くなった人が、原因ごとにこの人数以上
  ledger_turns: 12       # 帳簿の碑: 最初の決算（建国から 1 年）を終えた国
  verification_turns: 50 # 検証の碑: 建国からこのターン数以上

# 軍事（フェーズ4-2。設計書 docs/design/15-military.md。初めの値は /mnt/project-files/phase4/military-values-draft.md）
military:
  # 鉱脈（MI-60）: 世界の種と島の番号だけで決め、島ごとに 1 度だけ、鉱業資源の上限の外に置く。
  # 値は置く島の割合（銅は多くの国が小さくても持つが、主な産地は限られる）
  veins: {copper_ore: 0.4, uranium_ore: 0.15}
  # 兵と軍の維持（4-2 の②。設計書 MI-07〜MI-14・MI-53）。建国の島は軍を持たない（国防費 0）
  volunteer_wage: 1.0   # 志願の兵の賃金（島の平均賃金に対する倍率。命令 set_defense で変えられる）
  conscript_wage: 0.3   # 徴兵の兵の賃金（同じ）
  max_share: 0.15       # 兵の数の上限（住民と兵の合計に対する割合。総力戦でも 1 割台）
  recruit_share: 0.02   # 志願で、失業者のほかに働いている人から集まる人数の上限（住民に対する割合）
  conscript_share: 0.05 # 徴兵 1 回で集められる人数の上限（住民に対する割合）
  keep_per_tile: 1      # 兵に取られても各マスに残す人数
  food_per_thousand: 2.4  # 兵 1000 人が 1 ターンに食べる食べ物（トン。家計の 1.2 倍）
  food_stock_turns: 2   # 国の倉庫に持っておく食べ物のターン数
  buy_limit: 2.0        # 食べ物・弾薬・装備を国として買う注文の指値（今の値段に対する倍率）
  starve: 0.05          # 食べ物がまったくないターンに、病気と飢えで亡くなる兵の割合
  training: {rate: 0.2, basic: 0.6, hungry: 0.2}  # 練度: 1 ターンに増える量、基礎訓練の上限（3 ターン）、食べ物がないときに落ちる量
  morale: {start: 0.7, late: 0.1, hungry: 0.15, recover: 0.02, desert_below: 0.5, desert_rate: 0.2}
  # 徴兵した兵が住民に占める割合 1% ごとに政情の目標を下げる量と、下げる量の上限
  conscription: {stability: 2.0, max: 20.0}
  # 部隊と基地（4-2 の③。設計書 MI-18〜MI-21）
  ammo_per_thousand: 0.5  # 戦わないターンに、兵 1000 人が使う弾薬（トン。訓練の分）
  move:
    terrain_cost: {plain: 1, forest: 2, mountain: 2}  # マスに入るのに使う動きのマス数（山と森は 2 マス分）
    road_bonus: 0.5       # 道路の整備度が満ちたマスで進める量が増える割合（1.5 倍）
    fuel_per_tile: 0.01   # 車両 1 両が 1 マス進むのに使う燃料（トン）
  trench: {soldiers: 50, turns: 2, materials: {building_materials: 2}}  # 陣地: 掘る兵の数・かかるターン数・使う建材
  # 艦隊と海の動き（4-2 の③'。設計書 MI-18・MI-22・MI-23）
  sea:
    max_ships: 10         # 1 つの艦隊に束ねられる艦の数
    port_fuel: 0.1        # 母港の区画につないでいる間に使う燃料（航海中に対する割合）
  vision: {land: 2}       # 陸の部隊が見える範囲（周りのマス。MI-26）
  missiles:               # ミサイルと防空（4-3 の③。設計書 MI-37・MI-38）
    range: 8              # 射程（世界マップの区画。島の区画どうしの距離）
    fire_per_turn: 4      # 基地 1 つが 1 ターンに撃てる数
    drift: 0.3            # 1 発ごとに隣のマスに落ちる見込み
    intercept: 0.5        # 防空陣地の迎撃ミサイル 1 発が 1 発を落とす見込み
    shield_radius: 2      # 防空陣地が守るマスの範囲（周りのマス）
    ruin: 0.6             # 当たったマスの施設が壊れる見込み（残りは halt_turns 止まる）
    halt_turns: 6         # 壊れなかった施設が止まるターン数
    dead: 0.05            # 当たった住宅のマスの住民が亡くなる割合
    flee: 0.3             # 同じく逃げる割合
    infra: 0.5            # 港と道路（交通の整備度）が残る割合
    violation_weight: 1   # 住宅を撃ったときの違反の重み（信用の傷。MI-06）
  refugees:               # 戦争の難民（MI-61）
    abroad_share: 0.5     # 戦場から逃げる人のうち、受け入れてくれる国があれば国外へ逃げたい割合
  nuclear:                # 核兵器（4-3 の③b。設計書 MI-46・MI-47）
    dead: [0.4, 0.2, 0.05]    # 着弾したマス・隣の 1 周・その外の 1 周の住民が亡くなる割合（広島は 3〜4 割）
    flee: 0.3             # 生き残った住民が逃げる割合
    fallout: [8, 5, 3]    # 同じ 3 つの輪に残る汚染の濃さ（毎ターン計算する汚染に足す。PO-36）
    half_life: 120        # 残る汚染が半分になるターン数（10 年）
    infra: 0.1            # 輪の中の港と道路（交通の整備度）が残る割合
    intercept: 0.3        # 防空陣地の迎撃ミサイル 1 発が核弾頭を落とす見込み（ふつうのミサイルより低い）
    violation_weight: 5   # 使ったときの違反の重み（信用の傷。住宅へのふつうの攻撃は 1）
    treaty_weight: 3      # 核を持たない約束を破ったときの違反の重み
  naval:                  # 海の戦い・護衛・通商破壊・封鎖（MI-31〜35・MI-48・MI-56・MI-57）
    base_loss: 0.2        # 強さが同じとき、1 ターンに沈む艦の割合
    exponent: 0.7         # 沈む割合 = base_loss × (相手の強さ ÷ 自分の強さ)^exponent
    max_loss: 0.6         # 1 ターンに沈む割合の上限
    ambush: 2.0           # 潜水艦が見つからないまま撃つときの強さの倍率（不意打ち）
    radar: 1.2            # レーダー（施設）のある国の強さの倍率
    watch_radius: 1       # 見張りの艦隊が商船を見つける範囲（艦隊の区画の周りの区画。潜水艦は同じ区画だけ）
    escort_find: 0.5      # 護衛の艦が、襲ってきた艦 1 隻を見つけて沈める見込み
    blockade_full: 2      # 封鎖で出入りする船をすべて止めるのに要る軍艦の数（1 隻なら半分）
    risk_cap: 0.5         # 戦争の危険の上乗せに見込む沈む確率の上限
  # 陸の戦闘と揚陸と占領（4-3 の①。設計書 MI-24〜MI-30・MI-36・MI-42・MI-49）
  combat:
    base_loss: 0.15       # 強さが同じとき、1 ターンに失う兵と装備の割合
    exponent: 0.7         # 損害 = base_loss × (相手の強さ ÷ 自分の強さ)^exponent
    max_loss: 0.6         # 1 ターンの損害の上限
    killed_share: 0.25    # 損害のうち戦死の割合（残りは負傷。戦死:負傷 = 1:3）
    wounded_return: {turns: 3, share: 0.5}  # 負傷から戻るまでのターン数と、戻る割合（残りは除隊して家へ）
    defense: {forest: 1.3, mountain: 1.6, town: 1.3, city: 1.5, trench: 1.3, fortress: 2.0, cap: 3.5}
    armor_mountain: 0.5   # 機甲が山で戦うときの強さの倍率
    equipment_floor: 0.1  # 装備のそろいの下限（強さが 0 になって 0÷0 にならないように）
    landing_weak: 0.5     # 港でない所に下ろしたターンの強さの倍率
    landing_tons: 40      # 港でない所に 1 ターンに下ろせる重さ（トン。輸送船 1 隻分）
    surprise: 1.3         # 宣戦と同じターンの初めの戦闘で、宣戦した側の強さの倍率
    stalemate_turns: 6    # 決着しないまま続いたら、攻めた側が元のマスへ退くターン数
    training_floor: 0.5   # 練度 0 の兵の強さの倍率（練度 1 で 1 倍）
    ammo_floor: 0.3       # 弾薬が尽きたときの強さの倍率
    hungry: 0.7           # 食べ物が尽きたときの強さの倍率
    morale_floor: 0.2     # 士気が低くても、強さの倍率はこれより下げない
    min_casualties: 1     # 1 回の戦いで、戦っている側が必ず失う兵の数
    ammo_per_thousand: 36 # 戦ったターンに兵 1000 人が使う弾薬（トン）
    fuel_per_vehicle: 0.2 # 戦ったターンに車両 1 両が使う燃料（トン）
    break: {morale: 0.3, ratio: 3.0, remaining: 0.5}  # 崩れる条件: 士気が下回る・相手の強さがこの倍以上・戦い始めの兵がこの割合を下回る
    morale: {win: 0.05, lose: 0.1, rout: 0.2}  # 戦いで士気が動く量（勝った・負けた・崩れて退いた）
    training_gain: 0.03   # 戦ったターンに練度が上がる量（上限 1）
    police: {per_person: 0.3, workers: 100}   # 警察の守り: 警察 100 人ぶんが歩兵中隊の 0.3 の強さ
    civilians: {dead: 0.02, flee: 0.2}  # 戦場のマスの住民が 1 ターンに亡くなる割合と、同じ島のほかの町へ逃げる割合
    facilities: {halt: 0.3, destroy: 0.05, halt_turns: 2}  # 戦場の施設が 1 ターンに止まる・壊れる見込みと、止まるターン数
  supply:
    store_turns: 3        # 外国の島の部隊が持てる食べ物・弾薬・燃料のターン数
    unload_per_ship: 8    # 輸送船 1 隻が 1 ターンに陸の部隊へ渡せる補給（トン。揚陸した海岸）
    port_unload: 4.0      # 占領した港があれば、渡せる量の倍率
    starve: 0.05          # 食べ物がまったくないターンに、外国の島の部隊から病気と飢えで亡くなる割合
  occupation:
    prisoner_turns: 24    # 講和がなくても、捕虜を帰すまでのターン数（2 年）
    requisition: [food, ammunition, fuel]   # 占領したマスの施設の在庫から取り立てられる物
  war:
    rally: {stability: 5.0, turns: 3}       # 宣戦の後、一時だけ政情の目標が上がる量とターン数（旗の下の団結）
    weariness: {scale: 8.0, k: 200.0, max: 25.0}  # 厭戦: 政情の目標を scale × log(1 + k × 戦死者 ÷ 人口) 下げる（上限 max）
    occupied: {stability: 30.0, max: 30.0}  # 占領されたマスの住民の割合 1（全部）ごとに政情の目標を下げる量と上限
